name: Add-On Build AC25-29
on:
  push:
    paths:
        - 'Sources/**'
        - 'Tools/**'
        - 'CMakeLists.txt'
        - 'config.json'
  workflow_dispatch:


defaults:
  run:
    shell: bash

jobs:
  build_win:
    strategy:
      fail-fast: false
      matrix:
        ac-version: [25, 26, 27, 28, 29]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Checkout the submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: 3.8
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests
      
      - name: Run build script
        run: |
          python Tools/BuildAddOn.py --configFile config.json --acVersion ${{ matrix.ac-version }} --release  --package
      - name: Get Time
        id: time
        uses: nanzm/get-time-action@master
        with:
          format: 'YYYY-MM-DD-HH'
      - name: Upload Artifact
        env:
          TIME: "${{ steps.time.outputs.time }}"
        uses: actions/upload-artifact@v4
        with:
          name: SomeStuff AC${{ matrix.ac-version }} Win ${{ env.TIME }}
          path: Build/Package/SomeStuff/${{ matrix.ac-version }}
  build_mac:
    strategy:
      fail-fast: false
      matrix:
        ac-version: [25, 26, 27, 28, 29]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Checkout the submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Setup Xcode
        if: runner.os == 'macOS'
        run: |
          xcVersion=15.1
          echo "Using Xcode version: ${xcVersion}"
          sudo xcode-select -s /Applications/Xcode_${xcVersion}.app
    
      - name: Run build script
        run: |
          python Tools/BuildAddOn.py --configFile config.json --acVersion ${{ matrix.ac-version }} --release  --package
      - name: Get Time
        id: time
        uses: nanzm/get-time-action@master
        with:
          format: 'YYYY-MM-DD-HH'
      - name: Upload Artifact
        env:
          TIME: "${{ steps.time.outputs.time }}"
        uses: actions/upload-artifact@v4
        with:
          name: SomeStuff AC${{ matrix.ac-version }} Mac ${{ env.TIME }}
          path: Build/Package/SomeStuff/${{ matrix.ac-version }}

  publish_test:
    needs: [build_win, build_mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "SomeStuff AC*"
          path: builds

      - name: Get Time
        id: time
        uses: nanzm/get-time-action@master
        with:
          format: 'YYYY-MM-DD-HHmm'

      - name: Pack release zips
        env:
          TIME: "${{ steps.time.outputs.time }}"
        run: |
          set -euo pipefail
          command -v zip >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq zip; }
          ls -la builds
          count=0
          for dir in builds/*/; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            ac=$(sed -E 's/^SomeStuff (AC[0-9]+) (Win|Mac) .*/\1/' <<< "$name")
            os=$(sed -E 's/^SomeStuff (AC[0-9]+) (Win|Mac) .*/\2/' <<< "$name")
            zip="$(pwd)/builds/SomeStuff.${ac}.${os}.${TIME}.zip"
            (cd "$dir" && zip -qr "$zip" .)
            echo "packed: $zip"
            unzip -l "$zip" | sed -n '1,12p'
            count=$((count+1))
          done
          [ "$count" -gt 0 ] || { echo "нет артефактов в builds/"; exit 1; }
          ls -la builds/*.zip

      - name: Publish prerelease test-${{ steps.time.outputs.time }}
        env:
          GH_TOKEN: ${{ github.token }}
          TIME: ${{ steps.time.outputs.time }}
        run: |
          set -euo pipefail
          if gh release view "test-$TIME" >/dev/null 2>&1; then
            gh release upload "test-$TIME" builds/*.zip --clobber
          else
            gh release create "test-$TIME" builds/*.zip \
              --prerelease \
              --title "Тестовая сборка $TIME" \
              --notes "Автоматическая тестовая сборка: ArchiCAD 25-29, Windows/macOS. Это НЕ релиз: возможны ошибки, берите копию проекта. Описание текущей работы и ссылки: https://kuvbur.org/ru/addons/somestuff/test/"
          fi

      - name: Keep only 5 latest test releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease) | select(.tagName|startswith("test-")) | .tagName' \
            | tail -n +6 \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag
