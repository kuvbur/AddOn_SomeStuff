<!DOCTYPE html>
<!--
  =====================================================================================
  Archicad — Палитра «Отделка зон»
  =====================================================================================
  Правила те же, что в Interface_ru.html:
    - Один файл, Vanilla HTML/JS. Только inline-стили, без отдельного CSS-блока.
    - Цвета только через var(--ac-*); тема меняется на <html> (applyTheme).
    - Строки интерфейса только через I18N_CATALOG и t(ключ).
    - Весь обмен с Archicad идёт через ACBridge. Каждая функция моста: сначала
      пробует window.ACAPI.<Метод>, при его отсутствии отдаёт мок (предпросмотр вне Archicad).
    - Мост принимает НЕ БОЛЬШЕ ОДНОГО аргумента: строку (JSON.stringify) или без аргументов.
      Ответ — JSON-строка или объект, синхронно или Promise.
  Что делает интерфейс: список типов отделки. Тип — сворачиваемая карточка. Кнопка ⟳ в
  заголовке карточки записывает тип во все зоны с этим типом; «Обновить все» — во все зоны.
  =====================================================================================
-->

const I18N_INDEX = Object.create(null);
I18N_CATALOG.forEach(function (e) { I18N_INDEX[e.key] = e.text; });
function t(key, params) {
  var text = I18N_INDEX[key];
  if (text === undefined) { if (typeof console !== 'undefined' && console.error) console.error('i18n: нет ключа ' + key); return key; }
  if (!params) return text;
  return text.replace(/\{([A-Za-z_][A-Za-z0-9_]*)\}/g, function (whole, name) {
    var v = params[name]; return v === undefined || v === null ? whole : String(v);
  });
}
// Форма слова «зона» по числу (русские правила).
function zonesText(n) {
  var m10 = n % 10, m100 = n % 100;
  var key = (m10 === 1 && m100 !== 11) ? "finish.zones.one" :
            (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) ? "finish.zones.few" : "finish.zones.many";
  return t(key, { count: n });
}

/* ===================================== 1. ТЕМА ===================================== */
const THEMES = {
  light: { "--ac-bg-workspace": "#FFFFFF", "--ac-bg-elevated": "#F8F9FB", "--ac-bg-hover": "#EEF1F6", "--ac-bg-input": "#FFFFFF",
    "--ac-text-primary": "#1A1D23", "--ac-text-secondary": "#5B6472", "--ac-text-tertiary": "#646D7B",

    "--ac-text-primary": "#EDEFF3", "--ac-text-secondary": "#A7AFBD", "--ac-text-tertiary": "#8A93A2",
    "--ac-border": "#2C3038", "--ac-divider": "#262A33", "--ac-accent": "#5B8DEF", "--ac-accent-soft": "#23324D",
    "--ac-accent-contrast": "#0B0D10", "--ac-danger": "#F1666B", "--ac-shadow-color": "rgba(0,0,0,0.45)" }
};
const STATE = {
  theme: "light",   // по умолчанию светлая тема
  options: {},      // списки значений из ACBridge.getOptions()
  types: [],        // типы отделки из ACBridge.getState()
  open: {},         // id типа -> раскрыта ли карточка
  busy: false,      // идёт обновление зон: все кнопки обновления заблокированы
  preview: false    // true вне Archicad (работает мок)
};
function applyTheme(name) {
  STATE.theme = name;
  const root = document.documentElement;
  for (const key in THEMES[name]) root.style.setProperty(key, THEMES[name][key]);
  root.style.setProperty("--ac-color-scheme", name);
  const icon = document.getElementById("theme-toggle-icon");
  if (icon) icon.textContent = name === "light" ? "\u263D" : "\u2600";
}

/* ============================ 2. МОСТ С ARCHICAD (МОК) ============================
   Структура FinishType (id-значения берутся из списков getOptions; null = не задано):
   { id, name, zoneCount,
     ceiling:{type,plinth,heightMm:number|null,byZoneHeight:boolean}, // byZoneHeight true — высота потолка = высоте зоны: heightMm и aboveCeiling
                                                                       // игнорируются (в интерфейсе заблокированы, значения не стираются)
     aboveCeiling:{type},                              // null = «Отключено»
     floor:{type,plinth}, walls:{finish},
     columns:{sameAsWalls:boolean, finish},
     wallBottom:{finish, heightMm:number|null} }
   ================================================================================== */
const ACBridge = (function () {
  function delay(ms) { return new Promise(function (res) { setTimeout(res, ms); }); }
  function copy(o) { return JSON.parse(JSON.stringify(o)); }

  // Вызов нативного метода. Нет моста — null (вызывающий отдаёт мок).
  // Аргумент один: строка. Без аргумента — вызов без параметров (иначе падает CEF-мост).
  function callNative(method, arg) {
    try {
      if (typeof window.ACAPI === "undefined" || !window.ACAPI[method]) return null;
      var call = (arg === undefined) ? window.ACAPI[method]() : window.ACAPI[method](arg);
      var unwrap = function (d) { return typeof d === "string" ? JSON.parse(d) : d; };
      if (call && typeof call.then === "function") return call.then(unwrap);
      return Promise.resolve(unwrap(call));
    } catch (e) { return Promise.reject(e); }
  }
  function list() { return Array.prototype.slice.call(arguments).map(function (n, i) { return { id: String(n), name: n }; }); }

  const MOCK_OPTIONS = {
    ceilingTypes: list("Окраска", "Подвесной Армстронг", "Натяжной"),
    ceilingPlinths: list("Галтель 50", "Галтель 80"),
    aboveCeiling: list("Штукатурка", "Затирка"),
    floorTypes: list("Ламинат", "Керамогранит", "Линолеум"),
    floorPlinths: list("МДФ 80", "ПВХ 60"),
    wallFinishes: list("Обои", "Покраска", "Плитка"),
    columnFinishes: list("Обои", "Покраска", "Плитка"),
    wallBottomFinishes: list("Панель МДФ", "Плитка", "Окраска масляная")
  };
  function mockType(id, name, zones, c, cp, f, fp, w, bf, bh) {
    return { id: id, name: name, zoneCount: zones, ceiling: { type: c, plinth: cp, heightMm: null, byZoneHeight: true }, aboveCeiling: { type: null },
      floor: { type: f, plinth: fp }, walls: { finish: w }, columns: { sameAsWalls: true, finish: w },
      wallBottom: { finish: bf, heightMm: bh } };
  }
  const MOCK_TYPES = [
    mockType("mock-1", "Жилая комната", 14, "Окраска", "Галтель 50", "Ламинат", "МДФ 80", "Обои", null, null),
    mockType("mock-2", "Санузел", 6, "Окраска", null, "Керамогранит", null, "Плитка", "Плитка", 2100),
    mockType("mock-3", "Коридор", 9, "Подвесной Армстронг", null, "Линолеум", "ПВХ 60", "Покраска", "Панель МДФ", 1200)
  ];
  MOCK_TYPES[2].ceiling.byZoneHeight = false;  // подвесной потолок ниже высоты зоны
  MOCK_TYPES[2].ceiling.heightMm = 2700;

  /** AGENT TODO: window.ACAPI.GetFinishOptions() (без аргументов) -> JSON {ceilingTypes:[{id,name}], ceilingPlinths, aboveCeiling,
   *  floorTypes, floorPlinths, wallFinishes, columnFinishes, wallBottomFinishes}. */
  function getOptions() {
    return callNative("GetFinishOptions") || delay(250).then(function () { return copy(MOCK_OPTIONS); });
  }
  /** AGENT TODO: window.ACAPI.GetFinishState() -> JSON {types:[FinishType]}; zoneCount считает C++ по параметру зон. */
  function getState() {
    return callNative("GetFinishState") || delay(150).then(function () { return { types: copy(MOCK_TYPES) }; });
  }
  /** AGENT TODO: window.ACAPI.SaveFinishType(JSON.stringify(FinishType)) -> {success:boolean}. Вызывается с debounce 400 мс. */
  function saveType(type) {
    return callNative("SaveFinishType", JSON.stringify(type)) || delay(120).then(function () { return { success: true }; });
  }
  /** AGENT TODO: window.ACAPI.AddFinishType() (без аргументов) -> JSON FinishType с новым id, пустыми значениями, zoneCount 0. */
  function addType() {
    return callNative("AddFinishType") || delay(120).then(function () {
      return mockType("mock-" + Date.now(), t("finish.newName"), 0, null, null, null, null, null, null, null);
    });
  }
  /** AGENT TODO: window.ACAPI.DeleteFinishType(id) (строка) -> {success:boolean}. Зоны не меняются. */
  function deleteType(id) {
    return callNative("DeleteFinishType", String(id)) || delay(100).then(function () { return { success: true }; });
  }
  /** AGENT TODO: window.ACAPI.UpdateFinishZones(JSON.stringify(FinishType)) -> JSON {updated:number, locked:number}.
   *  C++ находит все зоны с этим типом отделки и записывает в их параметры значения из переданного объекта.
   *  Единственная ошибка — зона заблокирована (слой закрыт или зона не зарезервирована): такие зоны
   *  пропускаются и считаются в locked. updated — число реально записанных зон. */
  function updateZones(type) {
    return callNative("UpdateFinishZones", JSON.stringify(type)) || delay(600).then(function () {
      // Мок: у «Коридора» две зоны заблокированы, чтобы был виден вид ошибки в интерфейсе.
      var locked = type.id === "mock-3" ? 2 : 0;
      return { updated: Math.max(0, type.zoneCount - locked), locked: locked };
    });
  }
  /** AGENT TODO: window.ACAPI.UpdateAllFinishZones() (без аргументов; типы уже сохранены через SaveFinishType)
   *  -> JSON {results:[{id, updated:number, locked:number}]} (locked — как в UpdateFinishZones). */
  function updateAllZones() {
    return callNative("UpdateAllFinishZones") || delay(900).then(function () {
      return { results: MOCK_TYPES.map(function (x) {
        var locked = x.id === "mock-3" ? 2 : 0;
        return { id: x.id, updated: Math.max(0, x.zoneCount - locked), locked: locked };
      }) };
    });
  }
  return { getOptions: getOptions, getState: getState, saveType: saveType, addType: addType,
           deleteType: deleteType, updateZones: updateZones, updateAllZones: updateAllZones };
})();

      on: { click: function () { status.textContent = t("finish.check.pending"); } } });
    return h("div", { attrs: { id: "panel-" + id, role: "tabpanel", "aria-labelledby": "tab-" + id },
      style: "flex:1 1 auto;min-height:0;overflow:auto;padding:0.5rem;display:none;flex-direction:column;align-items:flex-start;gap:0.5rem;" },
      [button, status]);
  }
  function propertiesPanel() {
    const panel = checkPanel("properties", "finish.check.properties");
    const status = h("div", { attrs: { role: "status" }, text: t("finish.properties.pending"),
      style: "font-size:0.75rem;color:var(--ac-text-secondary);" });
    const pending = function () { status.textContent = t("finish.properties.pending"); };
    const load = h("button", { text: t("finish.properties.load"), style: TEXT_BTN_STYLE, on: { click: pending } });
    const apply = h("button", { text: t("finish.properties.apply"), style: TEXT_BTN_STYLE, on: { click: pending } });
    const overwrite = h("input", { attrs: { type: "checkbox", disabled: "disabled" } });
    panel.appendChild(h("div", { text: t("finish.properties.hint"), style: "font-size:0.75rem;color:var(--ac-text-secondary);" }));
    panel.appendChild(h("label", { style: "font-size:0.75rem;display:flex;align-items:center;gap:0.3rem;" },
      [overwrite, document.createTextNode(t("finish.properties.overwrite"))]));
    panel.appendChild(load); panel.appendChild(status);
    const markers = ["has_ceil", "has_floor", "floor_by_slab", "ceil_by_slab", "type", "type_ceil", "type_floor",
      "main_material", "main_height", "up_material", "down_material", "down_height", "column_material", "ceil_material",
      "ceil_result", "main_result", "up_result", "down_result", "reveal_result", "ceil_result_bytype", "main_result_bytype",
      "up_result_bytype", "down_result_bytype", "reveal_result_bytype"];
    const rowStyle = "align-self:stretch;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);gap:0.4rem;align-items:start;";
    panel.appendChild(h("div", { style: rowStyle + "font-size:0.7rem;font-weight:600;" },
      [h("div", { text: t("finish.properties.purpose") }), h("div", { text: t("finish.properties.description") }),
        h("div", { text: t("finish.properties.property") })]));
    markers.forEach(function (suffix) {
      const marker = "some_stuff_fin_" + suffix;
      const purpose = t("finish.property." + suffix);
      const select = h("select", { attrs: { disabled: "disabled", "aria-label": t("finish.property." + suffix) },
        style: "width:100%;min-width:0;color:var(--ac-text-secondary);background:var(--ac-bg-input);border:1px solid var(--ac-border);" },
        [h("option", { text: t("finish.properties.select") })]);
      panel.appendChild(h("div", { style: rowStyle + "border-bottom:1px solid var(--ac-divider);padding:0.3rem 0;" },
        [h("div", { text: purpose, style: "min-width:0;font-size:0.75rem;overflow-wrap:anywhere;" }),
          h("div", { text: purpose + " (" + marker + ")", style: "min-width:0;font-size:0.68rem;color:var(--ac-text-secondary);overflow-wrap:anywhere;" }), select]));
    });
    panel.appendChild(apply);
    return panel;
  }
  const tabs = [
    { id: "types", label: "finish.tab.types", panel: typesPanel },
    { id: "favorites", label: "finish.tab.favorites", panel: checkPanel("favorites", "finish.check.favorites") },
    { id: "properties", label: "finish.tab.properties", panel: propertiesPanel() }
  ];
  const tabBar = h("div", { attrs: { role: "tablist" },
    style: "flex:0 0 auto;display:flex;flex-wrap:wrap;gap:0.2rem;padding:0.3rem 0.5rem;border-bottom:1px solid var(--ac-border);" });
  function selectTab(id) {
    tabs.forEach(function (tab) {
      const selected = tab.id === id;
      tab.panel.style.display = selected ? "flex" : "none";
      tab.button.setAttribute("aria-selected", String(selected));
      tab.button.style.background = selected ? "var(--ac-accent-soft)" : "var(--ac-bg-input)";
      tab.button.style.color = selected ? "var(--ac-accent)" : "var(--ac-text-primary)";
    });
  }
  tabs.forEach(function (tab) {
    tab.button = h("button", { text: t(tab.label), attrs: { id: "tab-" + tab.id, role: "tab", "aria-controls": "panel-" + tab.id },
      style: TEXT_BTN_STYLE, on: { click: function () { selectTab(tab.id); } } });
    tabBar.appendChild(tab.button);
  });
  app.appendChild(topBar); app.appendChild(tabBar);
  tabs.forEach(function (tab) { app.appendChild(tab.panel); });
  selectTab("types");
  if (STATE.preview) setNote(t("finish.preview"), false);
  syncAllBtn();

  ACBridge.getOptions().then(function (o) { STATE.options = o; return ACBridge.getState(); })
    .then(function (s) {
      STATE.types = s.types || [];
      STATE.types.forEach(function (x, i) { if (i === 0) STATE.open[x.id] = true; addCard(x); });  // первый тип раскрыт
      syncEmpty();
    })
    .catch(function () { setNote(t("finish.error.bridge"), true); syncEmpty(); });
}

/* ===================================== 6. ЗАПУСК ===================================== */
document.addEventListener("DOMContentLoaded", function () {
  applyTheme(STATE.theme);
  buildApp();
  window.addEventListener("pagehide", function () { Object.keys(CARDS).forEach(function (id) { CARDS[id].flush(); }); });
});
</script>
</body>
</html>
