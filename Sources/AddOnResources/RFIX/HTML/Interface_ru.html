<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактор описаний свойств Archicad</title>
</head>
<body id="appBody" style="margin: 0; padding: 12px; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; background-color: #1e1e1e; color: #cccccc; box-sizing: border-box;">

    <!-- ШАПКА И ПЕРЕКЛЮЧЕНИЕ ТЕМЫ -->
    <div id="headerBar" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #3c3c3c;">
        <span style="font-weight: bold; font-size: 14px; color: #ffffff;" id="headerTitle">Редактор описаний свойств</span>
        <button id="themeToggleBtn" onclick="app.toggleTheme()" style="background-color: #3a3d41; color: #ffffff; border: 1px solid #555555; padding: 4px 10px; border-radius: 3px; cursor: pointer; font-size: 12px;">
            ☀️ Светлая тема
        </button>
    </div>

    <!-- ПАНЕЛЬ СОСТОЯНИЯ КОМАНД (14 иконок) -->
    <div id="commandBar" style="background-color: #252526; border: 1px solid #3c3c3c; border-radius: 4px; padding: 8px; margin-bottom: 12px;">
        <div data-type="label" style="font-weight: bold; margin-bottom: 6px; color: #569cd6; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;">
            Состояния команд
        </div>
        <div id="cmdIconsContainer" style="display: flex; flex-wrap: wrap; gap: 4px;">
            <!-- Иконки генерируются из файлов *.svg -->
        </div>
    </div>

    <!-- РАЗДЕЛ 1: Отслеживание значений свойств -->
    <div id="section1" style="background-color: #252526; border: 1px solid #3c3c3c; border-radius: 4px; padding: 10px; margin-bottom: 12px;">
        <div data-type="label" style="font-weight: bold; margin-bottom: 8px; color: #569cd6; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;">
            1. Отслеживание значения свойства
        </div>
        
        <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 8px;">
            <label style="width: 130px; font-weight: 500;">Выбор свойства:</label>
            <select id="propSelect1" onchange="app.onSelectProperty(this.value)" style="flex: 1; background-color: #3c3c3c; color: #ffffff; border: 1px solid #555555; padding: 5px; border-radius: 3px; font-size: 12px;">
                <option value="">-- Загрузка свойств... --</option>
            </select>
        </div>

        <div style="display: flex; gap: 8px; align-items: center;">
            <label style="width: 130px; font-weight: 500;">Текущее значение:</label>
            <input type="text" id="currentValueInput" readonly placeholder="Значение выделенного элемента..." style="flex: 1; background-color: #2d2d2d; color: #9cdcfe; border: 1px solid #444444; padding: 5px; border-radius: 3px; font-size: 12px; font-family: monospace;">
            <button id="btnRefreshVal" onclick="app.refreshPropertyValue()" style="background-color: #0e639c; color: #ffffff; border: none; padding: 5px 12px; border-radius: 3px; cursor: pointer; font-size: 12px;">
                Обновить
            </button>
        </div>
    </div>

    <!-- РАЗДЕЛ 2: Работа с описаниями -->
    <details id="section2" open style="background-color: #252526; border: 1px solid #3c3c3c; border-radius: 4px; padding: 10px;">
        <summary style="font-weight: bold; color: #569cd6; cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; outline: none; margin-bottom: 8px;">
            2. Работа с описаниями (Редактор)
        </summary>

        <div style="display: flex; gap: 8px; align-items: center; margin-top: 8px; margin-bottom: 8px;">
            <label style="width: 130px; font-weight: 500;">Выбранное свойство:</label>
            <select id="propSelect2" onchange="app.onSelectProperty(this.value)" style="flex: 1; background-color: #3c3c3c; color: #ffffff; border: 1px solid #555555; padding: 5px; border-radius: 3px; font-size: 12px;">
                <option value="">-- Загрузка свойств... --</option>
            </select>
        </div>

        <div style="margin-bottom: 8px;">
            <label style="display: block; font-weight: 500; margin-bottom: 4px;">Текущее описание (PropertyCache):</label>
            <textarea id="currentDescArea" readonly rows="2" style="width: 100%; box-sizing: border-box; background-color: #2d2d2d; color: #ce9178; border: 1px solid #444444; padding: 5px; border-radius: 3px; font-size: 11px; font-family: monospace; resize: vertical;"></textarea>
        </div>

        <!-- ВКЛАДКИ КОМАНД -->
        <div style="margin-bottom: 8px;">
            <div id="tabHeaders" style="display: flex; border-bottom: 1px solid #3c3c3c; background-color: #1e1e1e; border-top-left-radius: 3px; border-top-right-radius: 3px;">
                <button onclick="app.switchTab('tabSync')" id="btnTabSync" style="padding: 6px 12px; border: none; background-color: #0e639c; color: #ffffff; cursor: pointer; font-size: 12px; font-weight: 500;">Синхронизация</button>
                <button onclick="app.switchTab('tabRenum')" id="btnTabRenum" style="padding: 6px 12px; border: none; background-color: transparent; color: #cccccc; cursor: pointer; font-size: 12px;">Нумерация</button>
                <button onclick="app.switchTab('tabSum')" id="btnTabSum" style="padding: 6px 12px; border: none; background-color: transparent; color: #cccccc; cursor: pointer; font-size: 12px;">Суммирование</button>
                <button onclick="app.switchTab('tabSpec')" id="btnTabSpec" style="padding: 6px 12px; border: none; background-color: transparent; color: #cccccc; cursor: pointer; font-size: 12px;">Спецификации</button>
            </div>

            <div id="tabContainer" style="background-color: #2d2d2d; border: 1px solid #3c3c3c; border-top: none; padding: 8px; border-bottom-left-radius: 3px; border-bottom-right-radius: 3px;">
                <!-- Вкладка 1: Синхронизация -->
                <div id="tabSync" style="display: block;">
                    <div data-type="label" style="margin-bottom: 6px; font-size: 11px; color: #888888;">Шаблоны синхронизации и модификаторы:</div>
                    <div style="display: flex; flex-wrap: wrap; gap: 4px;">
                        <button data-btn-type="template" onclick="app.insertText('Sync_from{}')" style="background-color: #3a3d41; color: #ffffff; border: 1px solid #555555; padding: 3px 6px; border-radius: 2px; cursor: pointer; font-size: 11px;">Sync_from{}</button>
                        <button data-btn-type="template" onclick="app.insertText('Sync_to{}')" style="background-color: #3a3d41; color: #ffffff; border: 1px solid #555555; padding: 3px 6px; border-radius: 2px; cursor: pointer; font-size: 11px;">Sync_to{}</button>
                        <button data-btn-type="template" onclick="app.insertText('Sync_from{Property:...}')" style="background-color: #3a3d41; color: #ffffff; border: 1px solid #555555; padding: 3px 6px; border-radius: 2px; cursor: pointer; font-size: 11px;">Sync_from{Property:...}</button>
                        <button data-btn-type="template" onclick="app.insertText('Sync_from{description:...}')" style="background-color: #3a3d41; color: #ffffff; border: 1px solid #555555; padding: 3px 6px; border-radius: 2px; cursor: pointer; font-size: 11px;">Sync_from{description:...}</button>
                        <button data-btn-type="template" onclick="app.insertText('Sync_from{IFC:...}')" style="background-color: #3a3d41; color: #ffffff; border: 1px solid #555555; padding: 3px 6px; border-radius: 2px; cursor: pointer; font-size: 11px;">Sync_from{IFC:...}</button>
                    </div>
                    <div style="display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px;">
                        <button data-btn-type="modifier" onclick="app.insertText('empty')" style="background-color: #252526; color: #dcdcaa; border: 1px solid #555555; padding: 2px 5px; border-radius: 2px; cursor: pointer; font-size: 10px;">empty</button>
                        <button data-btn-type="modifier" onclick="app.insertText('trim_empty')" style="background-color: #252526; color: #dcdcaa; border: 1px solid #555555; padding: 2px 5px; border-radius: 2px; cursor: pointer; font-size: 10px;">trim_empty</button>
                        <button data-btn-type="modifier" onclick="app.insertText('def')" style="background-color: #252526; color: #dcdcaa; border: 1px solid #555555; padding: 2px 5px; border-radius: 2px; cursor: pointer; font-size: 10px;">def</button>
                        <button data-btn-type="modifier" onclick="app.insertText('uniq')" style="background-color: #252526; color: #4ec9b0; border: 1px solid #555555; padding: 2px 5px; border-radius: 2px; cursor: pointer; font-size: 10px;">uniq</button>
                        <button data-btn-type="modifier" onclick="app.insertText('sum')" style="background-color: #252526; color: #4ec9b0; border: 1px solid #555555; padding: 2px 5px; border-radius: 2px; cursor: pointer; font-size: 10px;">sum</button>
                        <button data-btn-type="modifier" onclick="app.insertText('max')" style="background-color: #252526; color: #4ec9b0; border: 1px solid #555555; padding: 2px 5px; border-radius: 2px; cursor: pointer; font-size: 10px;">max</button>
                        <button data-btn-type="modifier" onclick="app.insertText('min')" style="background-color: #252526; color: #4ec9b0; border: 1px solid #555555; padding: 2px 5px; border-radius: 2px; cursor: pointer; font-size: 10px;">min</button>
                    </div>
                </div>

                <!-- Вкладка 2: Нумерация -->
                <div id="tabRenum" style="display: none;">
                    <div style="display: flex; gap: 4px; margin-bottom: 6px;">
                        <button data-btn-type="template" onclick="app.insertText('Renum_flag{}')" style="background-color: #3a3d41; color: #ffffff; border: 1px solid #555555; padding: 3px 6px; border-radius: 2px; cursor: pointer; font-size: 11px;">Renum_flag{}</button>
                        <button data-btn-type="template" onclick="app.insertText('Renum{}')" style="background-color: #3a3d41; color: #ffffff; border: 1px solid #555555; padding: 3px 6px; border-radius: 2px; cursor: pointer; font-size: 11px;">Renum{}</button>
                    </div>
                    <div data-type="constructor-box" style="background-color: #1e1e1e; padding: 6px; border-radius: 3px; border: 1px solid #444444;">
                        <div data-type="label" style="font-size: 10px; color: #888888; margin-bottom: 4px;">Конструктор Renum:</div>
                        <div style="display: flex; gap: 4px; align-items: center; margin-bottom: 4px;">
                            <span data-type="label" style="font-size: 11px; width: 60px;">Режим:</span>
                            <select id="renumMode" style="background-color: #3c3c3c; color: #fff; border: 1px solid #555; font-size: 11px; flex: 1;">
                                <option value="NULL">NULL</option>
                                <option value="SPACE">SPACE</option>
                                <option value="ALLNULL">ALLNULL</option>
                                <option value="n_NULL">n_NULL</option>
                            </select>
                        </div>
                        <button data-btn-type="action" onclick="app.buildRenum()" style="background-color: #0e639c; color: #fff; border: none; padding: 3px 8px; border-radius: 2px; cursor: pointer; font-size: 11px; width: 100%;">Вставить Renum</button>
                    </div>
                </div>

                <!-- Вкладка 3: Суммирование -->
                <div id="tabSum" style="display: none;">
                    <div data-type="constructor-box" style="background-color: #1e1e1e; padding: 6px; border-radius: 3px; border: 1px solid #444444;">
                        <div data-type="label" style="font-size: 10px; color: #888888; margin-bottom: 4px;">Конструктор Sum:</div>
                        <div style="display: flex; gap: 4px; align-items: center; margin-bottom: 4px;">
                            <span data-type="label" style="font-size: 11px; width: 70px;">Разделитель:</span>
                            <input type="text" id="sumSep" value="; " style="background-color: #3c3c3c; color: #fff; border: 1px solid #555; font-size: 11px; width: 50px; padding: 2px;">
                        </div>
                        <div style="display: flex; gap: 4px;">
                            <button data-btn-type="template" onclick="app.insertText('Sum{Property:Prop1; Property:Prop2}')" style="background-color: #3a3d41; color: #ffffff; border: 1px solid #555555; padding: 3px 6px; border-radius: 2px; cursor: pointer; font-size: 11px; flex: 1;">Sum{Prop1; Prop2}</button>
                            <button data-btn-type="template" onclick="app.insertText('max')" style="background-color: #3a3d41; color: #ffffff; border: 1px solid #555555; padding: 3px 6px; border-radius: 2px; cursor: pointer; font-size: 11px;">+ max</button>
                            <button data-btn-type="template" onclick="app.insertText('min')" style="background-color: #3a3d41; color: #ffffff; border: 1px solid #555555; padding: 3px 6px; border-radius: 2px; cursor: pointer; font-size: 11px;">+ min</button>
                        </div>
                    </div>
                </div>

                <!-- Вкладка 4: Спецификации -->
                <div id="tabSpec" style="display: none;">
                    <div style="display: flex; gap: 4px; margin-bottom: 6px;">
                        <button data-btn-type="template" onclick="app.insertText('Spec_rule')" style="background-color: #3a3d41; color: #ffffff; border: 1px solid #555555; padding: 3px 6px; border-radius: 2px; cursor: pointer; font-size: 11px;">Spec_rule</button>
                        <button data-btn-type="template" onclick="app.insertText('Spec_rule_v2')" style="background-color: #3a3d41; color: #ffffff; border: 1px solid #555555; padding: 3px 6px; border-radius: 2px; cursor: pointer; font-size: 11px;">Spec_rule_v2</button>
                        <button data-btn-type="template" onclick="app.insertText('Spec_rule_v3')" style="background-color: #3a3d41; color: #ffffff; border: 1px solid #555555; padding: 3px 6px; border-radius: 2px; cursor: pointer; font-size: 11px;">Spec_rule_v3</button>
                    </div>
                    <div data-type="constructor-box" style="background-color: #1e1e1e; padding: 6px; border-radius: 3px; border: 1px solid #444444;">
                        <div data-type="label" style="font-size: 10px; color: #888888; margin-bottom: 4px;">Конструктор групп Spec:</div>
                        <div style="display: flex; gap: 4px; margin-bottom: 4px;">
                            <button data-btn-type="template" onclick="app.insertText('g(U:...; P:...; F:...; Q:...; Pn:...; Qn1:...;)')" style="background-color: #3a3d41; color: #dcdcaa; border: 1px solid #555; padding: 3px 6px; border-radius: 2px; font-size: 10px; flex: 1;">Группа g(...)</button>
                            <button data-btn-type="template" onclick="app.insertText('s(U:...; P:...; F:...; Q:...; Pn:...; Qn1:...;)')" style="background-color: #3a3d41; color: #dcdcaa; border: 1px solid #555; padding: 3px 6px; border-radius: 2px; font-size: 10px; flex: 1;">Подгруппа s(...)</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- РЕДАКТОР ОПИСАНИЯ -->
        <div style="margin-bottom: 8px;">
            <label style="display: block; font-weight: 500; margin-bottom: 4px;">Редактор описания:</label>
            <textarea id="editorDescArea" rows="6" placeholder="Вводите синтаксис или используйте кнопки быстрой вставки выше..." style="width: 100%; box-sizing: border-box; background-color: #1e1e1e; color: #d4d4d4; border: 1px solid #555555; padding: 6px; border-radius: 3px; font-size: 12px; font-family: Consolas, Monaco, monospace; resize: vertical;"></textarea>
        </div>

        <!-- КНОПКИ ДЕЙСТВИЙ -->
        <div style="display: flex; gap: 8px;">
            <button id="btnParseSyntax" onclick="app.parseSyntax()" style="flex: 1; background-color: #3a3d41; color: #ffffff; border: 1px solid #555555; padding: 6px 12px; border-radius: 3px; cursor: pointer; font-size: 12px; font-weight: 500;">
                Проверить синтаксис
            </button>
            <button id="btnSaveProperty" onclick="app.savePropertyDescription()" style="flex: 1; background-color: #0e639c; color: #ffffff; border: none; padding: 6px 12px; border-radius: 3px; cursor: pointer; font-size: 12px; font-weight: 500;">
                Записать в свойство
            </button>
        </div>

        <!-- БЛОК ВЫВОДА СТАТУСА/ОШИБОК -->
        <div id="statusOutput" style="display: none; margin-top: 8px; padding: 8px; border-radius: 3px; font-size: 11px; font-family: monospace; white-space: pre-wrap;"></div>
    </details>

    <!-- VANILLA ES5 JAVASCRIPT LOGIC -->
    <script>
        // Инициализация мока ACAPI
        if (!window.ACAPI) {
            window.ACAPI = {
                GetPropertyDefinitions: function(callback) {
                    setTimeout(function() {
                        callback([
                            { guid: 'guid-1', name: 'Имя элемента (General.ElementName)', description: 'Sync_from{Property:Hotlink.Name}' },
                            { guid: 'guid-2', name: 'Маркировка (Custom.Mark)', description: 'Renum{NULL}' },
                            { guid: 'guid-3', name: 'Спецификация (Spec.Group)', description: 'Spec_rule_v2{g(U:1; P:Name;)}' }
                        ]);
                    }, 100);
                },
                GetElementPropertyValue: function(guid, callback) {
                    setTimeout(function() {
                        callback('Пример значения [' + guid + ']');
                    }, 100);
                },
                ParsePropertyDescription: function(desc, callback) {
                    setTimeout(function() {
                        if (desc.indexOf('Error') !== -1) {
                            callback({ status: 'error', message: 'Синтаксическая ошибка' });
                        } else {
                            callback({ status: 'ok', message: 'Синтаксис корректен' });
                        }
                    }, 100);
                },
                SetPropertyDescription: function(guid, desc, callback) {
                    setTimeout(function() {
                        callback({ status: 'ok', message: 'Описание записано!' });
                    }, 100);
                },
                GetCommandStates: function(callback) {
                    setTimeout(function() {
                        callback({ 1: true, 2: false, 3: false, 4: true, 5: true, 6: false, 7: false, 8: false, 9: false, 10: false, 11: false, 12: false, 13: false, 14: false });
                    }, 100);
                },
                ToggleCommandState: function(cmdId, state, callback) {
                    setTimeout(function() {
                        callback({ status: 'ok', id: cmdId, state: state });
                    }, 50);
                }
            };
        }

        // Глобальный объект приложения
        window.app = {
            currentTheme: 'dark',
            activeTabId: 'tabSync',
            propertiesList: [],
            selectedGuid: '',

            // Маппинг 14 команд с именами файлов иконок *.svg
            commands: [
                { id: 1,  name: 'Отслеживать', active: false, iconFile: 'MonAllIcon_18x18.svg' },
                { id: 2,  name: 'Синхронизировать все', active: false, iconFile: 'SyncAllIcon_18x18.svg' },
                { id: 3,  name: 'Синхронизировать выделенные', active: false, iconFile: 'SyncSelectIcon_18x18.svg' },
                { id: 4,  name: 'Обрабатывать стены/перекрытия', active: false, iconFile: 'SyncWall_18x18.svg' },
                { id: 5,  name: 'Обрабатывать окна/двери', active: false, iconFile: 'SyncWindow_18x18.svg' },
                { id: 6,  name: 'Обрабатывать объекты/зоны', active: false, iconFile: 'SyncObject_18x18.svg' },
                { id: 7,  name: 'Обрабатывать элементы навесных стен и ограждений', active: false, iconFile: 'SynccWallIcon_18x18.svg' },
                { id: 8,  name: 'Перенумеровать выделенные', active: false, iconFile: 'ReNumIcon_18x18.svg' },
                { id: 9,  name: 'Просуммировать выделенные', active: false, iconFile: 'SumAllIcon_18x18.svg' },
                { id: 10, name: 'Запустить скрипт параметров выделенных', active: false, iconFile: 'RunParamIcon_18x18.svg' },
                { id: 11, name: 'Создать элементы', active: false, iconFile: 'CreateFinishIcon_18x18.svg' },
                { id: 12, name: 'Показать связанные элементы', active: false, iconFile: 'ShowGUIDIcon_18x18.svg' },
                { id: 13, name: 'Заполнение изменений на макетах', active: false, iconFile: 'LauoutIcon_18x18.svg' },
                { id: 14, name: 'Привязать элементы к выделенному', active: false, iconFile: 'SetGUIDIcon_18x18.svg' }
            ],

            init: function() {
                this.renderCommandIcons();
                this.loadCommandStates();
                this.loadProperties();
            },

            // Генерация 14 кнопок с подгрузкой файлов SVG
            renderCommandIcons: function() {
                var container = document.getElementById('cmdIconsContainer');
                container.innerHTML = '';

                for (var i = 0; i < this.commands.length; i++) {
                    var cmd = this.commands[i];
                    var btn = document.createElement('button');
                    btn.id = 'cmdBtn_' + cmd.id;
                    btn.title = '[' + cmd.id + '] ' + cmd.name;
                    btn.setAttribute('data-cmd-id', cmd.id);
                    btn.setAttribute('onclick', 'app.toggleCommand(' + cmd.id + ')');
                    btn.style.width = '28px';
                    btn.style.height = '28px';
                    btn.style.display = 'flex';
                    btn.style.alignItems = 'center';
                    btn.style.justifyContent = 'center';
                    btn.style.border = '1px solid #555555';
                    btn.style.borderRadius = '3px';
                    btn.style.cursor = 'pointer';
                    btn.style.padding = '2px';
                    btn.style.boxSizing = 'border-box';

                    var img = document.createElement('img');
                    img.id = 'cmdImg_' + cmd.id;
                    img.src = 'icons/' + cmd.iconFile; // Пред полагается путь icons/*.svg
                    img.width = 18;
                    img.height = 18;
                    img.style.pointerEvents = 'none';

                    btn.appendChild(img);
                    container.appendChild(btn);
                }
                this.updateCommandIconsStyles();
            },

            loadCommandStates: function() {
                var self = this;
                if (window.ACAPI && window.ACAPI.GetCommandStates) {
                    window.ACAPI.GetCommandStates(function(statesMap) {
                        if (statesMap) {
                            for (var i = 0; i < self.commands.length; i++) {
                                var id = self.commands[i].id;
                                if (statesMap[id] !== undefined) {
                                    self.commands[i].active = !!statesMap[id];
                                }
                            }
                            self.updateCommandIconsStyles();
                        }
                    });
                }
            },

            toggleCommand: function(cmdId) {
                var cmdObj = null;
                for (var i = 0; i < this.commands.length; i++) {
                    if (this.commands[i].id === cmdId) {
                        cmdObj = this.commands[i];
                        break;
                    }
                }
                if (!cmdObj) return;

                var newState = !cmdObj.active;
                cmdObj.active = newState;
                this.updateCommandIconsStyles();

                if (window.ACAPI && window.ACAPI.ToggleCommandState) {
                    window.ACAPI.ToggleCommandState(cmdId, newState, function(res) {});
                }
            },

            // Обновление стилей и инверсия цвета SVG-иконок для Темной / Светлой темы
            updateCommandIconsStyles: function() {
                var isDark = (this.currentTheme === 'dark');

                for (var i = 0; i < this.commands.length; i++) {
                    var cmd = this.commands[i];
                    var btn = document.getElementById('cmdBtn_' + cmd.id);
                    var img = document.getElementById('cmdImg_' + cmd.id);
                    if (!btn || !img) continue;

                    if (cmd.active) {
                        btn.style.backgroundColor = '#0e639c';
                        btn.style.borderColor = '#1177bb';
                        img.style.filter = 'brightness(0) invert(1)'; // Белая иконка для активной кнопки
                    } else {
                        btn.style.backgroundColor = isDark ? '#3a3d41' : '#e1e1e1';
                        btn.style.borderColor = isDark ? '#555555' : '#cccccc';
                        // При неактивном состоянии настраиваем инверсию векторных линий под тему
                        img.style.filter = isDark ? 'brightness(0) invert(0.85)' : 'none';
                    }
                }
            },

            toggleTheme: function() {
                var isDark = (this.currentTheme === 'dark');
                this.currentTheme = isDark ? 'light' : 'dark';

                var body = document.getElementById('appBody');
                var headerBar = document.getElementById('headerBar');
                var headerTitle = document.getElementById('headerTitle');
                var themeBtn = document.getElementById('themeToggleBtn');
                var cmdBar = document.getElementById('commandBar');
                var sec1 = document.getElementById('section1');
                var sec2 = document.getElementById('section2');
                var select1 = document.getElementById('propSelect1');
                var select2 = document.getElementById('propSelect2');
                var valInput = document.getElementById('currentValueInput');
                var descArea = document.getElementById('currentDescArea');
                var editorArea = document.getElementById('editorDescArea');
                var tabHeaders = document.getElementById('tabHeaders');
                var tabContainer = document.getElementById('tabContainer');
                var btnParse = document.getElementById('btnParseSyntax');

                if (this.currentTheme === 'light') {
                    body.style.backgroundColor = '#f3f3f3';
                    body.style.color = '#333333';
                    headerBar.style.borderColor = '#cccccc';
                    headerTitle.style.color = '#000000';
                    themeBtn.style.backgroundColor = '#e1e1e1';
                    themeBtn.style.color = '#333333';
                    themeBtn.style.borderColor = '#cccccc';
                    themeBtn.innerHTML = '🌙 Тёмная тема';

                    cmdBar.style.backgroundColor = '#ffffff';
                    cmdBar.style.borderColor = '#cccccc';
                    sec1.style.backgroundColor = '#ffffff';
                    sec1.style.borderColor = '#cccccc';
                    sec2.style.backgroundColor = '#ffffff';
                    sec2.style.borderColor = '#cccccc';

                    select1.style.backgroundColor = '#ffffff';
                    select1.style.color = '#000000';
                    select1.style.borderColor = '#cccccc';

                    select2.style.backgroundColor = '#ffffff';
                    select2.style.color = '#000000';
                    select2.style.borderColor = '#cccccc';

                    valInput.style.backgroundColor = '#f8f8f8';
                    valInput.style.color = '#0000ff';
                    valInput.style.borderColor = '#cccccc';

                    descArea.style.backgroundColor = '#f8f8f8';
                    descArea.style.color = '#a31515';
                    descArea.style.borderColor = '#cccccc';

                    editorArea.style.backgroundColor = '#ffffff';
                    editorArea.style.color = '#000000';
                    editorArea.style.borderColor = '#cccccc';

                    tabHeaders.style.backgroundColor = '#e8e8e8';
                    tabHeaders.style.borderColor = '#cccccc';
                    tabContainer.style.backgroundColor = '#f8f8f8';
                    tabContainer.style.borderColor = '#cccccc';

                    btnParse.style.backgroundColor = '#e1e1e1';
                    btnParse.style.color = '#333333';
                    btnParse.style.borderColor = '#cccccc';
                } else {
                    body.style.backgroundColor = '#1e1e1e';
                    body.style.color = '#cccccc';
                    headerBar.style.borderColor = '#3c3c3c';
                    headerTitle.style.color = '#ffffff';
                    themeBtn.style.backgroundColor = '#3a3d41';
                    themeBtn.style.color = '#ffffff';
                    themeBtn.style.borderColor = '#555555';
                    themeBtn.innerHTML = '☀️ Светлая тема';

                    cmdBar.style.backgroundColor = '#252526';
                    cmdBar.style.borderColor = '#3c3c3c';
                    sec1.style.backgroundColor = '#252526';
                    sec1.style.borderColor = '#3c3c3c';
                    sec2.style.backgroundColor = '#252526';
                    sec2.style.borderColor = '#3c3c3c';

                    select1.style.backgroundColor = '#3c3c3c';
                    select1.style.color = '#ffffff';
                    select1.style.borderColor = '#555555';

                    select2.style.backgroundColor = '#3c3c3c';
                    select2.style.color = '#ffffff';
                    select2.style.borderColor = '#555555';

                    valInput.style.backgroundColor = '#2d2d2d';
                    valInput.style.color = '#9cdcfe';
                    valInput.style.borderColor = '#444444';

                    descArea.style.backgroundColor = '#2d2d2d';
                    descArea.style.color = '#ce9178';
                    descArea.style.borderColor = '#444444';

                    editorArea.style.backgroundColor = '#1e1e1e';
                    editorArea.style.color = '#d4d4d4';
                    editorArea.style.borderColor = '#555555';

                    tabHeaders.style.backgroundColor = '#1e1e1e';
                    tabHeaders.style.borderColor = '#3c3c3c';
                    tabContainer.style.backgroundColor = '#2d2d2d';
                    tabContainer.style.borderColor = '#3c3c3c';

                    btnParse.style.backgroundColor = '#3a3d41';
                    btnParse.style.color = '#ffffff';
                    btnParse.style.borderColor = '#555555';
                }

                this.switchTab(this.activeTabId);
                this.updateTabStyles();
                this.updateCommandIconsStyles();
            },

            updateTabStyles: function() {
                var isDark = (this.currentTheme === 'dark');
                var container = document.getElementById('tabContainer');
                if (!container) return;

                var divs = container.getElementsByTagName('div');
                for (var i = 0; i < divs.length; i++) {
                    if (divs[i].getAttribute('data-type') === 'constructor-box') {
                        divs[i].style.backgroundColor = isDark ? '#1e1e1e' : '#ffffff';
                        divs[i].style.borderColor = isDark ? '#444444' : '#cccccc';
                    }
                }

                var buttons = container.getElementsByTagName('button');
                for (var j = 0; j < buttons.length; j++) {
                    var btn = buttons[j];
                    var btnType = btn.getAttribute('data-btn-type');

                    if (btnType === 'template') {
                        btn.style.backgroundColor = isDark ? '#3a3d41' : '#ffffff';
                        btn.style.color = isDark ? '#ffffff' : '#000000';
                        btn.style.borderColor = isDark ? '#555555' : '#cccccc';
                    } else if (btnType === 'modifier') {
                        btn.style.backgroundColor = isDark ? '#252526' : '#ffffff';
                        btn.style.color = isDark ? '#dcdcaa' : '#795e26';
                        btn.style.borderColor = isDark ? '#555555' : '#cccccc';
                    } else if (btnType === 'action') {
                        btn.style.backgroundColor = '#0e639c';
                        btn.style.color = '#ffffff';
                    }
                }

                var inputs = container.getElementsByTagName('input');
                for (var k = 0; k < inputs.length; k++) {
                    inputs[k].style.backgroundColor = isDark ? '#3c3c3c' : '#ffffff';
                    inputs[k].style.color = isDark ? '#ffffff' : '#000000';
                    inputs[k].style.borderColor = isDark ? '#555555' : '#cccccc';
                }

                var selects = container.getElementsByTagName('select');
                for (var m = 0; m < selects.length; m++) {
                    selects[m].style.backgroundColor = isDark ? '#3c3c3c' : '#ffffff';
                    selects[m].style.color = isDark ? '#ffffff' : '#000000';
                    selects[m].style.borderColor = isDark ? '#555555' : '#cccccc';
                }

                var labels = container.getElementsByTagName('span');
                for (var n = 0; n < labels.length; n++) {
                    labels[n].style.color = isDark ? '#cccccc' : '#333333';
                }
                var labelDivs = document.querySelectorAll('div[data-type="label"]');
                for (var p = 0; p < labelDivs.length; p++) {
                    labelDivs[p].style.color = isDark ? '#569cd6' : '#0066b8';
                }
            },

            loadProperties: function() {
                var self = this;
                window.ACAPI.GetPropertyDefinitions(function(props) {
                    self.propertiesList = props || [];
                    self.renderPropertyDropdowns();
                });
            },

            renderPropertyDropdowns: function() {
                var sel1 = document.getElementById('propSelect1');
                var sel2 = document.getElementById('propSelect2');

                sel1.innerHTML = '';
                sel2.innerHTML = '';

                if (this.propertiesList.length === 0) {
                    var emptyOpt = document.createElement('option');
                    emptyOpt.text = 'Свойства не найдены';
                    sel1.add(emptyOpt);
                    sel2.add(emptyOpt.cloneNode(true));
                    return;
                }

                for (var i = 0; i < this.propertiesList.length; i++) {
                    var item = this.propertiesList[i];
                    
                    var opt1 = document.createElement('option');
                    opt1.value = item.guid;
                    opt1.text = item.name;
                    sel1.add(opt1);

                    var opt2 = document.createElement('option');
                    opt2.value = item.guid;
                    opt2.text = item.name;
                    sel2.add(opt2);
                }

                if (this.propertiesList.length > 0) {
                    this.onSelectProperty(this.propertiesList[0].guid);
                }
            },

            onSelectProperty: function(guid) {
                this.selectedGuid = guid;
                document.getElementById('propSelect1').value = guid;
                document.getElementById('propSelect2').value = guid;

                this.refreshPropertyValue();

                var propObj = null;
                for (var i = 0; i < this.propertiesList.length; i++) {
                    if (this.propertiesList[i].guid === guid) {
                        propObj = this.propertiesList[i];
                        break;
                    }
                }

                var descArea = document.getElementById('currentDescArea');
                var editorArea = document.getElementById('editorDescArea');

                if (propObj) {
                    descArea.value = propObj.description || '';
                    editorArea.value = propObj.description || '';
                } else {
                    descArea.value = '';
                    editorArea.value = '';
                }

                this.hideStatus();
            },

            refreshPropertyValue: function() {
                if (!this.selectedGuid) return;
                var input = document.getElementById('currentValueInput');
                input.value = 'Загрузка...';

                window.ACAPI.GetElementPropertyValue(this.selectedGuid, function(val) {
                    input.value = (val !== undefined && val !== null) ? val : '<Пусто>';
                });
            },

            switchTab: function(tabId) {
                this.activeTabId = tabId;
                var tabs = ['tabSync', 'tabRenum', 'tabSum', 'tabSpec'];
                var btns = ['btnTabSync', 'btnTabRenum', 'btnTabSum', 'btnTabSpec'];
                var isDark = (this.currentTheme === 'dark');

                for (var i = 0; i < tabs.length; i++) {
                    var el = document.getElementById(tabs[i]);
                    var btn = document.getElementById(btns[i]);
                    
                    if (tabs[i] === tabId) {
                        el.style.display = 'block';
                        btn.style.backgroundColor = '#0e639c';
                        btn.style.color = '#ffffff';
                        btn.style.fontWeight = '500';
                    } else {
                        el.style.display = 'none';
                        btn.style.backgroundColor = 'transparent';
                        btn.style.color = isDark ? '#cccccc' : '#555555';
                        btn.style.fontWeight = 'normal';
                    }
                }
            },

            insertText: function(text) {
                var area = document.getElementById('editorDescArea');
                area.focus();

                if (document.selection) {
                    var sel = document.selection.createRange();
                    sel.text = text;
                } else if (area.selectionStart || area.selectionStart === 0) {
                    var startPos = area.selectionStart;
                    var endPos = area.selectionEnd;
                    area.value = area.value.substring(0, startPos) + text + area.value.substring(endPos, area.value.length);
                    area.selectionStart = startPos + text.length;
                    area.selectionEnd = startPos + text.length;
                } else {
                    area.value += text;
                }
            },

            buildRenum: function() {
                var mode = document.getElementById('renumMode').value;
                this.insertText('Renum{' + mode + '}');
            },

            parseSyntax: function() {
                var desc = document.getElementById('editorDescArea').value;
                var self = this;

                window.ACAPI.ParsePropertyDescription(desc, function(result) {
                    if (result && result.status === 'ok') {
                        self.showStatus('✔ ' + result.message, false);
                    } else {
                        self.showStatus('❌ ' + (result ? result.message : 'Ошибка валидации'), true);
                    }
                });
            },

            savePropertyDescription: function() {
                if (!this.selectedGuid) {
                    this.showStatus('❌ Свойство не выбрано', true);
                    return;
                }

                var desc = document.getElementById('editorDescArea').value;
                var self = this;

                window.ACAPI.SetPropertyDescription(this.selectedGuid, desc, function(result) {
                    if (result && result.status === 'ok') {
                        self.showStatus('✔ ' + result.message, false);
                        for (var i = 0; i < self.propertiesList.length; i++) {
                            if (self.propertiesList[i].guid === self.selectedGuid) {
                                self.propertiesList[i].description = desc;
                                document.getElementById('currentDescArea').value = desc;
                                break;
                            }
                        }
                    } else {
                        self.showStatus('❌ Ошибка записи: ' + (result ? result.message : 'Неизвестный сбой'), true);
                    }
                });
            },

            showStatus: function(msg, isError) {
                var out = document.getElementById('statusOutput');
                out.style.display = 'block';
                out.innerText = msg;

                if (isError) {
                    out.style.backgroundColor = (this.currentTheme === 'light') ? '#fde8e8' : '#5a1d1d';
                    out.style.color = (this.currentTheme === 'light') ? '#9c0000' : '#f88080';
                    out.style.border = '1px solid ' + ((this.currentTheme === 'light') ? '#f8b7b7' : '#802020');
                } else {
                    out.style.backgroundColor = (this.currentTheme === 'light') ? '#e8f8e8' : '#1d4a1d';
                    out.style.color = (this.currentTheme === 'light') ? '#006000' : '#80f880';
                    out.style.border = '1px solid ' + ((this.currentTheme === 'light') ? '#b7f8b7' : '#208020');
                }
            },

            hideStatus: function() {
                var out = document.getElementById('statusOutput');
                out.style.display = 'none';
                out.innerText = '';
            }
        };

        window.onload = function() {
            window.app.init();
        };
    </script>
</body>
</html>
