<!DOCTYPE html>
<!--
  =====================================================================================
  Archicad — Панель «Редактор описаний свойств»
  =====================================================================================
  Реализовано строго по ТЗ:
    - Один файл dialogs/index.html
    - Только Vanilla HTML / Vanilla JS
    - Только inline-стили (style="..."). Тег <style> и CSS-файлы НЕ используются.
      Тема (свет/тьма) реализована через CSS custom properties (--ac-*), которые
      объявлены в inline style корневого <html> и используются как var(--ac-...)
      внутри инлайновых style="" каждого элемента. Формально это остаётся
      "инлайн-стилями" — блока <style> нигде нет, просто значение переменной
      меняется в одном месте (html.style) и мгновенно применяется по всему дереву.
    - Адаптивная резиновая вёрстка, левая колонка вкладок фиксированной логической
      ширины (в rem — масштабируется вместе с DPI автоматически браузером).
    - Реального моста с Archicad нет: весь обмен данными идёт через объект
      ACBridge (см. раздел "МОСТ С ARCHICAD (МОК)" ниже). Каждая функция помечена
      комментарием "AGENT TODO" с описанием того, что она должна делать и что
      обязана возвращать в реальной интеграции — заменить тело функции на
      настоящий вызов нативного моста (например window.chrome.webview.postMessage
      или собственный JS-мост C++ панели), сохранив сигнатуру и формат Promise.
  =====================================================================================
-->
<html lang="ru" style="
  box-sizing:border-box;
  font-size:16px;
  --ac-transition:160ms ease;
">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archicad — Редактор описаний свойств</title>
</head>
<body style="margin:0;padding:0;height:100vh;width:100%;overflow:hidden;
  font-family:'Segoe UI', -apple-system, Arial, sans-serif;
  -webkit-font-smoothing:antialiased;">

  <!-- Корневой контейнер: левая навигация + рабочая область -->
  <div id="app" style="display:flex;flex-direction:row;height:100%;width:100%;overflow:hidden;"></div>

<script>
"use strict";
/* =====================================================================================
   0. НАСТРОЙКИ / КОНСТАНТЫ
   ===================================================================================== */

// Количество "выделенных элементов" для демонстрационных данных.
// AGENT TODO: реальное значение должно приходить из ACBridge.GetSelectionInfo()
// (будет заменено на window.ACAPI.GetSelectionInfo() после интеграции JS-моста)
const MOCK_SELECTED_COUNT = 5;

/* =====================================================================================
   1. ТЕМА (светлая / тёмная)
   ---------------------------------------------------------------------------------
   Все цвета вынесены в CSS custom properties на элементе <html>. Каждый визуальный
   элемент интерфейса ссылается на них через var(--ac-...) внутри собственного
   inline style. Переключение темы = однократная перезапись набора переменных на
   <html> — дерево обновляется целиком и мгновенно, без "залипших" тёмных участков.
   ===================================================================================== */
const THEMES = {
  light: {
    "--ac-bg-nav":            "#F3F4F7",
    "--ac-bg-workspace":      "#FFFFFF",
    "--ac-bg-elevated":       "#F8F9FB",
    "--ac-bg-hover":          "#EEF1F6",
    "--ac-bg-input":          "#FFFFFF",
    "--ac-text-primary":      "#1A1D23",
    "--ac-text-secondary":    "#5B6472",
    "--ac-text-tertiary":     "#8A93A2",
    "--ac-text-inverse":      "#FFFFFF",
    "--ac-border":            "#E1E4EA",
    "--ac-divider":           "#ECEEF2",
    "--ac-accent":            "#2F6FED",
    "--ac-accent-soft":       "#E7EFFD",
    "--ac-accent-contrast":   "#FFFFFF",
    "--ac-warn":              "#B4690E",
    "--ac-warn-soft":         "#FBF0E1",
    "--ac-danger":            "#D0333F",
    "--ac-shadow-color":      "rgba(20,22,26,0.10)",
    "--ac-code-bg":           "#F6F7F9",
    "--ac-code-command":      "#7C3AED",
    "--ac-code-namespace":    "#2F6FED",
    "--ac-code-keyword":      "#B4690E",

    "--ac-bg-workspace":      "#14161A",
    "--ac-bg-elevated":       "#1F222A",
    "--ac-bg-hover":          "#262A33",
    "--ac-bg-input":          "#1A1D23",
    "--ac-text-primary":      "#EDEFF3",
    "--ac-text-secondary":    "#A7AFBD",
    "--ac-text-tertiary":     "#6B7280",
    "--ac-text-inverse":      "#14161A",
    "--ac-border":            "#2C3038",
    "--ac-divider":           "#262A33",
    "--ac-accent":            "#5B8DEF",
    "--ac-accent-soft":       "#23324D",
    "--ac-accent-contrast":   "#0B0D10",
    "--ac-warn":              "#E3A75E",
    "--ac-warn-soft":         "#332815",
    "--ac-danger":            "#F1666B",

    "--ac-code-command":      "#B18CF2",
    "--ac-code-namespace":    "#5B8DEF",
    "--ac-code-keyword":      "#E3A75E",
    "--ac-code-bracket":      "#5C6472",
    "--ac-code-string":       "#4FCB84",
    "--ac-code-expr":         "#F0A93D",
    "--ac-code-range":        "#5C6472"
  }
};

const STATE = {
  theme: "light",              // по умолчанию светлая тема (задано заказчиком)
  activeTab: "monitor",
  monitorFilter: "",
  monitorSelectedPropertyId: null,
  numberingOpenBlocks: { flag: false, ruleEditor: false }, // блок 1 всегда открыт, остальные — по клику
  numberingConfig: { flagProperty: null, ruleProperty: null, numberFormat: "NULL",
                      criterionProperty: null, splitProperty: null }
};

function applyTheme(name) {
  STATE.theme = name;
  const vars = THEMES[name];
  const root = document.documentElement;
  for (const key in vars) root.style.setProperty(key, vars[key]);
  root.style.setProperty("--ac-color-scheme", name);
  const toggle = document.getElementById("theme-toggle-icon");
  if (toggle) toggle.textContent = name === "light" ? "\u263D" : "\u2600"; // ☾ / ☀
}

/* =====================================================================================
   2. МОСТ С ARCHICAD (МОК)
   ---------------------------------------------------------------------------------
   В реальном плагине этот раздел заменяется на настоящий JS-мост, который
   отправляет запросы в C++ часть Add-On'а (например через
   window.chrome.webview.postMessage(...) + window.chrome.webview.addEventListener,
   либо через window.acPanelBridge, который выставляет C++ сторона) и возвращает
   Promise, резолвящийся ответом от Archicad.
   Каждая функция ниже уже имеет ПРАВИЛЬНУЮ сигнатуру и формат возвращаемых данных —
   агенту, который будет подключать реальный API, нужно просто заменить тело
   функции, сохранив контракт (что принимает / что возвращает).
   ===================================================================================== */
const ACBridge = (function () {

  // Имитация сетевой/межпроцессной задержки моста.
  function delay(ms) { return new Promise(function (res) { setTimeout(res, ms); }); }

  /**
   * Получает количество выделенных элементов через JS-мост с ArchiCAD.
   * Вызывает window.ACAPI.GetSelectionInfo() и возвращает Promise с результатом.
   * @returns {Promise<{count:number}>}
   */
  function getSelectionInfo() {
    return new Promise(function (resolve) {
      if (typeof window.ACAPI !== 'undefined' && window.ACAPI.GetSelectionInfo) {
        // Прямой синхронный вызов (DG::JSFunction возвращает результат сразу)
        try {
          var result = window.ACAPI.GetSelectionInfo();
          resolve({ count: result.count });
        } catch (e) {
          console.error("ACAPI.GetSelectionInfo error:", e);
          resolve({ count: 0 });
        }
      } else {
        console.warn("ACAPI.GetSelectionInfo not available, using mock.");
        resolve({ count: MOCK_SELECTED_COUNT });
      }
    });
  }

  /**
   * AGENT TODO: запросить дерево классификаций для текущего выделения.
   * Ожидаемое поведение реального моста:
   *  - обходит все выделенные элементы, находит их классификации в указанной
   *    системе классификации по умолчанию (или во всех активных системах);
   *  - если у всех элементов классификация совпадает — common:true и commonPath
   *    содержит полный путь (например ["IFC 4", "Строительные элементы", "Стены", "Наружная"]);
   *  - если классификации различаются — common:false, commonPath содержит только
   *    ту часть пути, что совпадает у всех, а differing перечисляет каждый элемент
   *    с его конкретным (различающимся) значением;
   *  - options — список классификаций, которые можно назначить всем выделенным
   *    элементам одним действием (для выпадающего списка "Применить ко всем").
   * @returns {Promise<{common:boolean, commonPath:string[],
   *                     differing:{elementName:string, value:string}[],
   *                     options:string[]}>}
   */
  function getClassification() {
    return delay(80).then(function () {
      return {
        common: false,
        commonPath: ["IFC 4", "Строительные элементы", "Стены"],
        differing: [
          { elementName: "Стена наружная — Эт.1", value: "IfcWall — Наружная несущая" },
          { elementName: "Стена наружная — Эт.2", value: "IfcWall — Наружная несущая" },
          { elementName: "Стена внутренняя — Эт.1", value: "IfcWall — Внутренняя перегородка" },
          { elementName: "Стена подвал — Эт.0", value: "IfcWallStandardCase — Несущая" },
          { elementName: "Парапет — Кровля", value: "IfcWall — Парапет" }
        ],
        options: [
          "IfcWall — Наружная несущая",
          "IfcWall — Внутренняя перегородка",
          "IfcWallStandardCase — Несущая",
          "IfcWall — Парапет"
        ]
      };
    });
  }

  /**
   * AGENT TODO: назначить единую классификацию всем выделенным элементам.
   * @param {string} classificationValue — значение из options (см. getClassification)
   * @returns {Promise<{success:boolean}>}
   */
  function setClassificationForSelection(classificationValue) {
    return delay(150).then(function () { return { success: true }; });
  }

  /**
   * AGENT TODO: вернуть список преднастроенных фильтров свойств (хранятся
   * в конфигурации плагина / шаблоне). Каждый фильтр — либо обычная подстрока,
   * либо регулярное выражение в формате "/шаблон/".
   * @returns {Promise<{label:string, query:string}[]>}
   */
  function getFilterPresets() {
    return delay(40).then(function () {
      return [
        { label: "Все свойства", query: "" },
        { label: "Только IFC", query: "/^IFC:/" },
        { label: "Только геометрия", query: "/^(Coord|Geo):/" },
        { label: "Незаполненные", query: "/пусто|empty/" }
      ];
    });
  }

  /**
   * AGENT TODO: запросить у Archicad список свойств для текущего выделения,
   * сгруппированный по системным группам (как в инспекторе свойств Archicad).
   * Для каждого свойства нужно вернуть, есть ли оно у ВСЕХ выделенных элементов
   * (allHave) и у скольких из них оно фактически присутствует (countWithProperty).
   * Список должен быть уже отфильтрован по filterText на стороне C++ ИЛИ (как
   * сделано в этом моке) фильтрация может выполняться на стороне JS — выбрать
   * единый подход при реальной интеграции, чтобы избежать двойной фильтрации.
   * @param {string} filterText
   * @returns {Promise<{group:string, properties:{id:string, name:string,
   *                     allHave:boolean, countWithProperty:number}[]}[]>}
   */
  function getPropertiesList(filterText) {
    return delay(90).then(function () {
      const all = [
        { group: "Общие", properties: [
          { id: "gen.name", name: "Наименование", allHave: true, countWithProperty: 5 },
          { id: "gen.layer", name: "Слой", allHave: true, countWithProperty: 5 },
          { id: "gen.id", name: "Идентификатор ID", allHave: false, countWithProperty: 3 }
        ]},
        { group: "IFC", properties: [
          { id: "ifc.class", name: "IFC Класс", allHave: true, countWithProperty: 5 },
          { id: "ifc.predefinedtype", name: "PredefinedType", allHave: false, countWithProperty: 4 },
          { id: "ifc.guid", name: "GlobalId", allHave: true, countWithProperty: 5 }
        ]},
        { group: "Геометрия", properties: [
          { id: "geo.area", name: "Площадь", allHave: true, countWithProperty: 5 },
          { id: "geo.thickness", name: "Толщина", allHave: false, countWithProperty: 2 },
          { id: "geo.height", name: "Высота", allHave: true, countWithProperty: 5 }
        ]},
        { group: "Нумерация", properties: [
          { id: "num.floor", name: "Этаж", allHave: true, countWithProperty: 5 },
          { id: "num.section", name: "Секция", allHave: false, countWithProperty: 1 }
        ]}
      ];
      if (!filterText) return all;
      let matcher;
      const rx = /^\/(.*)\/$/.exec(filterText.trim());
      if (rx) {
        try { matcher = new RegExp(rx[1], "i"); } catch (e) { matcher = null; }
      }
      const test = matcher
        ? function (s) { return matcher.test(s); }
        : function (s) { return s.toLowerCase().indexOf(filterText.trim().toLowerCase()) !== -1; };
      return all
        .map(function (g) { return { group: g.group, properties: g.properties.filter(function (p) { return test(p.name); }) }; })
        .filter(function (g) { return g.properties.length > 0; });
    });
  }

  /**
   * AGENT TODO: запросить фактическое значение выбранного свойства для каждого
   * выделенного элемента. Если значения совпадают — common:true и values
   * содержит один элемент. Если различаются — common:false и values содержит
   * запись на каждый уникальный вариант значения (с указанием, у скольких
   * элементов это значение встречается).
   * @param {string} propertyId
   * @returns {Promise<{propertyName:string, common:boolean,
   *                     values:{value:string, count:number}[]}>}
   */
  function getPropertyValue(propertyId) {
    return delay(70).then(function () {
      const mockValues = {
        "gen.id": { common: false, values: [{ value: "ST-014", count: 2 }, { value: "ST-021", count: 1 }, { value: "— не задано —", count: 2 }] },
        "ifc.predefinedtype": { common: false, values: [{ value: "SOLIDWALL", count: 4 }, { value: "PARAPET", count: 1 }] },
        "geo.thickness": { common: false, values: [{ value: "250 мм", count: 2 }, { value: "— не задано —", count: 3 }] },
        "num.section": { common: false, values: [{ value: "А", count: 1 }, { value: "— не задано —", count: 4 }] }
      };
      const found = mockValues[propertyId];
      if (found) return Object.assign({ propertyName: propertyId }, found);
      return { propertyName: propertyId, common: true, values: [{ value: "значение примера", count: MOCK_SELECTED_COUNT }] };
    });
  }

  /**
   * AGENT TODO: сбросить значение свойства к значению по умолчанию для всех
   * выделенных элементов (снять оверрайд).
   * @param {string} propertyId
   * @returns {Promise<{success:boolean}>}
   */
  function resetPropertyToDefault(propertyId) {
    return delay(120).then(function () { return { success: true }; });
  }

  /**
   * AGENT TODO: список свойств, пригодных для использования как
   * свойство-флаг / свойство-правило / свойство-критерий / свойство разбивки
   * в блоках вкладки «Нумерация». В реальной интеграции список может отличаться
   * по каждому блоку (например, только текстовые/числовые свойства для критерия).
   * @returns {Promise<{id:string, name:string}[]>}
   */
  function getNumberingProperties() {
    return delay(50).then(function () {
      return [
        { id: "num.floor", name: "Этаж" },
        { id: "num.section", name: "Секция" },
        { id: "ifc.class", name: "IFC Класс" },
        { id: "gen.layer", name: "Слой" },
        { id: "geo.area", name: "Площадь" }
      ];
    });
  }

  /**
   * AGENT TODO: выполнить пересчёт нумерации по текущей конфигурации (флаг,
   * правило, критерий, разбивка) и вернуть таблицу предпросмотра — присвоенный
   * номер и значение свойства-критерия для каждого выделенного элемента.
   * @param {object} config — {flagProperty, ruleProperty, numberFormat, criterionProperty, splitProperty}
   * @returns {Promise<{number:string, criterionValue:string}[]>}
   */
  function getNumberingPreview(config) {
    return delay(100).then(function () {
      const base = [
        { number: "A-01", criterionValue: "Стена наружная — Эт.1" },
        { number: "A-02", criterionValue: "Стена наружная — Эт.2" },
        { number: "B-01", criterionValue: "Стена внутренняя — Эт.1" },
        { number: "B-02", criterionValue: "Стена подвал — Эт.0" },
        { number: "C-01", criterionValue: "Парапет — Кровля" }
      ];
      if (!config.criterionProperty) return [];
      return base;
    });
  }

  /**
   * AGENT TODO: выполнить (запустить) DSL-скрипт синхронизации, введённый
   * пользователем на вкладке «Синхронизация», на текущем выделении элементов.
   * Должен вернуть результат выполнения (успех/ошибка, номер строки ошибки и т.п.)
   * для отображения пользователю.
   * @param {string} scriptText
   * @returns {Promise<{success:boolean, message:string}>}
   */
  function executeSyncScript(scriptText) {
    return delay(200).then(function () {
      return { success: true, message: "Скрипт применён к " + MOCK_SELECTED_COUNT + " элементам (демо-режим)." };
    });
  }

  return {
    getSelectionInfo: getSelectionInfo,
    getClassification: getClassification,
    setClassificationForSelection: setClassificationForSelection,
    getFilterPresets: getFilterPresets,
    getPropertiesList: getPropertiesList,
    getPropertyValue: getPropertyValue,
    resetPropertyToDefault: resetPropertyToDefault,
    getNumberingProperties: getNumberingProperties,
    getNumberingPreview: getNumberingPreview,
    executeSyncScript: executeSyncScript
  };
})();

// Компактный конструктор DOM-элементов с инлайн-стилями.
// opts: { style, text, html, attrs:{}, on:{event:handler} }
function h(tag, opts, children) {
  opts = opts || {};
  const e = document.createElement(tag);
  e.style.boxSizing = "border-box"; // единая политика box-sizing без CSS-блоков
  if (opts.style) e.style.cssText += opts.style;
  if (opts.text !== undefined) e.textContent = opts.text;
  if (opts.html !== undefined) e.innerHTML = opts.html;
  if (opts.attrs) for (const k in opts.attrs) e.setAttribute(k, opts.attrs[k]);
  if (opts.on) for (const k in opts.on) e.addEventListener(k, opts.on[k]);
  (children || []).forEach(function (c) { if (c) e.appendChild(c); });
  return e;
}

function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

// Простая SVG-иконка "цепочка" (замкнутая/разомкнутая) для кнопки сброса свойства.
function chainIconSvg(broken) {
  return broken
    ? '<svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 12l2-2M6.5 9.5L5 8a2.5 2.5 0 013.5-3.5l1.5 1.5M13.5 10.5L15 12a2.5 2.5 0 01-3.5 3.5l-1.5-1.5" stroke-linecap="round"/></svg>'
    : '<svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M8 12l4-4M6.5 9.5L5 8a2.5 2.5 0 013.5-3.5l1.5 1.5M13.5 10.5L15 12a2.5 2.5 0 01-3.5 3.5l-1.5-1.5" stroke-linecap="round"/></svg>';
}

function chevronSvg(open) {
  return '<svg viewBox="0 0 20 20" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" style="transform:rotate(' + (open ? "0" : "-90") + 'deg);transition:transform var(--ac-transition);"><path d="M5 8l5 5 5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}

function buildShell() {
  const app = document.getElementById("app");
  clear(app);

  // ---- Левая панель навигации ----
  const nav = h("nav", {

        click: function () { setActiveTab(tab.id); },
        mouseenter: function () { if (STATE.activeTab !== tab.id) btn.style.background = "var(--ac-bg-hover)"; },
        mouseleave: function () { if (STATE.activeTab !== tab.id) btn.style.background = "transparent"; }
      }
    }, [
      h("span", {
        text: tab.label,

      })
    ]);

    nav.appendChild(btn);
  });

  // Переключатель темы внизу левой панели
  const themeBtn = h("button", {
    attrs: { id: "theme-toggle", title: "Переключить тему" },
    style: "appearance:none;border:none;border-top:1px solid var(--ac-border);background:transparent;" +
           "cursor:pointer;flex:0 0 2.75rem;display:flex;align-items:center;justify-content:center;" +
           "color:var(--ac-text-secondary);font-size:1rem;",
    on: {
      click: function () { applyTheme(STATE.theme === "light" ? "dark" : "light"); },
      mouseenter: function () { themeBtn.style.background = "var(--ac-bg-hover)"; },

    }
  }, [ h("span", { attrs: { id: "theme-toggle-icon" }, text: "\u263D" }) ]);
  nav.appendChild(themeBtn);

  // ---- Правая рабочая область ----
  const workspace = h("main", {
    attrs: { id: "workspace" },
    style: "flex:1 1 auto;min-width:0;height:100%;overflow:hidden;background:var(--ac-bg-workspace);" +
           "display:flex;flex-direction:column;color:var(--ac-text-primary);font-size:0.85rem;"

  app.appendChild(nav);
  app.appendChild(workspace);

  highlightNav();
  renderActiveTab();

function highlightNav() {
  TABS.forEach(function (tab) {
    const btn = document.querySelector('[data-nav-btn="' + tab.id + '"]');
    if (!btn) return;
    const active = tab.id === STATE.activeTab;
    btn.style.background = active ? "var(--ac-bg-workspace)" : "transparent";
    btn.style.color = active ? "var(--ac-accent)" : "var(--ac-text-secondary)";
    btn.style.borderLeft = active ? "2px solid var(--ac-accent)" : "2px solid transparent";
  });
}

function setActiveTab(id) {
  STATE.activeTab = id;
  highlightNav();
  renderActiveTab();
}

function renderActiveTab() {
  const workspace = document.getElementById("workspace");
  clear(workspace);
  switch (STATE.activeTab) {
    case "monitor":   renderMonitorTab(workspace); break;
    case "sync":      renderSyncTab(workspace); break;
    case "numbering": renderNumberingTab(workspace); break;
    case "summary":   renderPlaceholderTab(workspace); break;
    case "spec":      renderPlaceholderTab(workspace); break;
  }
}

function renderPlaceholderTab(container) {

/* =====================================================================================
   6. ВКЛАДКА «СИНХРОНИЗАЦИЯ»
   ---------------------------------------------------------------------------------
   contenteditable-редактор с подсветкой синтаксиса DSL на лету через Vanilla JS
   (регулярные выражения оборачивают токены в <span style="color:...">).
   ===================================================================================== */

const SYNC_TOKEN_RE = /("(?:[^"\\]|\\.)*")|(<[^<>]*>)|(\(\s*\d+\s*,\s*[^)]+?\s*\))|\b(Sync_from|Sync_to|Sync_flag|Renum|Sum|Sync_reset)\b|\b(Property|Coord|Glob|IFC|Morph|Material|MEP|Class|File)(:)|\b(empty|trim_empty|def|uniq|sum|max|min|FullName)\b|([{};])/g;

function tokenizeSync(text) {
  let result = "";
  let lastIndex = 0;
  text.replace(SYNC_TOKEN_RE, function (match, str, expr, range, cmd, ns, nsColon, kw, brack, offset) {
    result += escapeHtml(text.slice(lastIndex, offset));
    if (str !== undefined) result += '<span style="color:var(--ac-code-string)">' + escapeHtml(str) + "</span>";
    else if (expr !== undefined) result += '<span style="color:var(--ac-code-expr)">' + escapeHtml(expr) + "</span>";
    else if (range !== undefined) result += '<span style="color:var(--ac-code-range)">' + escapeHtml(range) + "</span>";
    else if (cmd !== undefined) result += '<span style="color:var(--ac-code-command);font-weight:600">' + escapeHtml(cmd) + "</span>";
    else if (ns !== undefined) result += '<span style="color:var(--ac-code-namespace)">' + escapeHtml(ns + nsColon) + "</span>";
    else if (kw !== undefined) result += '<span style="color:var(--ac-code-keyword)">' + escapeHtml(kw) + "</span>";
    else if (brack !== undefined) result += '<span style="color:var(--ac-code-bracket)">' + escapeHtml(brack) + "</span>";
    lastIndex = offset + match.length;
    return match;
  });
  result += escapeHtml(text.slice(lastIndex));
  return result.length ? result : "<br>";
}

function getCaretOffset(root) {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return 0;
  const range = sel.getRangeAt(0);
  if (!root.contains(range.startContainer)) return 0;
  const preRange = range.cloneRange();
  preRange.selectNodeContents(root);
  preRange.setEnd(range.endContainer, range.endOffset);
  return preRange.toString().length;
}

function setCaretOffset(root, offset) {
  const sel = window.getSelection();
  const range = document.createRange();
  let remaining = offset;
  let target = null, targetOffset = 0;
  (function walk(el) {
    for (let i = 0; i < el.childNodes.length; i++) {
      if (target) return;
      const child = el.childNodes[i];
      if (child.nodeType === Node.TEXT_NODE) {
        if (remaining <= child.textContent.length) { target = child; targetOffset = remaining; return; }
        remaining -= child.textContent.length;
      } else {
        walk(child);
      }
    }
  })(root);
  if (!target) { target = root; targetOffset = root.childNodes.length; }
  range.setStart(target, targetOffset);
  range.collapse(true);
  sel.removeAllRanges();
  sel.addRange(range);
}

  const editor = h("div", {
    attrs: { contenteditable: "true", spellcheck: "false", "data-role": "sync-editor" },
    style: "outline:none;font-family:'Cascadia Code','Consolas',monospace;font-size:0.8rem;line-height:1.55;" +
           "white-space:pre-wrap;word-break:break-word;min-height:100%;color:var(--ac-text-primary);" +
           "background:var(--ac-code-bg);border:1px solid var(--ac-border);border-radius:0.3rem;padding:0.6rem 0.7rem;"
  });
  editor.textContent = DEFAULT_SYNC_SCRIPT;
  editor.innerHTML = tokenizeSync(editor.textContent);

  editor.addEventListener("input", function () {
    const offset = getCaretOffset(editor);
    const text = editor.textContent;
    editor.innerHTML = tokenizeSync(text);
    setCaretOffset(editor, offset);
  });

  SYNC_SNIPPETS.forEach(function (cmd) {
    toolbar.appendChild(h("button", {
      text: cmd,
      style: "font-size:0.7rem;padding:0.25rem 0.5rem;border-radius:0.25rem;cursor:pointer;" +
             "background:var(--ac-bg-elevated);color:var(--ac-code-command);border:1px solid var(--ac-border);font-family:monospace;",
      on: {
        click: function () {
          editor.focus();
          const insertion = cmd + "{  }";
          editor.textContent = editor.textContent + (editor.textContent.endsWith("\n") || !editor.textContent ? "" : "\n") + insertion;
          editor.innerHTML = tokenizeSync(editor.textContent);
          setCaretOffset(editor, editor.textContent.length - 2);
        }
      }
    }));
  });

  // Нижняя панель управления
  const footer = h("div", {
    style: "flex:0 0 auto;border-top:1px solid var(--ac-border);background:var(--ac-bg-elevated);" +
           "padding:0.5rem 0.75rem;display:flex;align-items:center;gap:0.5rem;"
  });
  const statusText = h("span", { text: "", style: "font-size:0.7rem;color:var(--ac-text-secondary);flex:1 1 auto;" });
  const runBtn = h("button", {
    text: "Выполнить",
    style: "padding:0.35rem 0.8rem;font-size:0.78rem;border:none;border-radius:0.25rem;cursor:pointer;" +
           "background:var(--ac-accent);color:var(--ac-accent-contrast);font-weight:600;",
    on: {
      click: function () {
        runBtn.disabled = true; runBtn.textContent = "Выполняется…";
        // AGENT TODO: ACBridge.executeSyncScript должен реально применить DSL-скрипт
        // к выделению в Archicad — см. комментарий к функции выше.
        ACBridge.executeSyncScript(editor.textContent).then(function (result) {
          runBtn.disabled = false; runBtn.textContent = "Выполнить";
          statusText.textContent = result.message;
          statusText.style.color = result.success ? "var(--ac-text-secondary)" : "var(--ac-danger)";
        });
      }
    }
  });
  footer.appendChild(statusText);
  footer.appendChild(runBtn);

  editorWrap.appendChild(editor);
  root.appendChild(legend);
  root.appendChild(toolbar);
  root.appendChild(editorWrap);
  root.appendChild(footer);
  container.appendChild(root);
}

/* =====================================================================================
   7. ВКЛАДКА «НУМЕРАЦИЯ»
   ---------------------------------------------------------------------------------
   Каскадное раскрытие: Блок 1 всегда развёрнут, Блоки 2–4 в пассивном состоянии
   показывают только текстовую сводку и разворачиваются по клику.
   ===================================================================================== */

function renderNumberingTab(container) {
  const root = h("div", { style: "display:flex;flex-direction:column;height:100%;overflow:auto;padding:0.6rem 0.75rem;gap:0.5rem;" });

  ACBridge.getNumberingProperties().then(function (props) {
    root.appendChild(renderNumberingBlock1(props));
    root.appendChild(renderNumberingBlock2(props));
    root.appendChild(renderNumberingBlock3(props));
    const preview = renderNumberingBlock4();
    root.appendChild(preview);
    refreshNumberingPreview(preview);
  });

  container.appendChild(root);
}

function numberingSelect(props, currentValue, onChange, includeEmptyLabel) {
  const select = h("select", {
    style: "width:100%;padding:0.3rem 0.4rem;font-size:0.76rem;background:var(--ac-bg-input);" +
           "color:var(--ac-text-primary);border:1px solid var(--ac-border);border-radius:0.25rem;",
    on: { change: function () { onChange(select.value || null); } }
  });
  if (includeEmptyLabel) select.appendChild(h("option", { text: includeEmptyLabel, attrs: { value: "" } }));
  props.forEach(function (p) {
    select.appendChild(h("option", { text: p.name, attrs: { value: p.id } }));
  });
  if (currentValue) select.value = currentValue;
  return select;
}

function blockShell(title, isOpen, summaryText, onToggle) {
  const wrap = h("div", { style: "border:1px solid var(--ac-border);border-radius:0.35rem;background:var(--ac-bg-elevated);overflow:hidden;flex:0 0 auto;" });
  const header = h("div", {
    style: "display:flex;align-items:center;gap:0.4rem;padding:0.5rem 0.6rem;cursor:pointer;",
    on: { click: onToggle }
  }, [
    h("span", { html: chevronSvg(isOpen), style: "color:var(--ac-text-tertiary);display:flex;flex:0 0 auto;" }),
    h("span", { text: title, style: "font-size:0.76rem;font-weight:700;color:var(--ac-text-primary);flex:0 0 auto;" }),
    h("span", { text: summaryText || "", style: "font-size:0.72rem;color:var(--ac-text-tertiary);flex:1 1 auto;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" })
  ]);
  wrap.appendChild(header);
  return wrap;
}

function codePreview(text) {
  return h("div", {
    text: text,
    style: "margin-top:0.4rem;font-family:monospace;font-size:0.72rem;color:var(--ac-text-secondary);" +
           "background:var(--ac-code-bg);border:1px solid var(--ac-border);border-radius:0.25rem;padding:0.4rem 0.5rem;word-break:break-all;"
  });
}

function renderNumberingBlock1(props) {
  const cfg = STATE.numberingConfig;
  const wrap = blockShell("1. Флаг", true, null, function () {});
  const body = h("div", { style: "padding:0 0.6rem 0.6rem;" }, [
    h("div", { text: "Свойство-флаг для элементов", style: "font-size:0.7rem;color:var(--ac-text-secondary);margin-bottom:0.25rem;" }),
    numberingSelect(props, cfg.flagProperty, function (v) {
      cfg.flagProperty = v;
      refreshNumberingPreview(document.querySelector('[data-role="numbering-preview"]'));
    }, "— выбрать свойство —")
  ]);
  wrap.appendChild(body);
  return wrap;
}

function renderNumberingBlock2(props) {
  const cfg = STATE.numberingConfig;
  let open = STATE.numberingOpenBlocks.flag;
  const summary = function () { return cfg.ruleProperty ? ("Renum_flag по: " + (props.find(function (p) { return p.id === cfg.ruleProperty; }) || {}).name) : "не задано"; };

  const wrap = blockShell("2. Редактор флага (Renum_flag)", open, summary(), function () {
    STATE.numberingOpenBlocks.flag = !STATE.numberingOpenBlocks.flag;
    const idx = Array.prototype.indexOf.call(wrap.parentElement.children, wrap);
    wrap.replaceWith(renderNumberingBlock2(props));
  });

  if (!open) return wrap;

  const body = h("div", { style: "padding:0 0.6rem 0.6rem;display:flex;flex-direction:column;gap:0.4rem;" });
  body.appendChild(h("div", { text: "Свойство-правило", style: "font-size:0.7rem;color:var(--ac-text-secondary);" }));
  body.appendChild(numberingSelect(props, cfg.ruleProperty, function (v) { cfg.ruleProperty = v; updatePreview(); }, "— выбрать свойство —"));

  body.appendChild(h("div", { text: "Формат номера", style: "font-size:0.7rem;color:var(--ac-text-secondary);margin-top:0.2rem;" }));
  const formatSelect = h("select", {
    style: "width:100%;padding:0.3rem 0.4rem;font-size:0.76rem;background:var(--ac-bg-input);" +
           "color:var(--ac-text-primary);border:1px solid var(--ac-border);border-radius:0.25rem;",
    on: { change: function () { cfg.numberFormat = formatSelect.value; updatePreview(); redrawPreviewCode(); } }
  });
  ["NULL", "SPACE", "ALLNULL", "без суффикса"].forEach(function (f) {
    formatSelect.appendChild(h("option", { text: f, attrs: { value: f } }));
  });
  formatSelect.value = cfg.numberFormat;
  body.appendChild(formatSelect);

  const preview = codePreview(buildFlagCode(props));
  body.appendChild(preview);

  function redrawPreviewCode() { preview.textContent = buildFlagCode(props); }
  function updatePreview() { redrawPreviewCode(); refreshNumberingPreview(document.querySelector('[data-role="numbering-preview"]')); }

  wrap.appendChild(body);
  return wrap;
}

function buildFlagCode(props) {
  const cfg = STATE.numberingConfig;
  const ruleName = cfg.ruleProperty ? "Property:" + (props.find(function (p) { return p.id === cfg.ruleProperty; }) || { name: "?" }).name : "…";
  return "Renum_flag{ " + ruleName + "; " + cfg.numberFormat + " }";
}

function renderNumberingBlock3(props) {
  const cfg = STATE.numberingConfig;
  let open = STATE.numberingOpenBlocks.ruleEditor;
  const summary = function () { return cfg.criterionProperty ? ("Renum по: " + (props.find(function (p) { return p.id === cfg.criterionProperty; }) || {}).name) : "не задано"; };

  const wrap = blockShell("3. Редактор правила (Renum)", open, summary(), function () {
    STATE.numberingOpenBlocks.ruleEditor = !STATE.numberingOpenBlocks.ruleEditor;
    wrap.replaceWith(renderNumberingBlock3(props));
  });

  if (!open) return wrap;

  const body = h("div", { style: "padding:0 0.6rem 0.6rem;display:flex;flex-direction:column;gap:0.4rem;" });
  body.appendChild(h("div", { text: "Свойство-критерий (обязательно)", style: "font-size:0.7rem;color:var(--ac-text-secondary);" }));
  body.appendChild(numberingSelect(props, cfg.criterionProperty, function (v) { cfg.criterionProperty = v; update(); }, "— выбрать свойство —"));

  body.appendChild(h("div", { text: "Свойство для разбивки (опционально)", style: "font-size:0.7rem;color:var(--ac-text-secondary);margin-top:0.2rem;" }));
  body.appendChild(numberingSelect(props, cfg.splitProperty, function (v) { cfg.splitProperty = v; update(); }, "— без разбивки —"));

  const preview = codePreview(buildRuleCode(props));
  body.appendChild(preview);

  function update() {
    preview.textContent = buildRuleCode(props);
    refreshNumberingPreview(document.querySelector('[data-role="numbering-preview"]'));
  }

  wrap.appendChild(body);
  return wrap;
}

function buildRuleCode(props) {
  const cfg = STATE.numberingConfig;
  const crit = cfg.criterionProperty ? "Property:" + (props.find(function (p) { return p.id === cfg.criterionProperty; }) || { name: "?" }).name : "…";
  const split = cfg.splitProperty ? "; Property:" + (props.find(function (p) { return p.id === cfg.splitProperty; }) || { name: "?" }).name : "";
  return "Renum{ " + crit + split + " }";
}

function renderNumberingBlock4() {
  const wrap = h("div", {
    attrs: { "data-role": "numbering-preview" },
    style: "border:1px solid var(--ac-border);border-radius:0.35rem;background:var(--ac-bg-elevated);" +
           "flex:0 0 auto;padding:0.5rem 0.6rem;max-height:11rem;overflow:auto;"
  });
  wrap.appendChild(h("div", {
    text: "4. Предпросмотр",
    style: "font-size:0.76rem;font-weight:700;color:var(--ac-text-primary);margin-bottom:0.35rem;"
  }));
  wrap.appendChild(h("div", { attrs: { "data-role": "numbering-preview-body" }, text: "" }));
  return wrap;
}

function refreshNumberingPreview(previewWrap) {
  if (!previewWrap) return;
  const body = previewWrap.querySelector('[data-role="numbering-preview-body"]');
  clear(body);
  body.appendChild(h("div", { text: "Пересчёт…", style: "font-size:0.72rem;color:var(--ac-text-tertiary);" }));

  ACBridge.getNumberingPreview(STATE.numberingConfig).then(function (rows) {
    clear(body);
    if (!rows.length) {
      body.appendChild(h("div", { text: "Задайте свойство-критерий, чтобы увидеть предпросмотр.", style: "font-size:0.72rem;color:var(--ac-text-tertiary);" }));
      return;
    }
    const table = h("table", { style: "width:100%;border-collapse:collapse;font-size:0.72rem;" });
    const thead = h("tr", {}, [
      h("th", { text: "Номер", style: "text-align:left;padding:0.2rem 0.4rem;color:var(--ac-text-tertiary);border-bottom:1px solid var(--ac-border);font-weight:600;" }),
      h("th", { text: "Значение свойства-критерия", style: "text-align:left;padding:0.2rem 0.4rem;color:var(--ac-text-tertiary);border-bottom:1px solid var(--ac-border);font-weight:600;" })
    ]);
    table.appendChild(thead);
    rows.forEach(function (r) {
      table.appendChild(h("tr", {}, [
        h("td", { text: r.number, style: "padding:0.2rem 0.4rem;color:var(--ac-accent);font-family:monospace;border-bottom:1px solid var(--ac-divider);" }),
        h("td", { text: r.criterionValue, style: "padding:0.2rem 0.4rem;color:var(--ac-text-primary);border-bottom:1px solid var(--ac-divider);" })
      ]));
    });
    body.appendChild(table);
  });
}

/* =====================================================================================
   8. ЗАПУСК
   ===================================================================================== */
document.addEventListener("DOMContentLoaded", function () {
  applyTheme(STATE.theme); // светлая тема по умолчанию
  buildShell();
});
</script>
</body>
</html>
