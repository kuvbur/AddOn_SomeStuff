<!DOCTYPE html>
<!--
  =====================================================================================
  Archicad — Панель «Редактор описаний свойств»
  =====================================================================================
  Реализовано строго по ТЗ:
    - Один файл dialogs/index.html
    - Только Vanilla HTML / Vanilla JS
    - Только inline-стили (style="..."). Тег <style> и CSS-файлы НЕ используются.
      Тема (свет/тьма) реализована через CSS custom properties (--ac-*), которые
      объявлены в inline style корневого <html> и используются как var(--ac-...)
      внутри инлайновых style="" каждого элемента. Формально это остаётся
      "инлайн-стилями" — блока <style> нигде нет, просто значение переменной
      меняется в одном месте (html.style) и мгновенно применяется по всему дереву.
    - Адаптивная резиновая вёрстка, левая колонка вкладок фиксированной логической
      ширины (в rem — масштабируется вместе с DPI автоматически браузером).
    - Реального моста с Archicad нет: весь обмен данными идёт через объект
      ACBridge (см. раздел "МОСТ С ARCHICAD (МОК)" ниже). Каждая функция помечена
      комментарием "AGENT TODO" с описанием того, что она должна делать и что
      обязана возвращать в реальной интеграции — заменить тело функции на
      настоящий вызов нативного моста (например window.chrome.webview.postMessage
      или собственный JS-мост C++ панели), сохранив сигнатуру и формат Promise.
  =====================================================================================
-->

/* =====================================================================================

   Все цвета вынесены в CSS custom properties на элементе <html>. Каждый визуальный
   элемент интерфейса ссылается на них через var(--ac-...) внутри собственного
   inline style. Переключение темы = однократная перезапись набора переменных на
   <html> — дерево обновляется целиком и мгновенно, без "залипших" тёмных участков.

const THEMES = {

const STATE = {
  theme: "light",              // по умолчанию светлая тема (задано заказчиком)

  monitorFilter: "",
  monitorValueFilter: "",
  monitorRulesOnly: false,

  monitorSelectedPropertyId: null,

function applyTheme(name) {
  STATE.theme = name;
  const vars = THEMES[name];
  const root = document.documentElement;
  for (const key in vars) root.style.setProperty(key, vars[key]);
  root.style.setProperty("--ac-color-scheme", name);
  const toggle = document.getElementById("theme-toggle-icon");
  if (toggle) toggle.textContent = name === "light" ? "\u263D" : "\u2600"; // ☾ / ☀
}

/* =====================================================================================
   2. МОСТ С ARCHICAD (МОК)
   ---------------------------------------------------------------------------------
   В реальном плагине этот раздел заменяется на настоящий JS-мост, который
   отправляет запросы в C++ часть Add-On'а (например через
   window.chrome.webview.postMessage(...) + window.chrome.webview.addEventListener,
   либо через window.acPanelBridge, который выставляет C++ сторона) и возвращает
   Promise, резолвящийся ответом от Archicad.
   Каждая функция ниже уже имеет ПРАВИЛЬНУЮ сигнатуру и формат возвращаемых данных —
   агенту, который будет подключать реальный API, нужно просто заменить тело
   функции, сохранив контракт (что принимает / что возвращает).
   ===================================================================================== */
const ACBridge = (function () {

  // Имитация сетевой/межпроцессной задержки моста.
  function delay(ms) { return new Promise(function (res) { setTimeout(res, ms); }); }

  /**
   * Получает количество выделенных элементов через JS-мост с ArchiCAD.
   * Вызывает window.ACAPI.GetSelectionInfo() и возвращает Promise с результатом.
   * @returns {Promise<{count:number}>}
   */
  function getSelectionInfo() {
    // Пробуем вызвать C++ JS-мост
    try {
      if (typeof window.ACAPI !== 'undefined' && window.ACAPI.GetSelectionInfo) {
        var r = window.ACAPI.GetSelectionInfo();
        return Promise.resolve({ count: (r && typeof r.count === 'number') ? r.count : MOCK_SELECTED_COUNT });
      }
    } catch (e) {
      // Мост недоступен — используем мок (консоль в ArchiCAD не просматривается)
    }
    return Promise.resolve({ count: MOCK_SELECTED_COUNT });
  }

  /**
         * Получает дерево классификаций для текущего выделения через JS-мост.
         * Вызывает window.ACAPI.GetClassification() и возвращает Promise с результатом.
         * @returns {Promise<{common:boolean, commonPath:string[], differing:{classification:string, count:number, total:number}[], options:string[]}>}
         */
        function getClassification() {
          return new Promise(function (resolve) {
            try {
              if (typeof window.ACAPI !== 'undefined' && window.ACAPI.GetClassification) {
                var result = window.ACAPI.GetClassification();
                var handleResult = function(data) {
                  if (!data) {
                    resolve({ common: true, commonPath: [], differing: [], options: [] });
                    return;
                  }
                  data = typeof data === 'string' ? JSON.parse(data) : data;
                  resolve({
                    common: data.common,
                    commonPath: data.commonPath || [],
                    differing: data.differing || [],
                    options: data.options || []
                  });
                };

                if (result && typeof result.then === 'function') {
                  result.then(handleResult).catch(function() {
                    resolve({ common: true, commonPath: [], differing: [], options: [] });
                  });
                } else {
                  handleResult(result);
                }
              } else {
                resolve({
                  common: false,
                  commonPath: ["IfcWall"],
                  differing: [
                    { classification: "STR-001 Стена несущая", count: 3, total: 5 },
                    { classification: "STR-002 Стена ненесущая", count: 2, total: 5 }
                  ],
                  options: ["STR-001 Стена несущая", "STR-002 Стена ненесущая", "STR-003 Перегородка"]
                });
              }
            } catch (e) {
              resolve({
                common: false,
                commonPath: ["IfcWall"],
                differing: [
                  { classification: "STR-001 Стена несущая", count: 3, total: 5 },
                  { classification: "STR-002 Стена ненесущая", count: 2, total: 5 }
                ],
                options: ["STR-001 Стена несущая", "STR-002 Стена ненесущая", "STR-003 Перегородка"]
              });
            }
          });
        }

    /**
     * Назначает единую классификацию всем выделенным элементам.
     * Вызывает window.ACAPI.SetClassification() и возвращает Promise с результатом.
     * @param {string} classificationValue — значение из options (см. getClassification)
     * @returns {Promise<{success:boolean}>}
     */
    function setClassificationForSelection(classificationValue) {
          return new Promise(function (resolve) {
            try {
              if (typeof window.ACAPI !== 'undefined' && window.ACAPI.SetClassification) {
                // Строка БЕЗ обёртки в массив — мост передаёт одиночный аргумент как JSValue
                var result = window.ACAPI.SetClassification(classificationValue);
                // Bug 5 fix: handle both Promise and sync return
                var handleResult = function(data) {
                  var parsed = typeof data === 'string' ? JSON.parse(data) : data;
                  resolve({ success: parsed.success === true });
                };
                if (result && typeof result.then === 'function') {
                  result.then(handleResult).catch(function(err) {
                    resolve({ success: false });
                  });
                } else {
                  handleResult(result);
                }
              } else {
                resolve({ success: false });
              }
            } catch (e) {
              resolve({ success: false });
            }
          });
        }

  /**
   * AGENT TODO: вернуть список преднастроенных фильтров свойств (хранятся
   * в конфигурации плагина / шаблоне). Каждый фильтр — либо обычная подстрока,
   * либо регулярное выражение в формате "/шаблон/".
   * @returns {Promise<{label:string, query:string}[]>}
   */
  function getFilterPresets() {
    const fallback = [
      { label: "Все свойства", query: "" },
      { label: "Только IFC", query: "/^IFC:/" },
      { label: "Только геометрия", query: "/^(Coord|Geo):/" },
      { label: "Незаполненные", query: "/пусто|empty/" }
    ];
    try {
      if (typeof window.ACAPI !== 'undefined' && window.ACAPI.GetFilterPresets) {
        var result = window.ACAPI.GetFilterPresets();
        var handleResult = function (data) {
          var parsed = typeof data === 'string' ? JSON.parse(data) : data;
          if (Array.isArray(parsed)) return parsed;
          if (parsed && Array.isArray(parsed.presets)) return parsed.presets;
          return fallback;
        };
        if (result && typeof result.then === 'function') {
          return result.then(handleResult).catch(function () { return fallback; });
        }
        return Promise.resolve(handleResult(result));
      }
    } catch (e) {
    }
    return delay(40).then(function () { return fallback; });
  }

  /**
   * Запрашивает у Archicad список свойств для текущего выделения через реальный JS-мост.
   * Вызывает window.ACAPI.GetPropertiesList() и возвращает Promise с результатом.
   * Формат возвращаемых данных: { elements: [{guid, properties: [{name, value, valueType, propertyGuid}]}], count: N }
   * @param {string} filterText - не используется на стороне C++ (фильтрация в JS если нужно)
   * @returns {Promise<{elements:Array, count:number}>}
   */
    function getPropertiesList(filterText) {
    try {
      if (typeof window.ACAPI !== 'undefined' && window.ACAPI.GetPropertiesList) {
        return window.ACAPI.GetPropertiesList().then(function (result) {
          // Parse JSON string if needed (pull-pattern returns string)
          var data = typeof result === 'string' ? JSON.parse(result) : result;
          // Aggregate properties across ALL selected elements
          if (data && data.elements && data.elements.length > 0) {
            const totalElements = data.elements.length;
            
            // Collect all properties by GUID, aggregating values across elements
            const propMap = {};
            data.elements.forEach(function (elem) {
              if (elem.properties) {
                elem.properties.forEach(function (p) {
                  const guid = p.propertyGuid;
                  if (!propMap[guid]) {
                    propMap[guid] = {
                      id: p.propertyGuid,
                      name: p.name,
                      group: p.group || "Без группы",
                      valueType: p.valueType,
                      hasRule: p.hasRule === true,
                      values: [],
                      // guid'ы элементов, у которых встретилось каждое значение
                      valueElementGuids: {},
                      elementsWithProp: 0
                    };
                  }
                  // Add value from this element
                  propMap[guid].values.push(p.value);
                  if (!propMap[guid].valueElementGuids[p.value]) {
                    propMap[guid].valueElementGuids[p.value] = [];
                  }
                  propMap[guid].valueElementGuids[p.value].push(elem.guid);
                  propMap[guid].elementsWithProp++;
                });
              }
            });
            
            // Aggregate unique values with counts for each property
            const groupMap = {};
            Object.keys(propMap).forEach(function (guid) {
              const prop = propMap[guid];
              const valueCounts = {};
              prop.values.forEach(function (v) {
                valueCounts[v] = (valueCounts[v] || 0) + 1;
              });
              const uniqueValues = Object.keys(valueCounts).map(function (v) {
                return { value: v, count: valueCounts[v] };
              });
              const allHave = (prop.elementsWithProp === totalElements);
              const countWithProperty = prop.elementsWithProp;
              
              const groupName = prop.group || "Без группы";
              if (!groupMap[groupName]) {
                groupMap[groupName] = [];
              }
              groupMap[groupName].push({
                id: guid,
                name: prop.name,
                group: prop.group,
                valueType: prop.valueType,
                hasRule: prop.hasRule,
                values: uniqueValues,
                // GUID'ы элементов по каждому уникальному значению — для
                // подсветки/приближения при клике на строку значения
                valueElementGuids: prop.valueElementGuids,
                allHave: allHave,
                countWithProperty: countWithProperty
              });
            });
            
            // Convert to array format expected by renderPropertyList
            return Object.keys(groupMap).map(function (groupName) {
              return {
                group: groupName,
                properties: groupMap[groupName]
              };
            });
          }
          return [];
        });
      }
    } catch (e) {
      // Мост недоступен — fallback к моку ниже (консоль в ArchiCAD не просматривается)
    }
    // Fallback to mock
    return delay(90).then(function () {
      return [];
    });
  }function getPropertyValue(propertyId) {
    return delay(70).then(function () {
      const mockValues = {
        "gen.id": { common: false, values: [{ value: "ST-014", count: 2 }, { value: "ST-021", count: 1 }, { value: "— не задано —", count: 2 }] },
        "ifc.predefinedtype": { common: false, values: [{ value: "SOLIDWALL", count: 4 }, { value: "PARAPET", count: 1 }] },
        "geo.thickness": { common: false, values: [{ value: "250 мм", count: 2 }, { value: "— не задано —", count: 3 }] },
        "num.section": { common: false, values: [{ value: "А", count: 1 }, { value: "— не задано —", count: 4 }] }
      };
      const found = mockValues[propertyId];
      if (found) return Object.assign({ propertyName: propertyId }, found);
      return { propertyName: propertyId, common: true, values: [{ value: "значение примера", count: MOCK_SELECTED_COUNT }] };
    });
  }

  /**
   * Подсветка цветом и приближение элементов на плане по их GUID'ам.
   * Вызывает window.ACAPI.HighlightElements() — C++ подсвечивает элементы
   * (APIIo_HighlightElementsID, как в Spec.cpp) и зумит камеру;
   * текущее выделение НЕ меняется.
   * @param {string[]} guids - массив GUID'ов элементов
   * @returns {Promise<boolean>} true при успехе подсветки и зума
   */
  function highlightElements(guids) {
    try {
      if (typeof window.ACAPI !== 'undefined' && window.ACAPI.HighlightElements && guids && guids.length > 0) {
        // Аргументы в мост передаются одним значением — JSON-строкой массива
        return Promise.resolve(window.ACAPI.HighlightElements(JSON.stringify(guids)));
      }
    } catch (e) { /* bridge not ready */ }
    return Promise.resolve(false);
  }

  /**
   * AGENT TODO: сбросить значение свойства к значению по умолчанию для всех
   * выделенных элементов (снять оверрайд).
   * @param {string} propertyId
   * @returns {Promise<{success:boolean}>}
   */
  function resetPropertyToDefault(propertyId) {
    return delay(120).then(function () { return { success: true }; });
  }

  /**
   * AGENT TODO: список свойств, пригодных для использования как
   * свойство-флаг / свойство-правило / свойство-критерий / свойство разбивки
   * в блоках вкладки «Нумерация». В реальной интеграции список может отличаться
   * по каждому блоку (например, только текстовые/числовые свойства для критерия).
   * @returns {Promise<{id:string, name:string}[]>}
   */
  function getNumberingProperties() {
    return delay(50).then(function () {
      return [
        { id: "num.floor", name: "Этаж" },
        { id: "num.section", name: "Секция" },
        { id: "ifc.class", name: "IFC Класс" },
        { id: "gen.layer", name: "Слой" },
        { id: "geo.area", name: "Площадь" }
      ];
    });
  }

  /**
   * AGENT TODO: выполнить пересчёт нумерации по текущей конфигурации (флаг,
   * правило, критерий, разбивка) и вернуть таблицу предпросмотра — присвоенный
   * номер и значение свойства-критерия для каждого выделенного элемента.
   * @param {object} config — {flagProperty, ruleProperty, numberFormat, criterionProperty, splitProperty}
   * @returns {Promise<{number:string, criterionValue:string}[]>}
   */
  function getNumberingPreview(config) {
    return delay(100).then(function () {
      const base = [
        { number: "A-01", criterionValue: "Стена наружная — Эт.1" },
        { number: "A-02", criterionValue: "Стена наружная — Эт.2" },
        { number: "B-01", criterionValue: "Стена внутренняя — Эт.1" },
        { number: "B-02", criterionValue: "Стена подвал — Эт.0" },

/**
   * AGENT TODO: список свойств-правил спецификации для проверки.
   * Источник выбирается по наличию выделения: при непустом выделении берутся
   * свойства выделенных элементов (уже приходят из window.ACAPI.GetPropertiesList
   * вместе с propertyGuid и hasRule — новый мост не нужен), при пустом — все
   * свойства проекта с правилами SomeStuff из PROPERTYCACHE.
   * Реальный вызов: window.ACAPI.GetSpecRuleProperties() ->
   *   JSON-строка {source:"selection"|"project", selectionCount:N,
   *                properties:[{id, name, hasSpecRule}]}
   * hasSpecRule — ТОЧНЫЙ признак наличия команды Spec_rule в описании
   * свойства, а не агрегат hasRule (тот суммирует Sync/Spec/Renum/Sum).
   * Это НЕ признак включённого флага: включённость зависит от элемента и
   * меняется после записи, поэтому список свойств её знать не может — её
   * показывает проверка правила по GUID.
   * @returns {Promise<{source:string, selectionCount:number,
   *                  properties:{id:string, name:string, hasSpecRule:boolean}[]}>}
   */
  function getSpecRuleProperties() {
      return new Promise(function (resolve) {
        var bridgePresent = typeof window.ACAPI !== 'undefined' && !!window.ACAPI.GetSpecRuleProperties;
        try {
          if (bridgePresent) {
            var result = window.ACAPI.GetSpecRuleProperties();
            var handleResult = function (data) {
              var parsed = typeof data === 'string' ? JSON.parse(data) : data;
              resolve({
                source: parsed.source || "project",
                selectionCount: parsed.selectionCount || 0,
                properties: parsed.properties || []
              });
            };
            if (result && typeof result.then === 'function') {
              result.then(handleResult).catch(function () { resolve({ source: "none", selectionCount: 0, properties: [] }); });
            } else {
              handleResult(result);
            }
            return;
          }
        } catch (e) {
          // Мост есть, но упал — мок не подставляем: подмена скрыла бы поломку
          // моста под видом рабочего списка. Показываем пустой источник.
          if (bridgePresent) {
            resolve({ source: "none", selectionCount: 0, properties: [] });
            return;
          }
        }
        // Моста нет вовсе — HTML открыт вне Archicad: показываем мок.
        resolve({ source: "project", selectionCount: 0, properties: MOCK_SPEC_PROPERTIES });
      });
    }

  /**
   * AGENT TODO: проверка правила спецификации по GUID свойства-правила, read-only.
   * Вызывает window.ACAPI.CheckSpecRuleByPropertyGuid и возвращает Promise с
   * отчётом. Реальный вызов (паттерн ParsePropertyForElement — два аргумента
   * одним значением, ответ JSON-строкой):
   *   window.ACAPI.CheckSpecRuleByPropertyGuid(
   *     JSON.stringify([propertyGuid, limit]))
   * Ответ: {ok, checked, totalSelected, truncated, common:{...}, elements:[...]},
   * где common повторяет общую часть RuleCheckResult, а элемент — elementFlag,
   * checkedElement и missingRead.
   * @param {string} propertyGuid - GUID свойства-правила
   * @param {number} limit - максимум проверяемых элементов
   * @returns {Promise<object>}
   */
  function checkSpecRuleByPropertyGuid(propertyGuid, limit) {
        // Реальный вызов: оба значения — строками одним аргументом.
                // Число в массиве CEF раскрывает: в C++ приходит значение без кавычек,
                // и разбор по '"' уходит в ранний выход. DynamicCast<JSArray> на
                // аргументах роняет мост, поэтому массив сериализуется в строку.
                if (typeof window.ACAPI !== 'undefined' && window.ACAPI.CheckSpecRuleByPropertyGuid) {
                  var call = window.ACAPI.CheckSpecRuleByPropertyGuid(
                    JSON.stringify([String(propertyGuid || ""), String(limit || 10)])
                  );
          var unwrap = function (data) {
            var parsed = typeof data === 'string' ? JSON.parse(data) : data;
            // Ответ моста при отказе несёт common:null. Подставлять вместо него
            // мок нельзя: UI отличил бы отказ моста от успешной проверки и
            // показал бы несуществующие элементы как настоящие.
            return parsed || specRuleUnavailable();
          };
          if (call && typeof call.then === 'function') {
            return call.then(unwrap).catch(function () { return specRuleUnavailable(); });
          }
          return Promise.resolve(unwrap(call));
        }
        // Мост недоступен — правка HTML вне Archicad: показываем мок.
        return delay(220).then(function () {
          return mockSpecRuleReport(propertyGuid);
        });
      }

      // Ответ «мост недоступен»: те же поля, что и у CheckSpecRuleByPropertyGuid
      // при отказе, чтобы UI отрисовал их одинаково.
      function specRuleUnavailable() {
        return {
          ok: false,
          checked: 0,
          totalSelected: 0,
          truncated: false,
          common: null,
          elements: []
        };
      }

      // Мок ответа проверки — используется только без CEF-моста. Ответ зависит от
      // выбранного свойства: в C++ флаг назначения — одно значение с пометкой origin
      // (проверяется либо избранное, либо объект по умолчанию), поэтому мок обязан
      // отдавать обе ветки.
      function mockSpecRuleReport(propertyGuid) {
        var total = 12;
        var checked = Math.min(total, 10);
        var all = [];
        for (var i = 0; i < checked; i++) {
          all.push(mockSpecElement(i));
        }
        var found = propertyLookup[propertyGuid];
        return {
          ok: true,
          checked: checked,
          totalSelected: total,
          truncated: checked < total,
          common: {
            definitionFound: found ? true : false,
            ruleParsed: found ? true : false,
            parseError: found ? "None" : "NoGroupsAccepted",
            parseErrorText: found ? "" : "ни одна разобранная группа не попала в правило",
            propertyName: found ? found.name : "неизвестное свойство",
            favoriteFound: found ? found.favoriteFound : false,
            fromDefaultElem: found ? found.fromDefaultElem : false,
            missingWrite: found && found.missingWrite ? found.missingWrite : [],
            unresolvedInProject: [],
            destinationFlag: found ? found.destinationFlag : {
              checked: false,
              value: false,
              status: "Unknown",
              origin: "NotChecked",
              sourceName: ""
            }
          },
          elements: all
        };
      }

  // Мок назначения по свойству. Пять веток: избранное найдено, избранное не
  // найдено с fallback на объект по умолчанию, флага у объекта по умолчанию
  // нет, назначение не прочиталось вовсе, значение не вычислено.
  const propertyLookup = {
    "A1B2C3D4-0000-4000-8000-000000000001": {
      name: "Sync_GUID+Спецификация стен",
      favoriteFound: true,
      fromDefaultElem: false,
      missingWrite: [],
      destinationFlag: {
        checked: true, value: true, status: "HasValue",
        origin: "FavoriteValue", sourceName: "Спец. элемент стены"
      }
    },
    "A1B2C3D4-0000-4000-8000-000000000002": {
      name: "Sync_GUID+Спецификация плит перекрытия",
      favoriteFound: false,
      fromDefaultElem: true,
      missingWrite: ["Площадь", "Объём"],
      destinationFlag: {
        checked: true, value: false, status: "HasValue",
        origin: "DefaultElemValue", sourceName: "Спец. элемент перекрытия"
      }
    },
    "A1B2C3D4-0000-4000-8000-000000000003": {
      name: "Sync_GUID+Ведомость объёмов работ",
      favoriteFound: false,
      fromDefaultElem: true,
      missingWrite: [],
      destinationFlag: {
        checked: false, value: false, status: "NotPresent",
        origin: "DefaultElemValue", sourceName: "Спец. элемент объёма"
      }
    },
    "A1B2C3D4-0000-4000-8000-000000000004": {
      name: "Sync_GUID+Спецификация технических помещений",
      favoriteFound: false,
      fromDefaultElem: true,
      missingWrite: [],
      destinationFlag: {
        checked: false, value: false, status: "Unknown",
        origin: "NotChecked", sourceName: "Спец. элемент помещения"
      }
    },
    "A1B2C3D4-0000-4000-8000-000000000005": {
      name: "Sync_GUID+Спецификация колонн",
      favoriteFound: true,
      fromDefaultElem: false,
      missingWrite: [],
      destinationFlag: {
        checked: true, value: true, status: "NotEvaluated",
        origin: "FavoriteValue", sourceName: "Спец. колонна"
      }
    }
  };

  // Мок одного элемента: три состояния подряд — флаг включён, флаг выключен,
  // непрочитанное свойство, — чтобы в макете были видны все варианты строки.
  function mockSpecElement(index) {
    var variant = index % 3;
    return {
      guid: "3F2A9C1B-0000-4000-8000-" + String(1000 + index),
      checkedElement: true,
      elementFlag: variant === 0
        ? { checked: true, value: true, status: "HasValue", origin: "ElementValue" }
        : (variant === 1
          ? { checked: true, value: false, status: "HasValue", origin: "ElementValue" }
          : { checked: false, value: false, status: "NotAvailable", origin: "ElementValue" }),
      missingRead: variant === 2 ? ["Объём"] : []
    };
  }

  return {
    getSelectionInfo: getSelectionInfo,
    getClassification: getClassification,
    setClassificationForSelection: setClassificationForSelection,
    getFilterPresets: getFilterPresets,
    getPropertiesList: getPropertiesList,
    getPropertyValue: getPropertyValue,
    highlightElements: highlightElements,
    resetPropertyToDefault: resetPropertyToDefault,
    getNumberingProperties: getNumberingProperties,
    getNumberingPreview: getNumberingPreview,
    executeSyncScript: executeSyncScript,
        getSpecRuleProperties: getSpecRuleProperties,
        checkSpecRuleByPropertyGuid: checkSpecRuleByPropertyGuid
  };
})();

// Компактный конструктор DOM-элементов с инлайн-стилями.
// opts: { style, text, html, attrs:{}, on:{event:handler} }
function h(tag, opts, children) {
  opts = opts || {};
  const e = document.createElement(tag);
  e.style.boxSizing = "border-box"; // единая политика box-sizing без CSS-блоков
  if (opts.style) e.style.cssText += opts.style;
  if (opts.text !== undefined) e.textContent = opts.text;
  if (opts.html !== undefined) e.innerHTML = opts.html;
  if (opts.attrs) for (const k in opts.attrs) e.setAttribute(k, opts.attrs[k]);
  if (opts.on) for (const k in opts.on) e.addEventListener(k, opts.on[k]);
  // Ревью #179 п.7: hover одним параметром вместо пар mouseenter/mouseleave
  // (и без ловушки e.target на вложенных span — сюда всегда приходит сам элемент).
  // Меняем ТОЛЬКО свойства, перечисленные в hoverStyle: прежняя реализация
  // перезаписывала весь cssText сохранённым на момент создания значением и стирала
  // стили, добавленные после создания (отступы строк дерева классификации,
  // подсветка выбранного свойства) — строки «прыгали» при движении курсора (#183).
  if (opts.hoverStyle) {
    const savedHover = {};
    e.addEventListener("mouseenter", function () {
      opts.hoverStyle.split (";").forEach (function (declaration) {
        const separator = declaration.indexOf (":");
        if (separator <= 0) return;
        const property = declaration.slice (0, separator).trim ();
        if (!property) return;
        if (!(property in savedHover)) savedHover[property] = e.style.getPropertyValue (property);
        e.style.setProperty (property, declaration.slice (separator + 1).trim ());
      });
    });
    e.addEventListener ("mouseleave", function () {
      for (const property in savedHover) {
        e.style.setProperty (property, savedHover[property]);
        delete savedHover[property];
      }
    });
  }
  // Ревью #179 п.1: клавиатурная доступность кликабельных div'ов.
  if (opts.focusable) {
    e.setAttribute("tabindex", "0");
    e.addEventListener("focus", function () {
      e.style.outline = "2px solid var(--ac-accent)";
      e.style.outlineOffset = "-1px";
    });
    e.addEventListener("blur", function () { e.style.outline = ""; e.style.outlineOffset = ""; });
    e.addEventListener("keydown", function (ev) {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); e.click(); }
    });
  }
  (children || []).forEach(function (c) { if (c) e.appendChild(c); });
  return e;
}

function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

// Ревью #179 п.5/10/12: единая иконочная кнопка — один стиль для всех

   4. КАРКАС ИНТЕРФЕЙСА: левая навигация + переключение вкладок

const TABS = [
  { id: "monitor",   label: "Монитор" },
  { id: "sync",      label: "Синхронизация" },
  { id: "numbering", label: "Нумерация" },
  { id: "summary",   label: "Суммирование" },
  { id: "spec",      label: "Спецификация" }
];

function buildShell() {
  const app = document.getElementById("app");
  clear(app);

  // ---- Левая панель навигации ----
  // Ширина колонки вкладок от свёртывания не зависит: при сворачивании ужимается
  // само окно палитры (C++ SetPaletteCollapsed), а колонка вкладок остаётся как есть.
  const nav = h("nav", {
    attrs: { id: "left-nav" },
    style: "width:2.2rem;min-width:2.2rem;flex:0 0 2.2rem;display:flex;flex-direction:column;" +
           "background:var(--ac-bg-nav);border-right:1px solid var(--ac-border);height:100%;"
  });

  // Кнопка свёртывания/развёртывания навигации (над вкладками)
  const collapseBtn = h("button", {
    attrs: { id: "nav-collapse-btn", title: STATE.collapsed ? "Развернуть окно палитры" : "Свернуть окно палитры",
             "aria-label": STATE.collapsed ? "Развернуть окно палитры" : "Свернуть окно палитры" },
    style: "appearance:none;border:none;border-bottom:1px solid var(--ac-border);background:transparent;" +
           "cursor:pointer;width:100%;height:2.75rem;display:flex;align-items:center;justify-content:center;" +
           "color:var(--ac-text-secondary);font-size:0.9rem;transition:background var(--ac-transition);",
    hoverStyle: "background:var(--ac-bg-hover);",
    on: {
      click: function () { toggleNavCollapse(); }
    }
  }, [ h("span", { text: STATE.collapsed ? "\u25B6" : "\u25C0" }) ]);
  nav.appendChild(collapseBtn);

  TABS.forEach(function (tab) {
    const btn = h("button", {
      attrs: { "data-tab": tab.id, title: tab.label },
      style: "appearance:none;border:none;background:transparent;cursor:pointer;" +
             "flex:1 1 0;min-height:3.5rem;display:flex;align-items:center;justify-content:center;" +
             "padding:0.5rem 0;position:relative;color:var(--ac-text-secondary);" +
             "border-left:2px solid transparent;transition:background var(--ac-transition),color var(--ac-transition);",
      on: {
        click: function () { setActiveTab(tab.id); },
        mouseenter: function () {
          if (STATE.activeTab !== tab.id) btn.style.background = "var(--ac-bg-hover)";
        },
        mouseleave: function () { if (STATE.activeTab !== tab.id) btn.style.background = "transparent"; }
      }
    });

    // Названия вкладок остаются видимыми и в свёрнутом состоянии.
    btn.appendChild(h("span", {
      text: tab.label,
      style: "display:inline-block;white-space:nowrap;transform:rotate(-90deg);" +
             "transform-origin:center;font-size:0.72rem;letter-spacing:0.02em;font-weight:600;"
    }));

    btn.setAttribute("data-nav-btn", tab.id);
    nav.appendChild(btn);
  });

  if (!STATE.collapsed) {
    const themeBtn = h("button", {
      attrs: { id: "theme-toggle", title: "Переключить тему", "aria-label": "Переключить тему" },
      style: "appearance:none;border:none;border-top:1px solid var(--ac-border);background:transparent;" +
             "cursor:pointer;flex:0 0 2.2rem;display:flex;align-items:center;justify-content:center;" +
             "color:var(--ac-text-secondary);font-size:1rem;transition:background var(--ac-transition);",
      hoverStyle: "background:var(--ac-bg-hover);",
      on: {
        click: function () { applyTheme(STATE.theme === "light" ? "dark" : "light"); }
      }
    }, [ h("span", { attrs: { id: "theme-toggle-icon" }, text: "\u263D" }) ]);
    nav.appendChild(themeBtn);
  }

  // ---- Правая рабочая область ----
  // В свёрнутом состоянии окно палитры ужимается до колонки вкладок, поэтому
  // рабочую область убираем из потока целиком (иначе она распирает layout).
  const workspace = h("main", {
    attrs: { id: "workspace" },
    style: "flex:1 1 auto;min-width:0;height:100%;overflow:hidden;background:var(--ac-bg-workspace);" +
           "display:" + (STATE.collapsed ? "none" : "flex") + ";flex-direction:column;" +
           "color:var(--ac-text-primary);font-size:0.85rem;"
  });

  app.appendChild(nav);
  app.appendChild(workspace);

  highlightNav();
  // Скрытую рабочую область не рендерим — контент построится при развёртывании.
  if (!STATE.collapsed) renderActiveTab();
}

function highlightNav() {
  TABS.forEach(function (tab) {
    const btn = document.querySelector('[data-nav-btn="' + tab.id + '"]');
    if (!btn) return;
    const active = tab.id === STATE.activeTab;
    btn.style.background = active ? "var(--ac-bg-workspace)" : "transparent";
    btn.style.color = active ? "var(--ac-accent)" : "var(--ac-text-secondary)";
    btn.style.borderLeft = active ? "2px solid var(--ac-accent)" : "2px solid transparent";
  });
}

function toggleNavCollapse() {
  STATE.collapsed = !STATE.collapsed;
  buildShell();
  notifyPaletteCollapsed();
}

// Ширина вертикальной полосы прокрутки в CSS-пикселях. Измеряем временным
// элементом: в свёрнутой палитре скроллбар появляется только после ужимания,
// поэтому в развёрнутом состоянии его так просто не увидеть.
function measureScrollbarWidth() {
  const probe = document.createElement("div");
  probe.style.cssText = "position:absolute;top:-9999px;left:-9999px;width:100px;height:100px;overflow:scroll;";
  document.body.appendChild(probe);
  const width = probe.offsetWidth - probe.clientWidth;
  document.body.removeChild(probe);
  return width > 0 ? width : 0;
}

// Просит C++ ужать/восстановить ОКНО палитры. Доля считается по фактическим
// пикселям (не зависит от DPI и масштаба CEF): C++ умножает её на текущую ширину окна.
// Формат аргумента: "<0|1>|<промилле>".
function notifyPaletteCollapsed() {
  try {
    if (typeof window.ACAPI === "undefined" || !window.ACAPI.SetPaletteCollapsed) return;
    if (!STATE.collapsed) {
      window.ACAPI.SetPaletteCollapsed("0|0");
      return;
    }
    const nav = document.getElementById("left-nav");
    const viewportWidth = document.documentElement.clientWidth || 1;
    // В свёрнутом виде колонка вкладок выше окна, поэтому появляется вертикальный
    // скроллбар и съедает часть подписей — закладываем его ширину в запрос.
    const navWidth = (nav ? nav.offsetWidth : 36) + measureScrollbarWidth();
    const perMille = Math.max(1, Math.min(999, Math.round(navWidth * 1000 / viewportWidth)));
    window.ACAPI.SetPaletteCollapsed("1|" + perMille);
  } catch (e) {
    // Мост недоступен (предпросмотр HTML вне Archicad) — остаёмся в HTML-виде
  }
}

function setActiveTab(id) {
  STATE.activeTab = id;
  highlightNav();
  renderActiveTab();
}

function renderActiveTab() {
  const workspace = document.getElementById("workspace");
  clear(workspace);
  switch (STATE.activeTab) {
    case "monitor":   renderMonitorTab(workspace); break;
    case "sync":      renderSyncTab(workspace); break;
    case "numbering": renderNumberingTab(workspace); break;
    case "summary":   renderPlaceholderTab(workspace); break;
    case "spec":      renderSpecTab(workspace); break;
  }
}

function renderPlaceholderTab(container) {

// Глобальная функция обновления количества выделенных элементов
// Вызывается из C++ через ExecuteJS при изменении выделения
function refreshSelectionInfoText(count) {
  var textEl = document.getElementById("selection-info-text");
  if (textEl) textEl.textContent = "Выделено элементов: " + count;
  if (count === 0) {
    // При пустом выделении C++ не вызывает renderPropertyList: сбрасываем список здесь.
    const listBlock = document.getElementById("monitor-list-block");
    if (listBlock) {
      listBlock.monitorRequestId = (listBlock.monitorRequestId || 0) + 1;
      listBlock.monitorGroups = [];
      renderLoadedPropertyList(listBlock, []);
    }
  }
}

// Функция для ручного обновления (по клику на кнопку ↻)
// Теперь просто вызывает C++ функцию, которая сама обновит UI через ExecuteJS
// Переключение режима автообновления
function toggleAutoRefresh() {
  STATE.autoRefresh = !STATE.autoRefresh;
  var btn = document.getElementById("auto-refresh-toggle");
  if (btn) {
    if (STATE.autoRefresh) {
      btn.style.opacity = "1";
      btn.style.background = "var(--ac-accent)";
      btn.style.color = "var(--ac-accent-contrast)";
    } else {
      btn.style.opacity = "0.5";
      btn.style.background = "var(--ac-bg-input)";
      btn.style.color = "var(--ac-text-tertiary)";
    }
  }
  // Сообщаем C++ о смене флага.
  // Вызов БЕЗ аргументов: передача аргументов в JSFunction через
  // RegisterAsynchJSObject роняет CEF-мост (краш ArchiCAD)
  var catchSetter = STATE.autoRefresh ? "EnableCatchSelectionChanges" : "DisableCatchSelectionChanges";
  if (typeof window.ACAPI !== 'undefined' && window.ACAPI[catchSetter]) {
    window.ACAPI[catchSetter]();
  }
  // При включении сразу обновляем интерфейс
  if (STATE.autoRefresh && typeof window.ACAPI !== 'undefined' && window.ACAPI.RefreshSelectionInfoUI) {
    window.ACAPI.RefreshSelectionInfoUI();
  }
}

function refreshSelectionInfo() {
  if (typeof window.ACAPI !== 'undefined' && window.ACAPI.RefreshSelectionInfoUI) {
    // Вызываем C++ функцию — она сама обновит UI через ExecuteJS
    window.ACAPI.RefreshSelectionInfoUI();
  } else {
    var textEl = document.getElementById("selection-info-text");
    if (textEl) textEl.textContent = "Выделено элементов: ERROR: bridge not ready";
  }
}

// ---------------------------------------------------------------------------
// Древовидный выбор классификации (как в Archicad): узлы разворачиваются,
// при поиске по названию набор видимых вариантов пересчитывается по мере набора.
// ---------------------------------------------------------------------------

// Убирает дубликаты из списка полных имён. C++ может вернуть каждый класс дважды:
// один и тот же словарь системы кладётся в кэш и под systemname, и под systemname_full.
function uniqueClassificationOptions(options) {
  const seen = new Set();
  const out = [];
  (options || []).forEach(function (o) {
    if (!o || seen.has(o)) return;
    seen.add(o);
    out.push(o);
  });
  return out;
}

// Строит дерево из плоского списка полных имён (сегменты пути разделены "/").
// Узел: { label, fullPath, value, children }. value === полное имя, если узел
// является реальной выбираемой классификацией (листом в исходном списке).
function buildClassificationTree(fullPaths) {
  const tree = [];
  const map = new Map();
  fullPaths.forEach(function (path) {
    const parts = path.split("/");
    let prefix = "";
    let list = tree;
    for (let i = 0; i < parts.length; i++) {
      prefix = prefix ? prefix + "/" + parts[i] : parts[i];
      let node = map.get(prefix);
      if (!node) {
        node = { label: parts[i], fullPath: prefix, value: undefined, children: [] };
        map.set(prefix, node);
        list.push(node);
      }
      if (i === parts.length - 1) {
        node.value = path; // это полное имя — выбираемая классификация
      }
      list = node.children;
    }
  });
  return tree;
}

// Фильтрует дерево по запросу q (поиск по названию / пути, регистронезависимый).
// При совпадении самого узла оставляем его целиком; иначе — цепочку к совпавшим потомкам.
function filterClassificationTree(nodes, q) {
  const ql = q.toLowerCase();
  const result = [];
  nodes.forEach(function (n) {
    const matchSelf = n.fullPath.toLowerCase().indexOf(ql) !== -1;
    let sub = null;
    if (n.children && n.children.length) {
      sub = filterClassificationTree(n.children, q);
    }
    if (matchSelf || (sub && sub.length)) {
      result.push({
        label: n.label,
        fullPath: n.fullPath,
        value: n.value,
        children: matchSelf ? n.children : (sub || [])
      });
    }
  });
  return result;
}

// Рендерит узлы дерева в listEl. opts: { expanded:Set, forceExpand:bool, selected:string,
// onSelect:function(node), onToggle:function(), depth:number }.
// Ветвь раскрывается/сворачивается кликом по «+» (arrow), клик по строке выбирает
// узел-классификацию (#183). При поиске (forceExpand) дерево раскрыто целиком.
function renderClassificationTree(listEl, nodes, opts) {
  const depth = opts.depth || 0;
  nodes.forEach(function (n) {
    const isGroup = !!(n.children && n.children.length);
    const selectable = n.value !== undefined;
    const isExpanded = opts.forceExpand || opts.expanded.has(n.fullPath);
    const isSelected = n.value === opts.selected;

    const row = h("div", {
      attrs: { role: selectable && !isGroup ? "option" : "button", "aria-selected": isSelected ? "true" : "false" },
      focusable: true,
      style: "display:flex;align-items:center;gap:0.3rem;border-radius:0.2rem;font-size:0.74rem;" +
             "cursor:pointer;color:var(--ac-text-primary);" +
             (isSelected ? "background:var(--ac-accent-soft);" : ""),
      hoverStyle: isSelected ? "background:var(--ac-accent-soft);" : "background:var(--ac-bg-hover);"
    });
    row.style.padding = "0.22rem 0.4rem";
    row.style.paddingLeft = (0.4 + depth * 1.1) + "rem";

    const arrow = h("span", {
      html: isGroup ? chevronSvg(isExpanded) : "·",
      style: "flex:0 0 0.9rem;text-align:center;color:var(--ac-text-tertiary);font-size:0.7rem;display:flex;align-items:center;justify-content:center;user-select:none;" +
             (isGroup ? "cursor:pointer;" : "")
    });
    // #183: ветвь раскрывается ТОЛЬКО кликом по «+» (стрелке), не кликом по подписи
    // строки. Узел-ветвь не является классификацией, поэтому подпись ветви не выбирает.
    function toggleBranch() {
      if (opts.forceExpand) return; // при поиске дерево раскрыто принудительно
      if (opts.expanded.has(n.fullPath)) {
        opts.expanded.delete(n.fullPath);
      } else {
        opts.expanded.add(n.fullPath);
      }
      if (opts.onToggle) opts.onToggle(); // перерисовываем список целиком (с очисткой)
    }
    if (isGroup) {
      arrow.setAttribute("role", "button");
      arrow.setAttribute("tabindex", "0");
      arrow.setAttribute("title", isExpanded ? "Свернуть ветвь" : "Раскрыть ветвь");
      arrow.addEventListener("click", function (e) {
        e.stopPropagation();
        toggleBranch();
      });
      arrow.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") {
          ev.preventDefault();
          toggleBranch();
        }
      });
    }
    row.appendChild(arrow);

    const label = h("span", {
      text: n.label,
      style: "flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" +
             "color:" + (selectable ? "var(--ac-text-primary)" : "var(--ac-text-secondary)") + ";"
    });
    row.appendChild(label);

    row.addEventListener("click", function (e) {
      e.stopPropagation();
      // #183: раскрытие/сворачивание ветви — только кликом по «+» (см. обработчик
      // arrow выше). Клик по строке выбирает узел, если он сам является
      // классификацией (у листа и у промежуточного узла value задан).
      if (selectable) opts.onSelect(n);
    });

    listEl.appendChild(row);

    if (isGroup && isExpanded) {
      renderClassificationTree(listEl, n.children, {
        expanded: opts.expanded,
        forceExpand: opts.forceExpand,
        selected: opts.selected,
        onSelect: opts.onSelect,
        onToggle: opts.onToggle,
        depth: depth + 1
      });
    }
  });
}

// Собирает виджет выбора: триггер + выпадающая панель (поиск + дерево).
// container — узел, в который добавляется виджет (position:relative);
// tree — готовое дерево; initialValue — текущая классификация (или "");
// onChange — вызывается при смене выбора.
function buildClassificationPicker(container, tree, initialValue, onChange) {
  const expanded = new Set();
  let selected = typeof initialValue === "string" && initialValue ? initialValue : null;
  let query = "";

  const wrapper = h("div", {
    style: "position:relative;flex:1 1 10rem;min-width:8rem;display:flex;flex-direction:column;"
  });

  const triggerText = h("span", {
    text: selected || "— выберите классификацию —",
    style: "flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" +
           "color:" + (selected ? "var(--ac-text-primary)" : "var(--ac-text-tertiary)") + ";"
  });

  const trigger = h("div", {
    attrs: { role: "button", "aria-haspopup": "listbox" },
    focusable: true,
    style: "display:flex;align-items:center;gap:0.4rem;padding:0.3rem 0.4rem;font-size:0.75rem;" +
           "background:var(--ac-bg-input);color:var(--ac-text-primary);border:1px solid var(--ac-border);" +
           "border-radius:0.25rem;cursor:pointer;",
    on: {
      click: function (e) {
        e.stopPropagation();
        togglePanel();
      }
    }
  }, [
    triggerText,
    h("span", { html: chevronSvg(true), style: "color:var(--ac-text-tertiary);display:flex;" })
  ]);

  const search = h("input", {
    attrs: { type: "text", placeholder: "Поиск классификации…" },
    style: "display:block;width:100%;padding:0.35rem 0.5rem;font-size:0.75rem;" +
           "background:var(--ac-bg-input);color:var(--ac-text-primary);border:none;" +
           "border-bottom:1px solid var(--ac-divider);",
    on: {
      input: function () {
        query = search.value.trim();
        renderList();
      },
      click: function (e) { e.stopPropagation(); }
    }
  });

  const list = h("div", { style: "max-height:11rem;overflow:auto;" });

  const panel = h("div", {
    style: "position:absolute;top:100%;left:0;right:0;z-index:20;margin-top:0.15rem;display:none;" +
           "background:var(--ac-bg-elevated);border:1px solid var(--ac-border);border-radius:0.3rem;" +
           "box-shadow:0 4px 12px var(--ac-shadow-color);overflow:hidden;"
  }, [search, list]);

  wrapper.appendChild(trigger);
  wrapper.appendChild(panel);
  container.appendChild(wrapper);

  function renderList() {
    clear(list);
    renderClassificationTree(list, query ? filterClassificationTree(tree, query) : tree, {
      expanded: expanded,
      forceExpand: query.length > 0,
      selected: selected,
      onSelect: function (n) { choose(n); },
      onToggle: function () { renderList(); },
      depth: 0
    });
    if (!list.childNodes.length) {
      list.appendChild(h("div", {
        text: "Ничего не найдено",
        style: "padding:0.4rem 0.6rem;font-size:0.72rem;color:var(--ac-text-tertiary);"
      }));
    }
  }

  function choose(n) {
    selected = n.value;
    triggerText.textContent = n.value;
    triggerText.style.color = "var(--ac-text-primary)";
    panel.style.display = "none";
    setScrollFrameExpanded(false);
    if (onChange) onChange(selected);
  }

  // #182: панель выбора позиционируется абсолютно ВНУТРИ блока классификации, а блок
  // имеет max-height:40% + overflow:auto — панель обрезалась границей скролл-фрейма
  // (замер: видно 29 px из 74). На время раскрытия снимаем ограничение высоты и
  // обрезку, при закрытии возвращаем исходные значения из inline-стиля блока.
  // ВАЖНО: виджет собирается до вставки в блок (buildClassificationPicker вызывается
  // раньше block.appendChild(applyRow)), поэтому предка ищем в момент клика, а не при
  // сборке — иначе closest() вернёт null и правка молча не сработает.
  let savedFrameOverflow = null;
  let savedFrameMaxHeight = null;

  function setScrollFrameExpanded(expanded) {
    const frame = wrapper.closest ? wrapper.closest("#monitor-classification-block") : null;
    if (!frame) return;
    if (expanded === true) {
      if (savedFrameOverflow === null) {
        savedFrameOverflow = frame.style.overflow || "";
        savedFrameMaxHeight = frame.style.maxHeight || "";
      }
      frame.style.overflow = "visible";
      frame.style.maxHeight = "none";
    } else {
      frame.style.overflow = savedFrameOverflow === null ? "" : savedFrameOverflow;
      frame.style.maxHeight = savedFrameMaxHeight === null ? "" : savedFrameMaxHeight;
    }
  }

  function togglePanel() {
    const willOpen = panel.style.display === "none";
    if (willOpen) {
      query = "";
      if (search.value) search.value = "";
      renderList();
    }
    panel.style.display = willOpen ? "block" : "none";
    setScrollFrameExpanded(willOpen);
  }

  return {
    triggerTextEl: triggerText,
    getValue: function () { return selected; }
  };
}

function renderClassificationBlock(block) {
  clear(block);
  block.appendChild(h("div", { text: "Загрузка классификации…", style: "color:var(--ac-text-tertiary);font-size:0.75rem;" }));

  ACBridge.getClassification().then(function (data) {
    clear(block);

    block.appendChild(h("div", {
      text: "Классификация",
      style: "font-size:0.7rem;text-transform:uppercase;letter-spacing:0.04em;" +
             "color:var(--ac-text-tertiary);font-weight:700;margin-bottom:0.35rem;"
    }));

    // Общий (совпадающий у всех) путь классификации — стрелка-разделитель
    if (data.commonPath && data.commonPath.length) {
      const commonSegs = data.commonPath.join("/").split("/");
      const pathRow = h("div", {
        style: "display:flex;align-items:center;gap:0.25rem;flex-wrap:wrap;font-size:0.76rem;" +
               "color:var(--ac-text-primary);margin-bottom:0.3rem;"
      });
      commonSegs.forEach(function (seg, i) {
        if (i > 0) {
          pathRow.appendChild(h("span", { text: "›", style: "color:var(--ac-text-tertiary);" }));
        }
        pathRow.appendChild(h("span", { text: seg }));
      });
      block.appendChild(pathRow);
    }

    // Состояние "РАЗНАЯ" — видимо только когда классификации различаются
    if (!data.common) {
      const diffRow = h("div", {
        style: "margin-top:0.4rem;padding:0.35rem 0.5rem;background:var(--ac-warn-soft);" +
               "border-radius:0.25rem;display:flex;align-items:center;gap:0.4rem;"
      }, [
        h("span", { text: "РАЗНАЯ", style: "color:var(--ac-warn);font-weight:700;font-size:0.72rem;letter-spacing:0.03em;" }),
        h("span", { text: "(" + data.differing.length + " вариантов)", style: "color:var(--ac-text-secondary);font-size:0.7rem;" })
      ]);
      block.appendChild(diffRow);

      const diffList = h("div", {
        style: "margin-top:0.3rem;display:flex;flex-direction:column;gap:0.15rem;padding-left:0.9rem;"
      });
      data.differing.forEach(function (d) {
        var val = d.classification || "";
        var cnt = d.count || 0;
        diffList.appendChild(h("div", { style: "font-size:0.72rem;color:var(--ac-text-secondary);" }, [
          h("span", { text: val, style: "color:var(--ac-text-primary);font-weight:600;" }),
          h("span", { text: "  —  " + cnt + " элем. из " + (d.total || 0) })
        ]));
      });
      block.appendChild(diffList);
    }

    // Выбор классификации и «Применить ко всем» — показываем всегда (в т.ч. при
    // единой классификации / одном выделенном элементе).
    const options = uniqueClassificationOptions(data.options);
    const tree = buildClassificationTree(options);
    const initial = data.common ? data.commonPath.join("/") : "";

    const applyRow = h("div", {
      style: "margin-top:0.5rem;display:flex;gap:0.4rem;flex-wrap:wrap;align-items:flex-start;"
    });

    let picker = null;
    const applyHint = h("span", {
      text: "",
      style: "font-size:0.7rem;color:var(--ac-text-tertiary);align-self:center;flex:1 1 auto;"
    });
    const applyBtn = h("button", {
      text: "Применить ко всем",
      style: "padding:0.3rem 0.6rem;font-size:0.75rem;border:none;border-radius:0.25rem;cursor:pointer;" +
             "background:var(--ac-accent);color:var(--ac-accent-contrast);font-weight:600;" +
             "transition:opacity var(--ac-transition);",
      on: {
        click: function () {
          const value = picker ? picker.getValue() : null;
          if (!value) return;
          applyBtn.disabled = true;
          applyBtn.textContent = "Применение…";
          ACBridge.setClassificationForSelection(value).then(function () {
            renderClassificationBlock(block); // перерисовать (в реале — уже единая классификация)
          });
        }
      }
    });
    // Ревью #179 п.3: кнопка неактивна только пока не выбрана классификация —
    // и это объясняется подсказкой, а не молчаливым disabled.
    function syncApplyState() {
      const has = !!(picker && picker.getValue());
      applyBtn.disabled = !has;
      applyBtn.style.opacity = has ? "1" : "0.45";
      applyBtn.style.cursor = has ? "pointer" : "not-allowed";
      applyHint.textContent = has ? "" : "Выберите классификацию из списка";
    }

    picker = buildClassificationPicker(applyRow, tree, initial, function () {
      syncApplyState();
    });
    syncApplyState();

    if (!options.length) {
      // Нет доступных классификаций — выводим пояснение вместо пустого дерева
      const note = h("div", {
        text: "Нет доступных классификаций",
        style: "margin-top:0.25rem;font-size:0.7rem;color:var(--ac-text-tertiary);"
      });
      applyRow.appendChild(applyBtn);
      applyRow.appendChild(applyHint);
      block.appendChild(applyRow);
      block.appendChild(note);
    } else {
      applyRow.appendChild(applyBtn);
      applyRow.appendChild(applyHint);
      block.appendChild(applyRow);
    }
  });
}

function renderFilterBlock(block, listBlock) {

    html: chevronSvg(true),
    title: "Преднастроенные фильтры по имени"
  });

  // Preset button for value filter
  const valuePresetBtn = iconButton({
    html: chevronSvg(true),
    title: "Преднастроенные фильтры по значению"

           "background:var(--ac-bg-input);color:var(--ac-text-primary);border:1px solid var(--ac-border);border-radius:0.25rem;",
    on: {
      input: function () {
        STATE.monitorFilter = input.value;
        renderPropertyList(listBlock, STATE.monitorFilter, true);
      }

  nameFilterRow.appendChild(input);
  nameFilterRow.appendChild(presetBtn);

  const valueInput = h("input", {
    attrs: { type: "text", placeholder: "Фильтр по значениям… (или /regex/)", value: STATE.monitorValueFilter },
    style: "flex:1 1 auto;min-width:0;padding:0.35rem 0.5rem;font-size:0.78rem;" +
           "background:var(--ac-bg-input);color:var(--ac-text-primary);border:1px solid var(--ac-border);border-radius:0.25rem;",
    on: {
      input: function () {
        STATE.monitorValueFilter = valueInput.value;
        renderPropertyList(listBlock, STATE.monitorFilter, true);
      }
    }
  });
  valueFilterRow.appendChild(valueInput);
  valueFilterRow.appendChild(valuePresetBtn);

  const dropdown = h("div", { style: DROPDOWN_STYLE });

  const valueDropdown = h("div", { style: DROPDOWN_STYLE });

  presetBtn.addEventListener("click", function () {
    const willOpen = dropdown.style.display === "none";
    dropdown.style.display = willOpen ? "block" : "none";
    valueDropdown.style.display = "none";
    if (willOpen) {
      // Перестраиваем при каждом открытии: пункт «Только с правилами» —
      // переключатель, его активное состояние должно быть актуальным (#180).
      clear(dropdown);
      ACBridge.getFilterPresets().then(function (presets) {
        presets.forEach(function (p) {
          dropdown.appendChild(h("div", {
            text: p.label,
            attrs: { role: "button" },
            focusable: true,
            style: "padding:0.4rem 0.6rem;font-size:0.76rem;cursor:pointer;color:var(--ac-text-primary);",
            hoverStyle: "background:var(--ac-bg-hover);",

              click: function () {
                input.value = p.query;
                STATE.monitorFilter = p.query;
                dropdown.style.display = "none";
                renderPropertyList(listBlock, STATE.monitorFilter, true);
              }
            }
          }));
        });
        // #180: режим «только с правилами» — пункт-переключатель вместо чекбокса.
        const rulesActive = STATE.monitorRulesOnly === true;
        dropdown.appendChild(h("div", {
          text: (rulesActive ? "\u2713 " : "") + "Только с правилами Sync/Spec",
          attrs: { role: "button" },
          focusable: true,
          style: "padding:0.4rem 0.6rem;font-size:0.76rem;cursor:pointer;color:" +
                 (rulesActive ? "var(--ac-accent)" : "var(--ac-text-primary)") + ";" +
                 (rulesActive ? "font-weight:700;" : ""),
          hoverStyle: "background:var(--ac-bg-hover);",
          on: {
            click: function () {
              STATE.monitorRulesOnly = !STATE.monitorRulesOnly;
              dropdown.style.display = "none";
              renderPropertyList(listBlock, STATE.monitorFilter, true);
            }
          }
        }));
      });
    }
  });

  valuePresetBtn.addEventListener("click", function () {
    const willOpen = valueDropdown.style.display === "none";
    valueDropdown.style.display = willOpen ? "block" : "none";
    dropdown.style.display = "none";
    if (willOpen && !valueDropdown.childNodes.length) {
      ACBridge.getFilterPresets().then(function (presets) {
        presets.forEach(function (p) {
          valueDropdown.appendChild(h("div", {
            text: p.label,
            attrs: { role: "button" },
            focusable: true,
            style: "padding:0.4rem 0.6rem;font-size:0.76rem;cursor:pointer;color:var(--ac-text-primary);",
            hoverStyle: "background:var(--ac-bg-hover);",
            on: {
              click: function () {
                valueInput.value = p.query;
                STATE.monitorValueFilter = p.query;
                valueDropdown.style.display = "none";
                renderPropertyList(listBlock, STATE.monitorFilter, true);
              }
            }

        });
      });
    }
  });

  block.appendChild(nameFilterRow);
  block.appendChild(valueFilterRow);
  // #180: чекбокс «Только с правилами Sync/Spec» заменён пунктом-переключателем
  // в списке пресетов фильтра по имени (см. обработчик presetBtn выше).
  block.appendChild(h("div", {
    text: "Поддерживаются шаблоны regexp в формате /шаблон/",
    style: "margin-top:0.25rem;font-size:0.7rem;color:var(--ac-text-tertiary);"
  }));
  block.appendChild(dropdown);
  block.appendChild(valueDropdown);
}

function renderPropertyList(listBlock, filterText, localOnly) {
  if (!listBlock) return;
  if (localOnly === true) {
    if (listBlock.monitorGroups) renderLoadedPropertyList(listBlock, listBlock.monitorGroups);
    return;
  }
  // Новый запрос инвалидирует старые данные и запоздавшие ответы моста.
  const requestId = (listBlock.monitorRequestId || 0) + 1;
  listBlock.monitorRequestId = requestId;
  listBlock.monitorGroups = null;
  clear(listBlock);
  listBlock.appendChild(h("div", { text: "Загрузка свойств…", style: "padding:0.6rem 0.75rem;color:var(--ac-text-tertiary);font-size:0.75rem;" }));

  ACBridge.getPropertiesList('').then(function (groups) {
    if (listBlock.monitorRequestId !== requestId) return;
    listBlock.monitorGroups = groups;
    renderLoadedPropertyList(listBlock, groups);
  });
}

function renderLoadedPropertyList(listBlock, loadedGroups) {
  const nameFilter = STATE.monitorFilter;
  const valueFilter = STATE.monitorValueFilter;
  // Фильтры заменяют массивы свойств; исходный полный список не изменяем.
  let groups = loadedGroups.map(function (g) {
    return { group: g.group, properties: g.properties.filter(function (p) {
      return !STATE.monitorRulesOnly || p.hasRule === true;
    }) };
  }).filter(function (g) { return g.properties.length > 0; });
          clear(listBlock);
          if (!groups.length) {
            listBlock.appendChild(h("div", { text: "Ничего не найдено по фильтру.", style: "padding:0.6rem 0.75rem;color:var(--ac-text-tertiary);font-size:0.75rem;" }));
            return;
          }
          // Render groups directly (already grouped by getPropertiesList)
          // Apply name filter if provided
          if (nameFilter) {
            const nameFilterRegex = nameFilter.startsWith('/') && nameFilter.endsWith('/')
              ? new RegExp(nameFilter.slice(1, -1), 'i')
              : new RegExp(nameFilter.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i');

            groups.forEach(function(g) {
              g.properties = g.properties.filter(function(p) {
                return nameFilterRegex.test(p.name);
              });
            });

            // Remove empty groups
            groups = groups.filter(function(g) { return g.properties && g.properties.length > 0; });
          }
          // Apply value filter if provided
          if (valueFilter) {
            const valueFilterRegex = valueFilter.startsWith('/') && valueFilter.endsWith('/')
              ? new RegExp(valueFilter.slice(1, -1), 'i')
              : new RegExp(valueFilter.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i');

            groups.forEach(function(g) {
              g.properties = g.properties.filter(function(p) {
                return p.values && p.values.some(function(v) { return valueFilterRegex.test(v.value); });
              });
            });

            // Remove empty groups
            groups = groups.filter(function(g) { return g.properties && g.properties.length > 0; });
          }

          // #160/#204: закреплённые свойства и группы выводятся наверху списка.
          // Фильтры применены выше; ни свойства, ни группы при перестановке не дублируются.
          const isPinnedPropertyGroup = function (g) {
            return STATE.pinnedPropertyGroups.indexOf(g.group) !== -1;
          };
          const pinnedGroups = groups.filter(isPinnedPropertyGroup);
          groups = groups.filter(function (g) { return !isPinnedPropertyGroup(g); });

          let pinnedPropertiesGroup = null;
          if (STATE.pinnedProperties.length) {
            const isPinnedProperty = function (p) { return STATE.pinnedProperties.indexOf(p.id) !== -1; };
            let pinnedProps = [];
            groups.forEach(function (g) {
              const pinnedInGroup = g.properties.filter(isPinnedProperty);
              if (pinnedInGroup.length) {
                pinnedProps = pinnedProps.concat(pinnedInGroup);
                g.properties = g.properties.filter(function (p) { return !isPinnedProperty(p); });
              }
            });
            groups = groups.filter(function (g) { return g.properties.length > 0; });
            if (pinnedProps.length) pinnedPropertiesGroup = { group: "Закреплённые", properties: pinnedProps };
          }

          groups = (pinnedPropertiesGroup ? [pinnedPropertiesGroup] : []).concat(pinnedGroups, groups);

          groups.forEach(function (g) {
      const groupName = g.group;
      const isCollapsed = !!STATE.monitorGroupCollapse[groupName];
      
      // Group header (clickable); закреплённые блоки выделяются акцентом.
      const isPinnedPropertiesGroup = groupName === "Закреплённые";
      const isPinnedGroup = STATE.pinnedPropertyGroups.indexOf(groupName) !== -1;
      const groupHeader = h("div", {
        text: groupName,
        attrs: { role: "button" },
        focusable: true,
        style: "position:sticky;top:0;background:var(--ac-bg-workspace);padding:0.4rem 0.75rem 0.2rem;" +
               "font-size:0.7rem;text-transform:uppercase;letter-spacing:0.04em;color:" +
               ((isPinnedPropertiesGroup || isPinnedGroup) ? "var(--ac-accent)" : "var(--ac-text-tertiary)") + ";font-weight:700;" +
               "cursor:pointer;display:flex;align-items:center;gap:0.3rem;user-select:none;",
        on: {
          click: function() {
            STATE.monitorGroupCollapse[groupName] = !STATE.monitorGroupCollapse[groupName];
            // Re-render the property list
            renderPropertyList(listBlock, STATE.monitorFilter, true);
          }
        }
      });

      // Chevron-иконка (SVG, как в «Нумерации» — ревью #179 п.9)
      const chevron = h("span", {
        html: chevronSvg(!isCollapsed),
        style: "display:flex;align-items:center;color:var(--ac-text-tertiary);"
      });
      groupHeader.insertBefore(chevron, groupHeader.firstChild);

      if (!isPinnedPropertiesGroup) {
        const pinGroupBtn = iconButton({
          html: pinIconSvg(isPinnedGroup),
          title: isPinnedGroup ? "Открепить группу" : "Закрепить группу наверху списка",
          hoverColor: "var(--ac-accent)",
          onClick: function (e) {
            e.stopPropagation();
            togglePinnedPropertyGroup(groupName);
          }
        });
        pinGroupBtn.style.marginLeft = "auto";
        groupHeader.appendChild(pinGroupBtn);
      }
      
      listBlock.appendChild(groupHeader);

      // Render properties if not collapsed
      if (!isCollapsed) {
        g.properties.forEach(function (p) {
          listBlock.appendChild(renderPropertyRow(p));
        });
      }

      // #160: горизонтальная линия-разделитель под всем блоком закреплённых.
      if (isPinnedPropertiesGroup) {
        listBlock.appendChild(h("div", {
          style: "flex:0 0 auto;height:2px;background:var(--ac-accent);opacity:0.55;"
        }));
      }
    });
}

// #160: переключение закрепления свойства и перерисовка списка «Монитора».
function togglePinnedProperty(propId) {
  const idx = STATE.pinnedProperties.indexOf(propId);
  if (idx === -1) STATE.pinnedProperties.push(propId);
  else STATE.pinnedProperties.splice(idx, 1);
  const listBlock = document.getElementById("monitor-list-block");
  if (listBlock) renderPropertyList(listBlock, STATE.monitorFilter, true);
}

// #204: переключение закрепления группы и перерисовка списка «Монитора».
function togglePinnedPropertyGroup(groupName) {
  const idx = STATE.pinnedPropertyGroups.indexOf(groupName);
  if (idx === -1) STATE.pinnedPropertyGroups.push(groupName);
  else STATE.pinnedPropertyGroups.splice(idx, 1);
  const listBlock = document.getElementById("monitor-list-block");
  if (listBlock) renderPropertyList(listBlock, STATE.monitorFilter, true);
}

function renderPropertyRow(prop) {
  const isSelected = STATE.monitorSelectedPropertyId === prop.id;
  const isPinned = STATE.pinnedProperties.indexOf(prop.id) !== -1;

  const row = h("div", {
    attrs: { "data-prop-row": prop.id, role: "button", "aria-pressed": isSelected ? "true" : "false",
             "data-pinned": isPinned ? "true" : "false" },
    focusable: true,
    style: "display:flex;flex-direction:column;gap:0.15rem;padding:0.35rem 0.75rem;cursor:pointer;" +
           "border-left:2px solid " + (isSelected ? "var(--ac-accent)" : "transparent") + ";" +
           // #160: закреплённая строка — подложка акцентом; общая линия под всем
           // блоком закреплённых рисуется отдельным разделителем после группы.
           "background:" + (isSelected ? "var(--ac-bg-hover)"
                                       : (isPinned ? "var(--ac-accent-soft)" : "transparent")) + ";",
    hoverStyle: "background:" + (isPinned ? "var(--ac-accent-soft)" : "var(--ac-bg-hover)") + ";",
    on: {
      click: function () {
        STATE.monitorSelectedPropertyId = prop.id;
        document.querySelectorAll("[data-prop-row]").forEach(function (r) {
          const sel = r.getAttribute("data-prop-row") === prop.id;
          const pinned = r.getAttribute("data-pinned") === "true";
          r.style.background = sel ? "var(--ac-bg-hover)" : (pinned ? "var(--ac-accent-soft)" : "transparent");
          r.style.borderLeft = "2px solid " + (sel ? "var(--ac-accent)" : "transparent");
          r.setAttribute("aria-pressed", sel ? "true" : "false");
        });
      }
    }
  });

  // Main row content: name + count + pin button
  const headerRow = h("div", {
    style: "display:flex;align-items:center;gap:0.4rem;flex:1 1 auto;"
  });

  // #159: синим свойства с правилом SomeStuff (Sync/Spec/Renum/Sum) — договорённость
  // с заказчиком; allHave больше не красится тем же акцентом (ревью #179 п.4:
  // один цвет = один смысл), заполненность и так видна по счётчику N/M.
  const nameSpan = h("span", {
    text: prop.name,
    style: "flex:1 1 auto;min-width:0;font-size:0.78rem;" +
           "color:" + (prop.hasRule === true ? "var(--ac-accent)" : "var(--ac-text-primary)") + ";" +
           "overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"
  });
  headerRow.appendChild(nameSpan);

  if (!prop.allHave) {
    headerRow.appendChild(h("span", {
      text: "(" + prop.countWithProperty + "/" + MOCK_SELECTED_COUNT + ")",
      style: "flex:0 0 auto;font-size:0.7rem;color:var(--ac-text-tertiary);"
    }));
  }

  const pinBtn = iconButton({
    html: pinIconSvg(isPinned),
    title: isPinned ? "Открепить свойство" : "Закрепить свойство наверху списка",
    hoverColor: "var(--ac-accent)",
    onClick: function (e) {
      e.stopPropagation();
      togglePinnedProperty(prop.id);
    }
  });
  headerRow.appendChild(pinBtn);

  row.appendChild(headerRow);

  // Values display under the name (small font)
  if (prop.values && prop.values.length > 0) {
    prop.values.forEach(function (v) {
      const valueRow = h("div", {
        attrs: { role: "button" },
        focusable: true,
        style: "font-size:0.7rem;color:var(--ac-text-secondary);padding-left:0.5rem;display:flex;align-items:center;gap:0.3rem;" +
               "cursor:pointer;border-radius:0.2rem;",
        hoverStyle: "background:var(--ac-bg-hover);",
        title: "Подсветить и приблизить элементы с этим значением",
        on: {
          click: function (e) {
            e.stopPropagation();
            const guids = (prop.valueElementGuids && prop.valueElementGuids[v.value]) || [];
            if (guids.length > 0) {
              // Ревью #179 п.8: видимый отклик — успех (мягкий акцент) / неудача моста.
              ACBridge.highlightElements(guids).then(function (ok) {
                valueRow.style.background = ok ? "var(--ac-accent-soft)" : "var(--ac-warn-soft)";
                setTimeout(function () { valueRow.style.background = "transparent"; }, 600);
              });
            }
          }
        }
      });
      valueRow.appendChild(h("span", {
        text: v.value,
        style: "flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"
      }));
      valueRow.appendChild(h("span", {
        text: "×" + v.count,
        style: "flex:0 0 auto;color:var(--ac-text-tertiary);font-size:0.7rem;"
      }));
      row.appendChild(valueRow);
    });
  }

  return row;
}

function renderValueBlock(block, propertyId) {
  if (!block) return;
  block.setAttribute("data-role", "value-block");
  clear(block);

  if (!propertyId) {
    block.appendChild(h("div", {
      text: "Выберите свойство в списке выше, чтобы увидеть значение.",
      style: "color:var(--ac-text-tertiary);font-size:0.74rem;"
    }));
    return;
  }

  block.appendChild(h("div", { text: "Загрузка значения…", style: "color:var(--ac-text-tertiary);font-size:0.74rem;" }));

  ACBridge.getPropertyValue(propertyId).then(function (data) {
    clear(block);
    block.appendChild(h("div", {
      text: "Значение свойства",
      style: "font-size:0.7rem;text-transform:uppercase;letter-spacing:0.04em;color:var(--ac-text-tertiary);font-weight:700;margin-bottom:0.3rem;"
    }));

    if (data.common) {
      block.appendChild(h("div", { text: data.values[0].value, style: "font-size:0.85rem;color:var(--ac-text-primary);" }));
      return;
    }

    block.appendChild(h("span", { text: "РАЗНОЕ", style: "color:var(--ac-warn);font-weight:700;font-size:0.78rem;" }));
    const list = h("div", { style: "margin-top:0.3rem;display:flex;flex-direction:column;gap:0.15rem;" });
    data.values.forEach(function (v) {
      list.appendChild(h("div", { style: "font-size:0.75rem;color:var(--ac-text-primary);display:flex;justify-content:space-between;gap:0.5rem;" }, [
        h("span", { text: v.value }),
        h("span", { text: "×" + v.count, style: "color:var(--ac-text-tertiary);flex:0 0 auto;" })
      ]));
    });

  });
}

/* =====================================================================================
   6. ВКЛАДКА «СИНХРОНИЗАЦИЯ»
   ---------------------------------------------------------------------------------
   contenteditable-редактор с подсветкой синтаксиса DSL на лету через Vanilla JS
   (регулярные выражения оборачивают токены в <span style="color:...">).
   ===================================================================================== */

const SYNC_TOKEN_RE = /("(?:[^"\\]|\\.)*")|(<[^<>]*>)|(\(\s*\d+\s*,\s*[^)]+?\s*\))|\b(Sync_from|Sync_to|Sync_flag|Renum|Sum|Sync_reset)\b|\b(Property|Coord|Glob|IFC|Morph|Material|MEP|Class|File)(:)|\b(empty|trim_empty|def|uniq|sum|max|min|FullName)\b|([{};])/g;

function tokenizeSync(text) {
  let result = "";
  let lastIndex = 0;
  text.replace(SYNC_TOKEN_RE, function (match, str, expr, range, cmd, ns, nsColon, kw, brack, offset) {
    result += escapeHtml(text.slice(lastIndex, offset));
    if (str !== undefined) result += '<span style="color:var(--ac-code-string)">' + escapeHtml(str) + "</span>";
    else if (expr !== undefined) result += '<span style="color:var(--ac-code-expr)">' + escapeHtml(expr) + "</span>";
    else if (range !== undefined) result += '<span style="color:var(--ac-code-range)">' + escapeHtml(range) + "</span>";
    else if (cmd !== undefined) result += '<span style="color:var(--ac-code-command);font-weight:600">' + escapeHtml(cmd) + "</span>";
    else if (ns !== undefined) result += '<span style="color:var(--ac-code-namespace)">' + escapeHtml(ns + nsColon) + "</span>";
    else if (kw !== undefined) result += '<span style="color:var(--ac-code-keyword)">' + escapeHtml(kw) + "</span>";
    else if (brack !== undefined) result += '<span style="color:var(--ac-code-bracket)">' + escapeHtml(brack) + "</span>";
    lastIndex = offset + match.length;
    return match;
  });
  result += escapeHtml(text.slice(lastIndex));
  return result.length ? result : "<br>";
}

function getCaretOffset(root) {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return 0;
  const range = sel.getRangeAt(0);
  if (!root.contains(range.startContainer)) return 0;
  const preRange = range.cloneRange();
  preRange.selectNodeContents(root);
  preRange.setEnd(range.endContainer, range.endOffset);
  return preRange.toString().length;
}

function setCaretOffset(root, offset) {
  const sel = window.getSelection();
  const range = document.createRange();
  let remaining = offset;
  let target = null, targetOffset = 0;
  (function walk(el) {
    for (let i = 0; i < el.childNodes.length; i++) {
      if (target) return;
      const child = el.childNodes[i];
      if (child.nodeType === Node.TEXT_NODE) {
        if (remaining <= child.textContent.length) { target = child; targetOffset = remaining; return; }
        remaining -= child.textContent.length;
      } else {
        walk(child);
      }
    }
  })(root);
  if (!target) { target = root; targetOffset = root.childNodes.length; }
  range.setStart(target, targetOffset);
  range.collapse(true);
  sel.removeAllRanges();
  sel.addRange(range);
}

const SYNC_LEGEND = [
  { label: "Команды", varName: "--ac-code-command" },
  { label: "Пространства имён", varName: "--ac-code-namespace" },
  { label: "Ключевые слова", varName: "--ac-code-keyword" },
  { label: "Строки", varName: "--ac-code-string" },
  { label: "Выражения", varName: "--ac-code-expr" },
  { label: "Скобки / диапазоны", varName: "--ac-code-bracket" }
];

const SYNC_SNIPPETS = ["Sync_from", "Sync_to", "Sync_flag", "Renum", "Sum", "Sync_reset"];

const DEFAULT_SYNC_SCRIPT =
  'Sync_from{ Property:Тип; empty }\n' +
  'Sync_to{ Coord:X; trim_empty }\n' +
  'Renum{ Property:Этаж; Property:Секция }\n' +
  'Sum{ Property:Площадь; sum; (1, nrow) }';

function renderSyncTab(container) {
  const root = h("div", { style: "display:flex;flex-direction:column;height:100%;overflow:hidden;" });

  });

  const editor = h("div", {
    attrs: { contenteditable: "true", spellcheck: "false", "data-role": "sync-editor" },
    style: "outline:none;font-family:'Cascadia Code','Consolas',monospace;font-size:0.8rem;line-height:1.55;" +
           "white-space:pre-wrap;word-break:break-word;min-height:100%;color:var(--ac-text-primary);" +
           "background:var(--ac-code-bg);border:1px solid var(--ac-border);border-radius:0.3rem;padding:0.6rem 0.7rem;"
  });
  editor.textContent = DEFAULT_SYNC_SCRIPT;
  editor.innerHTML = tokenizeSync(editor.textContent);

  editor.addEventListener("input", function () {
    const offset = getCaretOffset(editor);
    const text = editor.textContent;
    editor.innerHTML = tokenizeSync(text);
    setCaretOffset(editor, offset);
  });

  SYNC_SNIPPETS.forEach(function (cmd) {
    toolbar.appendChild(h("button", {
      text: cmd,

             "background:var(--ac-bg-elevated);color:var(--ac-code-command);border:1px solid var(--ac-border);font-family:monospace;",
      on: {
        click: function () {
          editor.focus();
          const insertion = cmd + "{  }";
          editor.textContent = editor.textContent + (editor.textContent.endsWith("\n") || !editor.textContent ? "" : "\n") + insertion;
          editor.innerHTML = tokenizeSync(editor.textContent);
          setCaretOffset(editor, editor.textContent.length - 2);

  // Нижняя панель управления
  const footer = h("div", {

        ACBridge.executeSyncScript(editor.textContent).then(function (result) {
