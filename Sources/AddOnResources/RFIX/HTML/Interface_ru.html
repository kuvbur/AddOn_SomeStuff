/* =====================================================================================
   8. ВКЛАДКА «СПЕЦИФИКАЦИЯ»
   ---------------------------------------------------------------------------------
   Проверка правила спецификации по GUID свойства-правила — read-only, модель не
   меняется. Контракт повторяет Spec::RuleCheckResult (Spec.hpp) один в один, включая
   пять состояний флага (RuleFlagStatus) и пять источников значения (RuleFlagOrigin):
   сведение их к «включён/выключен» теряет причину отказа, ради которой проверка и
   сделана.
   ===================================================================================== */

// Значение лимита по умолчанию, когда разбор select не удался.
const SPEC_CHECK_LIMIT = 20;

// Состояния значения свойства-флага (Spec.hpp, RuleFlagStatus) — как есть, без сведения.
const SPEC_STATUS_LABEL = {
  Unknown:      "неизвестно",
  NotPresent:   "нет свойства",
  NotAvailable: "недоступно",
  NotEvaluated: "не вычислено",
  HasValue:     "значение получено"
};

// Откуда взято значение (Spec.hpp, RuleFlagOrigin) — как есть.
const SPEC_ORIGIN_LABEL = {
  NotChecked:       "не проверялось",
  ElementValue:     "",
  FavoriteValue:    "значение у избранного",
  DefaultElemValue: "значение у объекта по умолчанию",
  DefaultDefinition: "значение из определения"
};

// Тон строки по ответу: «значение получено» — обычный, остальные случаи называют
// причину, поэтому подсвечиваются. Возвращает ключ SPEC_TONE_COLOR.
function specStatusTone(status, checked) {
  if (checked === true) return "ok";
  if (status === "NotAvailable" || status === "NotEvaluated") return "warn";
  if (status === "NotPresent") return "bad";
  return "muted";
}

const SPEC_TONE_COLOR = {
  ok:    "var(--ac-accent)",
  warn:  "var(--ac-warn)",
  bad:   "var(--ac-danger)",
  muted: "var(--ac-text-secondary)"
};

function specToneText(tone) {
  return tone === "muted" ? "var(--ac-text-tertiary)" : SPEC_TONE_COLOR[tone];
}

// Расхождения и подсветки элемента — РАЗНЫЕ списки, и различие существенно:
// расхождение попадает в счётчик «проблемных», подсветка — нет.
// Правильным считается элемент, у которого флаг спецификации ВКЛЮЧЁН и при этом
// у назначения (избранного либо объекта по умолчанию) он НЕ включён.
// Отсутствие флага у назначения — норма, а не расхождение.
//
// errors: флаг не прочитан (это сбой проверки, а не свойство элемента),
//         либо прочитано выключенным и при этом назначение его тоже не держит.
//         Последнее — настоящее расхождение: правило к элементу не применится.
// notices: флаг выключен, но назначение его тоже выключило — вероятно сбой
//          элемента (сработало правило избранного), но это не ошибка.
//
// Флаг назначения (destinationFlag) лежит в общем блоке, а не в элементе,
// поэтому он передаётся параметром: иначе отличить этот случай от настоящего
// расхождения нельзя — у элемента своего доступа к назначению нет.
function specElementFindings(el, destFlag) {
  const errors = [];
  const notices = [];
  if (!el.checkedElement) {
    errors.push("проверка на элементе не выполнялась");
    return { errors: errors, notices: notices };
  }
  const flag = el.elementFlag || {};
  // Назначение активно и само держит флаг включённым: тогда элемент правильный,
  // что бы ни говорил его собственный флаг. Проверяем прочитанное значение,
  // а не только признак origin — отсюда важно и destFlag.checked.
  if (destFlag && destFlag.checked && destFlag.value) {
    return { errors: errors, notices: notices };
  }
  if (!flag.checked) {
    errors.push("значение флага не прочитано: " + (SPEC_STATUS_LABEL[flag.status] || flag.status || "неизвестно"));
    return { errors: errors, notices: notices };
  }
  if (!flag.value) {
    // Назначение держит флаг выключенным — элемент попадает в правильные.
    if (destFlag && destFlag.checked && !destFlag.value) {
      notices.push("флаг выключен — возможно, выключен случайно (назначение тоже его выключает)");
    } else {
      errors.push("флаг правила выключен и назначение его не включает — правило не применится к элементу");
    }
  }
  (el.missingRead || []).forEach(function (name) {
    errors.push("не прочитано свойство: " + name);
  });
  return { errors: errors, notices: notices };
}

// Общие по правилу проверки, одинаковые для всех элементов. Каждая строка —
// отдельный ответ RuleCheckResult; молча не пропускается ни один.
function specCommonRows(common) {
  const rows = [];
  rows.push({ label: "Свойство-правило", text: common.propertyName || "—", tone: common.definitionFound ? "ok" : "bad" });
  if (!common.definitionFound) {
    rows.push({ label: "Определение", text: "не найдено в проекте", tone: "bad" });
    return rows;
  }
  rows.push(common.ruleParsed
    ? { label: "Проверка правила", text: "без ошибок", tone: "ok" }
    : { label: "Проверка правила", text: common.parseErrorText || "ошибка разбора", tone: "bad" });

  // Флаг назначения в C++ — ОДНО значение с пометкой origin, а не две
    // независимые проверки (Spec.cpp:2627-2641): проверяется только то назначение,
    // которое реально используется — избранное, если оно найдено, иначе объект по
    // умолчанию. Поэтому обе строки показываются всегда, а неактивная помечена
    // «не проверялось»: выводить для неё значение значило бы выдумать проверку,
    // которой не было.
    const dest = common.destinationFlag || {};
  const destText = dest.checked
    ? (dest.value ? "включён" : "выключен")
    : (SPEC_STATUS_LABEL[dest.status] || dest.status || "неизвестно");
  // Тон назначения отличается от тона элемента: включённый флаг у НАЗНАЧЕНИЯ —
  // расхождение, а не «прочитали значение». Именно оно перезапишет флаг элемента
  // при записи спецификации, поэтому подсвечивается красным. У элемента же
  // включённый флаг — норма, и там синий остаётся.
  const destTone = !dest.checked
    ? specStatusTone(dest.status, dest.checked)
    : (dest.value ? "bad" : "ok");
  // Имя избранного приходит в destinationFlag.sourceName, но в C++ туда
  // кладётся ВСЕГДА rule.favorite_name — даже когда активным назначением был
  // объект по умолчанию (Spec.cpp:2706-2722). Поэтому имя показывается только
  // в своей строке «Избранное», а к строкам флага не дописывается: у строки
  // «Флаг по умолчанию» имя избранного отношения не имеет.
  const favoriteName = (common.favoriteFound && dest.sourceName) ? dest.sourceName : "";
  const usedFavorite = dest.origin === "FavoriteValue";
  const usedDefault = dest.origin === "DefaultElemValue";

  // Активный источник определяется по origin, но с запасным путём: origin может
  // прийти иным (например DefaultDefinition), и тогда обе строки сказали бы
  // «не проверялось» при непустом значении. При наличии значения источник
  // определяется тем, какое назначение использовано.
  const activeIsFavorite = usedFavorite ||
    (dest.checked && !usedDefault && common.favoriteFound);
  const activeIsDefault = usedDefault ||
    (dest.checked && !usedFavorite && !common.favoriteFound);

  rows.push({
    label: "Флаг в Избранном",
    text: activeIsFavorite ? destText
                          : (common.favoriteFound ? "не проверялось — флаг снят с избранного"
                                                 : "не проверялось — избранное не найдено"),
    tone: activeIsFavorite ? destTone : "muted"
  });
  // Строка назначения по умолчанию нужна только когда оно действительно
  // использовалось: избранного нет либо чтение по нему не удалось и C++ отметил
  // это fromDefaultElem (Spec.cpp:2687). При найденном избранном она не
  // выводится вовсе — иначе показывала бы «не проверялось», что читается как
  // недочёт правила, хотя всё в порядке.
  if (!common.favoriteFound || common.fromDefaultElem) {
    rows.push({
      label: "Флаг по умолчанию",
      text: activeIsDefault ? destText
                            : (common.favoriteFound ? "не прочитано" : "нет флага"),
      tone: activeIsDefault ? destTone : (common.favoriteFound ? "bad" : "muted")
    });
  }
  // Назначение не прочиталось вовсе: обе строки выше молчат, причина нужна явно.
  if (dest.status === "Unknown" && dest.origin === "NotChecked") {
    rows.push({ label: "Назначение не прочитано", text: "", tone: "bad" });
  }
  // Имя избранного берётся из sourceName активного назначения — отдельного
  // поля с именем в ответе моста нет.
  rows.push({ label: "Избранное",
               text: !common.favoriteFound ? "не найдено" : (favoriteName || "найдено по имени"),
               tone: common.favoriteFound ? "ok" : "warn" });

  // Назначение называется тем же правилом, что и в C++: избранное, если оно
  // найдено, иначе объект по умолчанию. Отдельного поля с источником в ответе
  // моста нет, но и не нужно: назначение читается одним вызовом, поэтому
  // источник однозначен и определяется favoriteFound.
  const destName = common.favoriteFound ? "Избранное" : "Элемент по умолчанию";
  const missingWhere = common.favoriteFound ? "у избранного" : "у элемента по умолчанию";
  (common.missingWrite || []).forEach(function (name) {
    rows.push({ label: "Нет выходного свойства " + missingWhere, text: name, tone: "warn" });
  });
  // Два служебных носителя: без них спецификация не пишется, даже если все
  // выходные свойства на месте. Ищет их ResolveFavoriteLinks — тот же, что и
  // при запуске, — и при несовпадении пропускает молча, поэтому проверка
  // вызывает его отдельно и сообщает здесь.
  if (common.definitionFound && !common.destinationNamePropFound) {
    rows.push({ label: "Нет свойства для имени правила " + missingWhere, text: "", tone: "bad" });
  }
  if (common.definitionFound && !common.destinationGuidPropFound) {
    rows.push({ label: "Нет свойства для связи " + missingWhere, text: "", tone: "bad" });
  }
  (common.unresolvedInProject || []).forEach(function (name) {
    rows.push({ label: "Не подтверждено в проекте", text: name, tone: "warn" });
  });
  return rows;
}

function specListRow(label, text, tone) {
  // Подпись и результат — одна строка, перенос только если не помещаются.
  //
  // Разрыв задаётся margin на ПОДПИСИ, а не gap на контейнере. Причина в переносе:
  // когда подпись и результат не помещаются в строку, результат уезжает на
  // следующую строку, и при word-break:break-word его первый фрагмент встаёт
  // вплотную к последнему слову подписи. Отступ подписи переживает и сжатие, и
  // перенос; gap в этой ситуации оказался бы между строками, а не между подписью
  // и результатом, то есть в нужном месте не сработал бы вовсе.
  return h("div", { style: "display:flex;padding:0.15rem 0;font-size:0.72rem;align-items:baseline;flex-wrap:wrap;" }, [
    h("span", { text: label, style: "flex:0 1 auto;min-width:0;margin-right:0.6rem;color:var(--ac-text-tertiary);word-break:break-word;" }),
    // Результат — жирный: подпись отвечает «что это», результат — «что получилось»,
    // и глаз должен идти по второму.
    h("span", { text: text, style: "flex:0 1 auto;min-width:0;font-weight:600;color:" + specToneText(tone || "muted") + ";word-break:break-word;" })
  ]);
}

function renderSpecCommonBlock(common) {
  const wrap = h("div", {
    style: "border:1px solid var(--ac-border);border-radius:0.35rem;background:var(--ac-bg-elevated);" +
           "padding:0.45rem 0.6rem;margin-bottom:0.45rem;flex:0 0 auto;"
  });
  wrap.appendChild(h("div", {
    text: "Правило",
    style: "font-size:0.76rem;font-weight:700;color:var(--ac-text-primary);margin-bottom:0.3rem;"
  }));
  specCommonRows(common).forEach(function (row) {
    wrap.appendChild(specListRow(row.label, row.text, row.tone));
  });
  return wrap;
}

function renderSpecElementBlock(el, index, onlyProblems) {
  const destFlag = ((STATE.spec.report || {}).common || {}).destinationFlag || {};
  const findings = specElementFindings(el, destFlag);
  const problems = findings.errors;
  const notices = findings.notices;
  // В режиме «только расхождения» элемент с одной лишь подсветкой не показывается:
  // подсветка не расхождение, и показывать её здесь незачем. Но сам он остаётся в
  // счётчике — иначе подсветка была бы посчитана и тут же спрятана.
  if (onlyProblems && !problems.length) return null;
  const flag = el.elementFlag || {};
  const tone = specStatusTone(flag.status, flag.checked);

  const wrap = h("div", {
    style: "border:1px solid var(--ac-border);border-radius:0.35rem;background:var(--ac-bg-elevated);" +
           "padding:0.45rem 0.6rem;margin-bottom:0.4rem;flex:0 0 auto;"
  });

  const head = h("div", {
    style: "display:flex;align-items:center;gap:0.35rem;margin-bottom:0.25rem;flex-wrap:wrap;row-gap:0.15rem;"
  }, [
    h("span", {
      text: "#" + (index + 1),
      style: "font-size:0.7rem;font-weight:700;color:var(--ac-text-tertiary);flex:0 0 auto;"
    }),
    h("span", {
      text: el.guid || "—",
      style: "font-family:monospace;font-size:0.68rem;color:var(--ac-text-tertiary);" +
             "flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;"
    }),
    h("button", {
      text: problems.length ? (problems.length + " ✕") : (notices.length ? "⚠" : "✓"),
      style: "flex:0 0 auto;font-size:0.68rem;padding:0.1rem 0.4rem;border-radius:0.25rem;cursor:pointer;" +
             "border:1px solid var(--ac-border);background:var(--ac-bg-input);color:" + specToneText(problems.length ? "bad" : (notices.length ? "warn" : "ok")) + ";",
      hoverStyle: "background:var(--ac-bg-hover);",
      on: { click: function () { ACBridge.highlightElements([el.guid]); } }
    })
  ]);
  wrap.appendChild(head);

  wrap.appendChild(specListRow(
    "Флаг правила",
    (flag.checked ? (flag.value ? "включён" : "выключен") : (SPEC_STATUS_LABEL[flag.status] || flag.status || "неизвестно")) +
      " · " + (SPEC_ORIGIN_LABEL[flag.origin] || flag.origin || "—"),
    tone));

  if (!problems.length) {
    wrap.appendChild(specListRow("Ошибки", "нет", "ok"));
  } else {
    const list = h("div", { style: "display:flex;flex-direction:column;gap:0.05rem;" });
    problems.forEach(function (text) {
      list.appendChild(h("div", {
        text: "— " + text,
        style: "font-size:0.7rem;color:" + SPEC_TONE_COLOR.bad + ";word-break:break-word;"
      }));
    });
    wrap.appendChild(list);
  }
  notices.forEach(function (text) {
    wrap.appendChild(specListRow("Подсветка", text, "warn"));
  });
  return wrap;
}

function renderSpecTab(container) {
  const cfg = STATE.spec;
  const root = h("div", { style: "display:flex;flex-direction:column;height:100%;overflow:hidden;" });

  // ---- Шапка: источник списка свойств и выбор свойства-правила ----
  const header = h("div", {
    style: "padding:0.5rem 0.75rem;border-bottom:1px solid var(--ac-divider);flex:0 0 auto;display:flex;" +
           "flex-direction:column;gap:0.35rem;position:relative;z-index:6;"
  });
  const sourceLine = h("div", {
    style: "font-size:0.7rem;color:var(--ac-text-tertiary);word-break:break-word;"
  });

  // Панель позиционируется absolute внутри блока без overflow — иначе
  // прокрутка родителя обрезает её (ловушка #182).
  const pickerWrap = h("div", { style: "position:relative;flex:0 0 auto;" });
  const searchInput = h("input", {
    attrs: {
      type: "text",
      placeholder: "Свойство-правило — поиск по имени…",
      value: cfg.query
    },
    style: "width:100%;padding:0.35rem 0.5rem;font-size:0.78rem;background:var(--ac-bg-input);" +
           "color:var(--ac-text-primary);border:1px solid var(--ac-border);border-radius:0.25rem;",
    on: {
      input: function () {
        cfg.query = searchInput.value;
        renderSpecPropertyDropdown();
      },
      focus: function () { renderSpecPropertyDropdown(); }
    }
  });
  const dropdown = h("div", {
    style: "display:none;position:absolute;top:2.1rem;left:0;right:0;z-index:7;max-height:12rem;overflow:auto;" +
           "background:var(--ac-bg-elevated);border:1px solid var(--ac-border);border-radius:0.3rem;" +
           "box-shadow:0 4px 10px var(--ac-shadow-color);"
  });
  pickerWrap.appendChild(searchInput);
  pickerWrap.appendChild(dropdown);

  function matchesSpecQuery(name) {
    const q = (cfg.query || "").trim ().toLowerCase ();
    return !q || (name || "").toLowerCase ().indexOf (q) >= 0;
  }

  function selectSpecProperty(prop) {
    cfg.selectedId = prop.id;
    cfg.selectedName = prop.name;
    cfg.query = prop.name;
    searchInput.value = prop.name;
    dropdown.style.display = "none";
    cfg.report = null;
    cfg.pending = false;
    // Пересборка блоков: сводка в заголовке блока «Проверка» описывает
    // именно текущий отчёт, поэтому смена свойства обязана её снять.
    rebuildSpecBlocks();
  }

  function renderSpecPropertyDropdown() {
    clear(dropdown);
    // Набор уже отобран по точному признаку Spec_rule (cfg.ruleProperties);
    // здесь остаётся только поиск по имени.
    const list = (cfg.ruleProperties || []).filter(function (p) { return matchesSpecQuery(p.name); });
    if (!list.length) {
      dropdown.appendChild(h("div", {
        text: "Ничего не найдено",
        style: "padding:0.4rem 0.6rem;font-size:0.72rem;color:var(--ac-text-tertiary);"
      }));
      dropdown.style.display = "block";
      return;
    }
    list.slice(0, 200).forEach(function (prop) {
      dropdown.appendChild(h("div", {
        text: prop.name,
        attrs: { role: "button" },
        focusable: true,
        style: "padding:0.35rem 0.6rem;font-size:0.76rem;cursor:pointer;color:" +
               (prop.id === cfg.selectedId ? "var(--ac-accent)" : "var(--ac-text-primary)") + ";" +
               (prop.id === cfg.selectedId ? "font-weight:700;" : ""),
        hoverStyle: "background:var(--ac-bg-hover);",
        on: { click: function () { selectSpecProperty(prop); } }
      }));
    });
    dropdown.style.display = "block";
  }

  // ---- Общая прокрутка: оба блока растут в потоке, своей прокрутки у
  // списка результатов нет — вложенный скролл в узкой палитре неудобен.
  const scroll = h("div", {
    style: "flex:1 1 auto;min-height:0;overflow:auto;padding:0.5rem 0.75rem 0.9rem;"
  });

  header.appendChild(sourceLine);
  header.appendChild(pickerWrap);
  root.appendChild(header);
  root.appendChild(scroll);
  container.appendChild(root);

  // ---- Сводка для заголовка блока «Проверка» ----
  function checkSummary() {
    if (cfg.pending) return "проверяется…";
    if (!cfg.report) return cfg.selectedId ? "не проверялось" : "выберите свойство-правило";
    const r = cfg.report;
    const destFlag = (r.common || {}).destinationFlag || {};
    const problems = (r.elements || [])
      .filter(function (el) { return specElementFindings(el, destFlag).errors.length; })
      .length;
    const notices = (r.elements || [])
      .filter(function (el) { return specElementFindings(el, destFlag).notices.length; })
      .length;
    return "проверено " + r.checked + " из " + r.totalSelected +
           (problems ? " · ошибок: " + problems : " · ошибок нет") +
           (notices ? " · флаг выключен: " + notices : "");
  }

  function editSummary() {
    return cfg.selectedName || "свойство не выбрано";
  }

  function buildCheckBlock() {
    const wrap = blockShell("Проверка", cfg.checkOpen, checkSummary (), function () {
      cfg.checkOpen = !cfg.checkOpen;
      rebuildSpecBlocks();
    });
    if (!cfg.checkOpen) return wrap;

    const body = h("div", {
      style: "padding:0.1rem 0.6rem 0.6rem;display:flex;flex-direction:column;gap:0.4rem;"
    });

    // ---- Лимит проверки ----
    const limitRow = h("div", {
      style: "display:flex;align-items:center;gap:0.35rem;flex:0 1 auto;min-width:0;flex-wrap:wrap;row-gap:0.2rem;"
    });
    limitRow.appendChild(h("span", {
      text: "Проверять не более",
      style: "font-size:0.7rem;color:var(--ac-text-secondary);"
    }));
    const limitSelect = h("select", {
      style: "padding:0.2rem 0.35rem;font-size:0.72rem;background:var(--ac-bg-input);" +
             "color:var(--ac-text-primary);border:1px solid var(--ac-border);border-radius:0.25rem;",
      on: { change: function () { cfg.limit = parseInt(limitSelect.value, 10) || SPEC_CHECK_LIMIT; } }
    });
    [10, 20, 50, 100].forEach(function (n) {
      limitSelect.appendChild(h("option", { text: String(n), attrs: { value: String(n) } }));
    });
    limitSelect.value = String(cfg.limit);
    limitRow.appendChild(limitSelect);
    limitRow.appendChild(h("span", {
      text: "элементов",
      style: "font-size:0.7rem;color:var(--ac-text-secondary);"
    }));

    const statusLine = h("div", {
      style: "font-size:0.72rem;color:var(--ac-text-secondary);min-height:0.9rem;word-break:break-word;"
    });

    const runBtn = h("button", {
      text: "Проверить",
      style: "padding:0.35rem 0.8rem;font-size:0.78rem;border:none;border-radius:0.25rem;cursor:pointer;" +
             "background:var(--ac-accent);color:var(--ac-accent-contrast);font-weight:600;",
      on: { click: function () { runSpecCheck(runBtn, statusLine); } }
    });
    if (cfg.pending) {
      runBtn.disabled = true;
      runBtn.textContent = "Проверяется…";
    }

    // Строка переносится: в узкой палитре (окно 230px) лимит и кнопка в
    // одну строку не помещаются, и без переноса строка уезжала за край.
    const actionsRow = h("div", {
      style: "display:flex;align-items:center;gap:0.5rem;flex:0 0 auto;flex-wrap:wrap;row-gap:0.3rem;"
    }, [limitRow, runBtn]);

    const results = h("div", { style: "display:flex;flex-direction:column;min-width:0;" });
    renderSpecResults(results);

    body.appendChild(actionsRow);
    body.appendChild(statusLine);
    body.appendChild(results);
    wrap.appendChild(body);

    // Строка статуса восстанавливается из отчёта: блок пересобирается при
    // сворачивании, и текст, записанный в прошлый элемент, был бы потерян.
    if (cfg.report) {
      statusLine.textContent = "Проверено " + cfg.report.checked + " из " + cfg.report.totalSelected +
        " элементов.";
      statusLine.style.color = cfg.report.ok ? "var(--ac-text-secondary)" : SPEC_TONE_COLOR.bad;
    }
    return wrap;
  }

  function buildEditBlock() {
    const wrap = blockShell("Редактирование правила", cfg.editOpen, editSummary (), function () {
      cfg.editOpen = !cfg.editOpen;
      rebuildSpecBlocks();
    });
    if (!cfg.editOpen) return wrap;

    // Редактор ещё не спроектирован: блок создан как место под него, чтобы
    // не заводить вторую вкладку и не терять выбранное свойство при переключении.
    const body = h("div", {
      style: "padding:0.1rem 0.6rem 0.6rem;font-size:0.72rem;color:var(--ac-text-tertiary);"
    });
    body.appendChild(h("div", {
      text: "Редактор описания правила — в работе.",
      style: "font-size:0.72rem;color:var(--ac-text-tertiary);"
    }));
    wrap.appendChild(body);
    return wrap;
  }

  let checkBlock = null;
  let editBlock = null;

  function rebuildSpecBlocks() {
    if (checkBlock) checkBlock.replaceWith(buildCheckBlock());
    else scroll.appendChild(buildCheckBlock());
    checkBlock = scroll.children[0];
    if (editBlock) editBlock.replaceWith(buildEditBlock());
    else scroll.appendChild(buildEditBlock());
    editBlock = scroll.children[1];
  }

  // ---- Отрисовка результата ----
  function renderSpecResults(resultsNode) {
    clear(resultsNode);
    if (!cfg.report) {
      resultsNode.appendChild(h("div", {
        text: cfg.selectedId ? "Выберите действие «Проверить»." : "Выберите свойство-правило.",
        style: "font-size:0.74rem;color:var(--ac-text-tertiary);"
      }));
      return;
    }
    const report = cfg.report;
    resultsNode.appendChild(renderSpecCommonBlock(report.common || {}));

    const elements = report.elements || [];
    const destFlag = (report.common || {}).destinationFlag || {};
    const shown = cfg.onlyProblems
      ? elements.filter(function (el) { return specElementFindings(el, destFlag).errors.length; })
      : elements;
    if (!elements.length) {
      resultsNode.appendChild(h("div", {
        text: "Выделение пустое — проверено только правило",
        style: "font-size:0.74rem;color:var(--ac-text-tertiary);"
      }));
    } else if (!shown.length) {
      resultsNode.appendChild(h("div", {
        text: "Ошибок нет",
        style: "font-size:0.74rem;color:var(--ac-text-tertiary);"
      }));
    }
    shown.forEach(function (el, index) {
      const block = renderSpecElementBlock(el, index, cfg.onlyProblems);
      if (block) resultsNode.appendChild(block);
    });

    if (report.truncated) {
      resultsNode.appendChild(h("div", {
        text: "Показаны первые " + report.checked + " из " + report.totalSelected +
              " выделенных элементов (лимит).",
        style: "font-size:0.7rem;color:var(--ac-warn);padding:0.2rem 0;"
      }));
    }
  }

  function runSpecCheck(btn, statusNode) {
    if (!cfg.selectedId) {
      statusNode.textContent = "Сначала выберите свойство-правило.";
      statusNode.style.color = SPEC_TONE_COLOR.warn;
      return;
    }
    btn.disabled = true;
    btn.textContent = "Проверяется…";
    cfg.pending = true;
    statusNode.textContent = "";
    ACBridge.checkSpecRuleByPropertyGuid(cfg.selectedId, cfg.limit).then(function (report) {
      cfg.pending = false;
      cfg.report = report;
      // Блок пересобирается целиком: и кнопка, и сводка в его заголовке
      // должны отразить завершившуюся проверку.
      rebuildSpecBlocks();
    });
  }

  // ---- Загрузка списка свойств: выделение, иначе все свойства проекта ----
  ACBridge.getSpecRuleProperties().then(function (data) {
    cfg.properties = data.properties || [];
    cfg.source = data.source;
    // Подпись источника короткая намеренно: она только объясняет, откуда взят
    // список, и не должна конкурировать с самим списком свойств.
    const sourceText = data.source === "selection"
      ? "Правила выделения"
      : (data.source === "project" ? "Правила проекта" : "Правила");
    // Набор правил — свойства с точным признаком Spec_rule; от него зависят и
    // счётчик в строке источника, и сохранение выбранного свойства.
    cfg.ruleProperties = (cfg.properties || []).filter(function (p) { return p.hasSpecRule === true; });
    sourceLine.textContent = sourceText + ": " + cfg.ruleProperties.length +
      (data.selectionCount > 0 ? " · выделено " + data.selectionCount : "");
    // Сохраняем выбранное свойство, если оно ещё есть в списке.
    if (cfg.selectedId) {
      const still = cfg.ruleProperties.some(function (p) { return p.id === cfg.selectedId; });
      if (!still) {
        cfg.selectedId = null;
        cfg.selectedName = null;
        searchInput.value = "";
        cfg.query = "";
        cfg.report = null;
      }
    }
    // Поле поиска пустое — подставляем первое правило, чтобы проверку можно было
    // запустить сразу, без лишнего щелчка по списку. Если поле уже что-то содержит
    // (пользователь искал или выбрал правило сам), ничего не трогаем: выбор
    // пользователя главнее. Само подставленное правило занимает поле, поэтому
    // повторно автовыбор не срабатывает.
    // Порядок берётся из ответа моста, где свойства идут в порядке обхода
    // элементов выделения (BrowserPalette.cpp), поэтому «первое» — это первое
    // правило именно выбранных элементов, а не произвольное из проекта.
    if (!cfg.query && cfg.ruleProperties.length) {
      selectSpecProperty(cfg.ruleProperties[0]);
      return;
    }
    rebuildSpecBlocks();
  });

  rebuildSpecBlocks();
}

/* =====================================================================================
   8. ЗАПУСК
   ===================================================================================== */
document.addEventListener("DOMContentLoaded", function () {
  applyTheme(STATE.theme); // светлая тема по умолчанию
  buildShell();
});
</script>
</body>
