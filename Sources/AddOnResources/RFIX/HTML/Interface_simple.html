<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Редактор описаний свойств Archicad</title>
</head>
<body id="appBody" style="margin: 0; padding: 12px; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; background-color: #1e1e1e; color: #cccccc; box-sizing: border-box;">

    <!-- ШАПКА И ПЕРЕКЛЮЧЕНИЕ ТЕМЫ -->
    <div id="headerBar" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid #3c3c3c;">
        <span style="font-weight: bold; font-size: 14px; color: #ffffff;" id="headerTitle">Редактор описаний свойств</span>
        <button id="themeToggleBtn" onclick="app.toggleTheme()" style="background-color: #3a3d41; color: #ffffff; border: 1px solid #555555; padding: 4px 10px; border-radius: 3px; cursor: pointer; font-size: 12px;">
            ☀️ Светлая тема
        </button>
    </div>

    <!-- РАЗДЕЛ 1: Отслеживание значений свойств (Постоянный блок сверху) -->
    <div id="section1" style="background-color: #252526; border: 1px solid #3c3c3c; border-radius: 4px; padding: 10px; margin-bottom: 12px;">
        <div style="font-weight: bold; margin-bottom: 8px; color: #569cd6; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;">
            1. Отслеживание значения свойства
        </div>
        
        <div style="display: flex; gap: 8px; align-items: center; margin-bottom: 8px;">
            <label style="width: 130px; font-weight: 500;">Выбор свойства:</label>
            <select id="propSelect1" onchange="app.onSelectProperty(this.value)" style="flex: 1; background-color: #3c3c3c; color: #ffffff; border: 1px solid #555555; padding: 5px; border-radius: 3px; font-size: 12px;">
                <option value="">-- Загрузка свойств... --</option>
            </select>
        </div>

        <div style="display: flex; gap: 8px; align-items: center;">
            <label style="width: 130px; font-weight: 500;">Текущее значение:</label>
            <input type="text" id="currentValueInput" readonly placeholder="Значение выделенного элемента..." style="flex: 1; background-color: #2d2d2d; color: #9cdcfe; border: 1px solid #444444; padding: 5px; border-radius: 3px; font-size: 12px; font-family: monospace;">
            <button id="btnRefreshVal" onclick="app.refreshPropertyValue()" style="background-color: #0e639c; color: #ffffff; border: none; padding: 5px 12px; border-radius: 3px; cursor: pointer; font-size: 12px;">
                Обновить
            </button>
        </div>
    </div>

    <!-- РАЗДЕЛ 2: Работа с описаниями (Разворачиваемый блок) -->
    <details id="section2" open style="background-color: #252526; border: 1px solid #3c3c3c; border-radius: 4px; padding: 10px;">
        <summary style="font-weight: bold; color: #569cd6; cursor: pointer; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; outline: none; margin-bottom: 8px;">
            2. Работа с описаниями (Редактор)
        </summary>

        <div style="display: flex; gap: 8px; align-items: center; margin-top: 8px; margin-bottom: 8px;">
            <label style="width: 130px; font-weight: 500;">Выбранное свойство:</label>
            <select id="propSelect2" onchange="app.onSelectProperty(this.value)" style="flex: 1; background-color: #3c3c3c; color: #ffffff; border: 1px solid #555555; padding: 5px; border-radius: 3px; font-size: 12px;">
                <option value="">-- Загрузка свойств... --</option>
            </select>
        </div>

        <div style="margin-bottom: 8px;">
            <label style="display: block; font-weight: 500; margin-bottom: 4px;">Текущее описание (PropertyCache):</label>
            <textarea id="currentDescArea" readonly rows="2" style="width: 100%; box-sizing: border-box; background-color: #2d2d2d; color: #ce9178; border: 1px solid #444444; padding: 5px; border-radius: 3px; font-size: 11px; font-family: monospace; resize: vertical;"></textarea>
        </div>

        <!-- ВКЛАДКИ КОМАНД -->
        <div style="margin-bottom: 8px;">
            <div id="tabHeaders" style="display: flex; border-bottom: 1px solid #3c3c3c; background-color: #1e1e1e; border-top-left-radius: 3px; border-top-right-radius: 3px;">
                <button onclick="app.switchTab('tabSync')" id="btnTabSync" style="padding: 6px 12px; border: none; background-color: #0e639c; color: #ffffff; cursor: pointer; font-size: 12px; font-weight: 500;">Синхронизация</button>
                <button onclick="app.switchTab('tabRenum')" id="btnTabRenum" style="padding: 6px 12px; border: none; background-color: transparent; color: #cccccc; cursor: pointer; font-size: 12px;">Нумерация</button>
                <button onclick="app.switchTab('tabSum')" id="btnTabSum" style="padding: 6px 12px; border: none; background-color: transparent; color: #cccccc; cursor: pointer; font-size: 12px;">Суммирование</button>
                <button onclick="app.switchTab('tabSpec')" id="btnTabSpec" style="padding: 6px 12px; border: none; background-color: transparent; color: #cccccc; cursor: pointer; font-size: 12px;">Спецификации</button>
            </div>

            <div id="tabContainer" style="background-color: #2d2d2d; border: 1px solid #3c3c3c; border-top: none; padding: 8px; border-bottom-left-radius: 3px; border-bottom-right-radius: 3px;">
                <!-- Вкладка 1: Синхронизация -->
                <div id="tabSync" style="display: block;">
                    <div style="margin-bottom: 6px; font-size: 11px; color: #888888;">Шаблоны синхронизации и модификаторы:</div>
                    <div style="display: flex; flex-wrap: wrap; gap: 4px;">
                        <button onclick="app.insertText('Sync_from{}')" style="background-color: #3a3d41; color: #ffffff; border: 1px solid #555555; padding: 3px 6px; border-radius: 2px; cursor: pointer; font-size: 11px;">Sync_from{}</button>
                        <button onclick="app.insertText('Sync_to{}')" style="background-color: #3a3d41; color: #ffffff; border: 1px solid #555555; padding: 3px 6px; border-radius: 2px; cursor: pointer; font-size: 11px;">Sync_to{}</button>
                        <button onclick="app.insertText('Sync_from{Property:...}')" style="background-color: #3a3d41; color: #ffffff; border: 1px solid #555555; padding: 3px 6px; border-radius: 2px; cursor: pointer; font-size: 11px;">Sync_from{Property:...}</button>
                        <button onclick="app.insertText('Sync_from{description:...}')" style="background-color: #3a3d41; color: #ffffff; border: 1px solid #555555; padding: 3px 6px; border-radius: 2px; cursor: pointer; font-size: 11px;">Sync_from{description:...}</button>
                        <button onclick="app.insertText('Sync_from{IFC:...}')" style="background-color: #3a3d41; color: #ffffff; border: 1px solid #555555; padding: 3px 6px; border-radius: 2px; cursor: pointer; font-size: 11px;">Sync_from{IFC:...}</button>
                    </div>
                    <div style="display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px;">
                        <button onclick="app.insertText('empty')" style="background-color: #252526; color: #dcdcaa; border: 1px solid #555555; padding: 2px 5px; border-radius: 2px; cursor: pointer; font-size: 10px;">empty</button>
                        <button onclick="app.insertText('trim_empty')" style="background-color: #252526; color: #dcdcaa; border: 1px solid #555555; padding: 2px 5px; border-radius: 2px; cursor: pointer; font-size: 10px;">trim_empty</button>
                        <button onclick="app.insertText('def')" style="background-color: #252526; color: #dcdcaa; border: 1px solid #555555; padding: 2px 5px; border-radius: 2px; cursor: pointer; font-size: 10px;">def</button>
                        <button onclick="app.insertText('uniq')" style="background-color: #252526; color: #4ec9b0; border: 1px solid #555555; padding: 2px 5px; border-radius: 2px; cursor: pointer; font-size: 10px;">uniq</button>
                        <button onclick="app.insertText('sum')" style="background-color: #252526; color: #4ec9b0; border: 1px solid #555555; padding: 2px 5px; border-radius: 2px; cursor: pointer; font-size: 10px;">sum</button>
                        <button onclick="app.insertText('max')" style="background-color: #252526; color: #4ec9b0; border: 1px solid #555555; padding: 2px 5px; border-radius: 2px; cursor: pointer; font-size: 10px;">max</button>
                        <button onclick="app.insertText('min')" style="background-color: #252526; color: #4ec9b0; border: 1px solid #555555; padding: 2px 5px; border-radius: 2px; cursor: pointer; font-size: 10px;">min</button>
                    </div>
                </div>

                <!-- Вкладка 2: Нумерация -->
                <div id="tabRenum" style="display: none;">
                    <div style="display: flex; gap: 4px; margin-bottom: 6px;">
                        <button onclick="app.insertText('Renum_flag{}')" style="background-color: #3a3d41; color: #ffffff; border: 1px solid #555555; padding: 3px 6px; border-radius: 2px; cursor: pointer; font-size: 11px;">Renum_flag{}</button>
                        <button onclick="app.insertText('Renum{}')" style="background-color: #3a3d41; color: #ffffff; border: 1px solid #555555; padding: 3px 6px; border-radius: 2px; cursor: pointer; font-size: 11px;">Renum{}</button>
                    </div>
                    <!-- Конструктор Нумерации -->
                    <div style="background-color: #1e1e1e; padding: 6px; border-radius: 3px; border: 1px solid #444444;">
                        <div style="font-size: 10px; color: #888888; margin-bottom: 4px;">Конструктор Renum:</div>
                        <div style="display: flex; gap: 4px; align-items: center; margin-bottom: 4px;">
                            <span style="font-size: 11px; width: 60px;">Режим:</span>
                            <select id="renumMode" style="background-color: #3c3c3c; color: #fff; border: 1px solid #555; font-size: 11px; flex: 1;">
                                <option value="NULL">NULL</option>
                                <option value="SPACE">SPACE</option>
                                <option value="ALLNULL">ALLNULL</option>
                                <option value="n_NULL">n_NULL</option>
                            </select>
                        </div>
                        <button onclick="app.buildRenum()" style="background-color: #0e639c; color: #fff; border: none; padding: 3px 8px; border-radius: 2px; cursor: pointer; font-size: 11px; width: 100%;">Вставить Renum</button>
                    </div>
                </div>

                <!-- Вкладка 3: Суммирование -->
                <div id="tabSum" style="display: none;">
                    <div style="background-color: #1e1e1e; padding: 6px; border-radius: 3px; border: 1px solid #444444;">
                        <div style="font-size: 10px; color: #888888; margin-bottom: 4px;">Конструктор Sum:</div>
                        <div style="display: flex; gap: 4px; align-items: center; margin-bottom: 4px;">
                            <span style="font-size: 11px; width: 70px;">Разделитель:</span>
                            <input type="text" id="sumSep" value="; " style="background-color: #3c3c3c; color: #fff; border: 1px solid #555; font-size: 11px; width: 50px; padding: 2px;">
                        </div>
                        <div style="display: flex; gap: 4px;">
                            <button onclick="app.insertText('Sum{Property:Prop1; Property:Prop2}')" style="background-color: #3a3d41; color: #ffffff; border: 1px solid #555555; padding: 3px 6px; border-radius: 2px; cursor: pointer; font-size: 11px; flex: 1;">Sum{Prop1; Prop2}</button>
                            <button onclick="app.insertText('max')" style="background-color: #3a3d41; color: #ffffff; border: 1px solid #555555; padding: 3px 6px; border-radius: 2px; cursor: pointer; font-size: 11px;">+ max</button>
                            <button onclick="app.insertText('min')" style="background-color: #3a3d41; color: #ffffff; border: 1px solid #555555; padding: 3px 6px; border-radius: 2px; cursor: pointer; font-size: 11px;">+ min</button>
                        </div>
                    </div>
                </div>

                <!-- Вкладка 4: Спецификации -->
                <div id="tabSpec" style="display: none;">
                    <div style="display: flex; gap: 4px; margin-bottom: 6px;">
                        <button onclick="app.insertText('Spec_rule')" style="background-color: #3a3d41; color: #ffffff; border: 1px solid #555555; padding: 3px 6px; border-radius: 2px; cursor: pointer; font-size: 11px;">Spec_rule</button>
                        <button onclick="app.insertText('Spec_rule_v2')" style="background-color: #3a3d41; color: #ffffff; border: 1px solid #555555; padding: 3px 6px; border-radius: 2px; cursor: pointer; font-size: 11px;">Spec_rule_v2</button>
                        <button onclick="app.insertText('Spec_rule_v3')" style="background-color: #3a3d41; color: #ffffff; border: 1px solid #555555; padding: 3px 6px; border-radius: 2px; cursor: pointer; font-size: 11px;">Spec_rule_v3</button>
                    </div>
                    <div style="background-color: #1e1e1e; padding: 6px; border-radius: 3px; border: 1px solid #444444;">
                        <div style="font-size: 10px; color: #888888; margin-bottom: 4px;">Конструктор групп Spec:</div>
                        <div style="display: flex; gap: 4px; margin-bottom: 4px;">
                            <button onclick="app.insertText('g(U:...; P:...; F:...; Q:...; Pn:...; Qn1:...;)')" style="background-color: #3a3d41; color: #dcdcaa; border: 1px solid #555; padding: 3px 6px; border-radius: 2px; font-size: 10px; flex: 1;">Группа g(...)</button>
                            <button onclick="app.insertText('s(U:...; P:...; F:...; Q:...; Pn:...; Qn1:...;)')" style="background-color: #3a3d41; color: #dcdcaa; border: 1px solid #555; padding: 3px 6px; border-radius: 2px; font-size: 10px; flex: 1;">Подгруппа s(...)</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- РЕДАКТОР ОПИСАНИЯ -->
        <div style="margin-bottom: 8px;">
            <label style="display: block; font-weight: 500; margin-bottom: 4px;">Редактор описания:</label>
            <textarea id="editorDescArea" rows="6" placeholder="Вводите синтаксис или используйте кнопки быстрой вставки выше..." style="width: 100%; box-sizing: border-box; background-color: #1e1e1e; color: #d4d4d4; border: 1px solid #555555; padding: 6px; border-radius: 3px; font-size: 12px; font-family: Consolas, Monaco, monospace; resize: vertical;"></textarea>
        </div>

        <!-- КНОПКИ ДЕЙСТВИЙ -->
        <div style="display: flex; gap: 8px;">
            <button id="btnParseSyntax" onclick="app.parseSyntax()" style="flex: 1; background-color: #3a3d41; color: #ffffff; border: 1px solid #555555; padding: 6px 12px; border-radius: 3px; cursor: pointer; font-size: 12px; font-weight: 500;">
                Проверить синтаксис
            </button>
            <button id="btnSaveProperty" onclick="app.savePropertyDescription()" style="flex: 1; background-color: #0e639c; color: #ffffff; border: none; padding: 6px 12px; border-radius: 3px; cursor: pointer; font-size: 12px; font-weight: 500;">
                Записать в свойство
            </button>
        </div>

        <!-- БЛОК ВЫВОДА СТАТУСА/ОШИБОК -->
        <div id="statusOutput" style="display: none; margin-top: 8px; padding: 8px; border-radius: 3px; font-size: 11px; font-family: monospace; white-space: pre-wrap;"></div>
    </details>

    <!-- VANILLA ES5 JAVASCRIPT LOGIC -->
    <script>
        // Инициализация мока ACAPI, если скрипт запущен вне Archicad (в браузере)
        if (!window.ACAPI) {
            window.ACAPI = {
                GetPropertyDefinitions: function(callback) {
                    setTimeout(function() {
                        callback([
                            { guid: 'guid-1', name: 'Имя элемента (General.ElementName)', description: 'Sync_from{Property:Hotlink.Name}' },
                            { guid: 'guid-2', name: 'Маркировка (Custom.Mark)', description: 'Renum{NULL}' },
                            { guid: 'guid-3', name: 'Спецификация (Spec.Group)', description: 'Spec_rule_v2{g(U:1; P:Name;)}' }
                        ]);
                    }, 100);
                },
                GetElementPropertyValue: function(guid, callback) {
                    setTimeout(function() {
                        callback('Пример значения [' + guid + ']');
                    }, 100);
                },
                ParsePropertyDescription: function(desc, callback) {
                    setTimeout(function() {
                        if (desc.indexOf('Error') !== -1) {
                            callback({ status: 'error', message: 'Синтаксическая ошибка: не найдена закрывающая скобка "}"' });
                        } else {
                            callback({ status: 'ok', message: 'Синтаксис корректен. Найдено команд: 1' });
                        }
                    }, 100);
                },
                SetPropertyDescription: function(guid, desc, callback) {
                    setTimeout(function() {
                        callback({ status: 'ok', message: 'Описание успешно записано в свойство!' });
                    }, 100);
                }
            };
        }

        // Глобальный объект приложения
        window.app = {
            currentTheme: 'dark',
            propertiesList: [],
            selectedGuid: '',

            // Инициализация при загрузке
            init: function() {
                this.loadProperties();
            },

            // Переключение темы (без CSS классов, прямое управление стилями)
            toggleTheme: function() {
                var isDark = (this.currentTheme === 'dark');
                this.currentTheme = isDark ? 'light' : 'dark';

                var body = document.getElementById('appBody');
                var headerBar = document.getElementById('headerBar');
                var headerTitle = document.getElementById('headerTitle');
                var themeBtn = document.getElementById('themeToggleBtn');
                var sec1 = document.getElementById('section1');
                var sec2 = document.getElementById('section2');
                var select1 = document.getElementById('propSelect1');
                var select2 = document.getElementById('propSelect2');
                var valInput = document.getElementById('currentValueInput');
                var descArea = document.getElementById('currentDescArea');
                var editorArea = document.getElementById('editorDescArea');
                var tabHeaders = document.getElementById('tabHeaders');
                var tabContainer = document.getElementById('tabContainer');
                var btnParse = document.getElementById('btnParseSyntax');

                if (this.currentTheme === 'light') {
                    body.style.backgroundColor = '#f3f3f3';
                    body.style.color = '#333333';
                    headerBar.style.borderColor = '#cccccc';
                    headerTitle.style.color = '#000000';
                    themeBtn.style.backgroundColor = '#e1e1e1';
                    themeBtn.style.color = '#333333';
                    themeBtn.style.borderColor = '#cccccc';
                    themeBtn.innerHTML = '🌙 Тёмная тема';

                    sec1.style.backgroundColor = '#ffffff';
                    sec1.style.borderColor = '#cccccc';
                    sec2.style.backgroundColor = '#ffffff';
                    sec2.style.borderColor = '#cccccc';

                    select1.style.backgroundColor = '#ffffff';
                    select1.style.color = '#000000';
                    select1.style.borderColor = '#cccccc';

                    select2.style.backgroundColor = '#ffffff';
                    select2.style.color = '#000000';
                    select2.style.borderColor = '#cccccc';

                    valInput.style.backgroundColor = '#f8f8f8';
                    valInput.style.color = '#0000ff';
                    valInput.style.borderColor = '#cccccc';

                    descArea.style.backgroundColor = '#f8f8f8';
                    descArea.style.color = '#a31515';
                    descArea.style.borderColor = '#cccccc';

                    editorArea.style.backgroundColor = '#ffffff';
                    editorArea.style.color = '#000000';
                    editorArea.style.borderColor = '#cccccc';

                    tabHeaders.style.backgroundColor = '#e8e8e8';
                    tabHeaders.style.borderColor = '#cccccc';
                    tabContainer.style.backgroundColor = '#f3f3f3';
                    tabContainer.style.borderColor = '#cccccc';

                    btnParse.style.backgroundColor = '#e1e1e1';
                    btnParse.style.color = '#333333';
                    btnParse.style.borderColor = '#cccccc';
                } else {
                    body.style.backgroundColor = '#1e1e1e';
                    body.style.color = '#cccccc';
                    headerBar.style.borderColor = '#3c3c3c';
                    headerTitle.style.color = '#ffffff';
                    themeBtn.style.backgroundColor = '#3a3d41';
                    themeBtn.style.color = '#ffffff';
                    themeBtn.style.borderColor = '#555555';
                    themeBtn.innerHTML = '☀️ Светлая тема';

                    sec1.style.backgroundColor = '#252526';
                    sec1.style.borderColor = '#3c3c3c';
                    sec2.style.backgroundColor = '#252526';
                    sec2.style.borderColor = '#3c3c3c';

                    select1.style.backgroundColor = '#3c3c3c';
                    select1.style.color = '#ffffff';
                    select1.style.borderColor = '#555555';

                    select2.style.backgroundColor = '#3c3c3c';
                    select2.style.color = '#ffffff';
                    select2.style.borderColor = '#555555';

                    valInput.style.backgroundColor = '#2d2d2d';
                    valInput.style.color = '#9cdcfe';
                    valInput.style.borderColor = '#444444';

                    descArea.style.backgroundColor = '#2d2d2d';
                    descArea.style.color = '#ce9178';
                    descArea.style.borderColor = '#444444';

                    editorArea.style.backgroundColor = '#1e1e1e';
                    editorArea.style.color = '#d4d4d4';
                    editorArea.style.borderColor = '#555555';

                    tabHeaders.style.backgroundColor = '#1e1e1e';
                    tabHeaders.style.borderColor = '#3c3c3c';
                    tabContainer.style.backgroundColor = '#2d2d2d';
                    tabContainer.style.borderColor = '#3c3c3c';

                    btnParse.style.backgroundColor = '#3a3d41';
                    btnParse.style.color = '#ffffff';
                    btnParse.style.borderColor = '#555555';
                }
            },

            // Загрузка списка свойств из C++
            loadProperties: function() {
                var self = this;
                window.ACAPI.GetPropertyDefinitions(function(props) {
                    self.propertiesList = props || [];
                    self.renderPropertyDropdowns();
                });
            },

            // Отрисовка списка свойств в оба выпадающих списка
            renderPropertyDropdowns: function() {
                var sel1 = document.getElementById('propSelect1');
                var sel2 = document.getElementById('propSelect2');

                sel1.innerHTML = '';
                sel2.innerHTML = '';

                if (this.propertiesList.length === 0) {
                    var emptyOpt = document.createElement('option');
                    emptyOpt.text = 'Свойства не найдены';
                    sel1.add(emptyOpt);
                    sel2.add(emptyOpt.cloneNode(true));
                    return;
                }

                for (var i = 0; i < this.propertiesList.length; i++) {
                    var item = this.propertiesList[i];
                    
                    var opt1 = document.createElement('option');
                    opt1.value = item.guid;
                    opt1.text = item.name;
                    sel1.add(opt1);

                    var opt2 = document.createElement('option');
                    opt2.value = item.guid;
                    opt2.text = item.name;
                    sel2.add(opt2);
                }

                if (this.propertiesList.length > 0) {
                    this.onSelectProperty(this.propertiesList[0].guid);
                }
            },

            // Обработка выбора свойства (синхронизирует оба select)
            onSelectProperty: function(guid) {
                this.selectedGuid = guid;
                document.getElementById('propSelect1').value = guid;
                document.getElementById('propSelect2').value = guid;

                // Загружаем текущее значение
                this.refreshPropertyValue();

                // Загружаем текущее описание из кеша
                var propObj = null;
                for (var i = 0; i < this.propertiesList.length; i++) {
                    if (this.propertiesList[i].guid === guid) {
                        propObj = this.propertiesList[i];
                        break;
                    }
                }

                var descArea = document.getElementById('currentDescArea');
                var editorArea = document.getElementById('editorDescArea');

                if (propObj) {
                    descArea.value = propObj.description || '';
                    editorArea.value = propObj.description || '';
                } else {
                    descArea.value = '';
                    editorArea.value = '';
                }

                this.hideStatus();
            },

            // Запрос текущего значения элемента из C++
            refreshPropertyValue: function() {
                if (!this.selectedGuid) return;
                var input = document.getElementById('currentValueInput');
                input.value = 'Загрузка...';

                window.ACAPI.GetElementPropertyValue(this.selectedGuid, function(val) {
                    input.value = (val !== undefined && val !== null) ? val : '<Пусто>';
                });
            },

            // Переключение вкладок конструктора
            switchTab: function(tabId) {
                var tabs = ['tabSync', 'tabRenum', 'tabSum', 'tabSpec'];
                var btns = ['btnTabSync', 'btnTabRenum', 'btnTabSum', 'btnTabSpec'];

                for (var i = 0; i < tabs.length; i++) {
                    var el = document.getElementById(tabs[i]);
                    var btn = document.getElementById(btns[i]);
                    
                    if (tabs[i] === tabId) {
                        el.style.display = 'block';
                        btn.style.backgroundColor = '#0e639c';
                        btn.style.color = '#ffffff';
                        btn.style.fontWeight = '500';
                    } else {
                        el.style.display = 'none';
                        btn.style.backgroundColor = 'transparent';
                        btn.style.color = (this.currentTheme === 'light') ? '#333333' : '#cccccc';
                        btn.style.fontWeight = 'normal';
                    }
                }
            },

            // Вставка текста в место курсора в textarea редактора
            insertText: function(text) {
                var area = document.getElementById('editorDescArea');
                area.focus();

                if (document.selection) {
                    // IE Support
                    var sel = document.selection.createRange();
                    sel.text = text;
                } else if (area.selectionStart || area.selectionStart === 0) {
                    // Modern Standard JS
                    var startPos = area.selectionStart;
                    var endPos = area.selectionEnd;
                    area.value = area.value.substring(0, startPos) + text + area.value.substring(endPos, area.value.length);
                    area.selectionStart = startPos + text.length;
                    area.selectionEnd = startPos + text.length;
                } else {
                    area.value += text;
                }
            },

            // Сборка команды Renum из конструктора
            buildRenum: function() {
                var mode = document.getElementById('renumMode').value;
                this.insertText('Renum{' + mode + '}');
            },

            // Вызов парсинга синтаксиса в C++
            parseSyntax: function() {
                var desc = document.getElementById('editorDescArea').value;
                var self = this;

                window.ACAPI.ParsePropertyDescription(desc, function(result) {
                    if (result && result.status === 'ok') {
                        self.showStatus('✔ ' + result.message, false);
                    } else {
                        self.showStatus('❌ ' + (result ? result.message : 'Ошибка валидации'), true);
                    }
                });
            },

            // Вызов записи свойства в C++ через ACAPI_Property_ChangeProperty
            savePropertyDescription: function() {
                if (!this.selectedGuid) {
                    this.showStatus('❌ Свойство не выбрано', true);
                    return;
                }

                var desc = document.getElementById('editorDescArea').value;
                var self = this;

                window.ACAPI.SetPropertyDescription(this.selectedGuid, desc, function(result) {
                    if (result && result.status === 'ok') {
                        self.showStatus('✔ ' + result.message, false);
                        // Обновляем локальное описание в кеше
                        for (var i = 0; i < self.propertiesList.length; i++) {
                            if (self.propertiesList[i].guid === self.selectedGuid) {
                                self.propertiesList[i].description = desc;
                                document.getElementById('currentDescArea').value = desc;
                                break;
                            }
                        }
                    } else {
                        self.showStatus('❌ Ошибка записи: ' + (result ? result.message : 'Неизвестный сбой'), true);
                    }
                });
            },

            // Показать сообщение об успехе / ошибке
            showStatus: function(msg, isError) {
                var out = document.getElementById('statusOutput');
                out.style.display = 'block';
                out.innerText = msg;

                if (isError) {
                    out.style.backgroundColor = (this.currentTheme === 'light') ? '#fde8e8' : '#5a1d1d';
                    out.style.color = (this.currentTheme === 'light') ? '#9c0000' : '#f88080';
                    out.style.border = '1px solid ' + ((this.currentTheme === 'light') ? '#f8b7b7' : '#802020');
                } else {
                    out.style.backgroundColor = (this.currentTheme === 'light') ? '#e8f8e8' : '#1d4a1d';
                    out.style.color = (this.currentTheme === 'light') ? '#006000' : '#80f880';
                    out.style.border = '1px solid ' + ((this.currentTheme === 'light') ? '#b7f8b7' : '#208020');
                }
            },

            // Скрыть окно статуса
            hideStatus: function() {
                var out = document.getElementById('statusOutput');
                out.style.display = 'none';
                out.innerText = '';
            }
        };

        // Запуск приложения при загрузке DOM
        window.onload = function() {
            window.app.init();
        };
    </script>
</body>
</html>
